doorbell_preview:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: esphome
    camera_entity_id:
      required: true
      selector:
        entity:
          domain: camera
    duration_seconds:
      default: 35
      selector:
        number:
          min: 15
          max: 90
          unit_of_measurement: s
          mode: box
    event_id:
      selector:
        text: {}
report_camera_source:
  fields:
    node_name:
      required: true
      example: atmosfera-echo-hub
      selector:
        text: {}
    source:
      required: true
      example: Front camera
      selector:
        text: {}
report_tile_press:
  fields:
    node_name:
      required: true
      example: atmosfera-echo-hub
      selector:
        text: {}
    slot:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: box
report_tile_context_press:
  fields:
    node_name:
      required: true
      example: atmosfera-echo-hub
      selector:
        text: {}
    slot:
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: box
    card_id:
      required: true
      example: living-room-light
      selector:
        text: {}
    revision:
      required: true
      example: "7"
      selector:
        text: {}
report_light_control:
  fields:
    node_name:
      required: true
      selector:
        text: {}
    payload:
      required: true
      description: Bounded v1 light-control JSON; actual HA caller context is preserved.
      selector:
        text: {}
report_entity_control:
  fields:
    node_name:
      required: true
      selector:
        text: {}
    payload:
      required: true
      description: Bounded entity_control_v1 JSON; actual HA caller context is preserved.
      selector:
        text: {}
report_notification:
  fields:
    node_name:
      required: true
      selector:
        text: {}
    payload:
      required: true
      description: Internal bounded notification request; the current HA caller permissions and connection channel are checked.
      selector:
        text: {}
