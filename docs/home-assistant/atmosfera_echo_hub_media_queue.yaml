# Home Assistant package for the Atmosfera Echo Hub queue display.
#
# Required secrets on the Home Assistant host:
#   aeh_music_assistant_api_url: "http://music-assistant-host:8095/api"
#   aeh_music_assistant_authorization: "Bearer <Music Assistant token>"
#
# The official music_assistant.get_queue action exposes queue metadata plus the
# current and next item. The REST command below uses that metadata to fetch a
# seven-row window from player_queues/items, including previous tracks.

input_text:
  atmosfera_echo_hub_queue_player:
    name: Atmosfera Echo Hub Queue Player
    icon: mdi:speaker
    initial: media_player.atmosfera_echo_hub
    max: 120

rest_command:
  atmosfera_echo_hub_get_queue_items:
    url: !secret aeh_music_assistant_api_url
    method: POST
    headers:
      accept: "application/json, text/html"
      authorization: !secret aeh_music_assistant_authorization
    payload: >-
      {
        "message_id": "aeh_queue",
        "command": "player_queues/items",
        "args": {
          "queue_id": {{ queue_id | to_json }},
          "limit": {{ limit | int(7) }},
          "offset": {{ offset | int(0) }}
        }
      }
    content_type: "application/json; charset=utf-8"
    timeout: 10

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - text.atmosfera_echo_hub_media_player
          - input_text.atmosfera_echo_hub_queue_player
          - media_player.atmosfera_echo_hub
      - trigger: time_pattern
        seconds: "/5"
    actions:
      - variables:
          selected_player: >-
            {% set device_player = states('text.atmosfera_echo_hub_media_player') %}
            {% set manual_player = states('input_text.atmosfera_echo_hub_queue_player') %}
            {% if device_player is string and device_player.startswith('media_player.') %}
              {{ device_player }}
            {% elif manual_player is string and manual_player.startswith('media_player.') %}
              {{ manual_player }}
            {% else %}
              media_player.atmosfera_echo_hub
            {% endif %}
      - action: music_assistant.get_queue
        continue_on_error: true
        data:
          entity_id: "{{ selected_player }}"
        response_variable: queue_info
      - variables:
          queue_details: >-
            {% set response = queue_info | default({}) %}
            {{ response.get(selected_player, {}) if response is mapping else {} }}
          active_queue_id: >-
            {% set queue = queue_details | default({}) %}
            {% set from_response = queue.get('queue_id', '') if queue is mapping else '' %}
            {{ from_response or state_attr(selected_player, 'active_queue') or selected_player.removeprefix('media_player.') }}
          active_queue_index: >-
            {% set queue = queue_details | default({}) %}
            {{ (queue.get('current_index', 0) if queue is mapping else 0) | int(0) }}
          active_queue_offset: "{{ [active_queue_index | int(0) - 3, 0] | max }}"
      - action: rest_command.atmosfera_echo_hub_get_queue_items
        continue_on_error: true
        data:
          queue_id: "{{ active_queue_id }}"
          limit: 7
          offset: "{{ active_queue_offset }}"
        response_variable: queue_items_response
    sensor:
      - name: Atmosfera Echo Hub Media Queue
        unique_id: atmosfera_echo_hub_media_queue
        icon: mdi:playlist-music
        state: >-
          {% set response = queue_items_response | default({}) %}
          {% set content = response.get('content', '{}') if response is mapping else '{}' %}
          {% set payload = content | from_json({}) if content is string and content else content %}
          {% set result = payload.get('result', []) if payload is mapping else payload %}
          {% set items = result.get('items', []) if result is mapping else result %}
          {{ items | count if items is iterable and items is not string and items is not mapping else 0 }}
        attributes:
          player: "{{ selected_player | default('media_player.atmosfera_echo_hub', true) }}"
          queue_id: "{{ active_queue_id | default('', true) }}"
          current_index: "{{ active_queue_index | default(0, true) | int(0) }}"
          updated_at: "{{ now().isoformat() }}"
          data: >-
            {% macro clean(value) -%}
              {{- (value | default('', true) | string | replace('\t', ' ') | replace('\n', ' ') | replace('\r', ' ') | replace('|', ' ') | trim)[:64] -}}
            {%- endmacro %}
            {% macro title_from(item) -%}
              {%- set media = item.media_item | default(item.item | default({}, true), true) -%}
              {{- media.name | default(media.title | default(item.name | default(item.title | default('', true), true), true), true) -}}
            {%- endmacro %}
            {% macro artist_from(item) -%}
              {%- set media = item.media_item | default(item.item | default({}, true), true) -%}
              {%- set artist = media.artist_str | default(media.artist | default(item.artist_str | default(item.artist | default('', true), true), true), true) -%}
              {%- if artist is mapping -%}
                {{- artist.get('name', '') -}}
              {%- else -%}
                {{- artist -}}
              {%- endif -%}
            {%- endmacro %}
            {% macro duration_from(item) -%}
              {%- set media = item.media_item | default(item.item | default({}, true), true) -%}
              {%- set duration = media.duration | default(item.duration | default(0, true), true) | int(0) -%}
              {{- ((duration // 60) ~ ':' ~ ('%02d' | format(duration % 60))) if duration > 0 else '' -}}
            {%- endmacro %}
            {% set response = queue_items_response | default({}) %}
            {% set content = response.get('content', '{}') if response is mapping else '{}' %}
            {% set payload = content | from_json({}) if content is string and content else content %}
            {% set result = payload.get('result', []) if payload is mapping else payload %}
            {% set items = result.get('items', []) if result is mapping else result %}
            {% set items = items if items is iterable and items is not string and items is not mapping else [] %}
            {% set current_index = active_queue_index | default(0, true) | int(0) %}
            {% set offset = active_queue_offset | default(0, true) | int(0) %}
            {% set ns = namespace(lines=[]) %}
            {% for item in items[:7] %}
              {% set title = clean(title_from(item)) %}
              {% if title %}
                {% set current = '1' if offset + loop.index0 == current_index else '0' %}
                {% set ns.lines = ns.lines + [current ~ '\t' ~ title ~ '\t' ~ clean(artist_from(item)) ~ '\t' ~ clean(duration_from(item))] %}
              {% endif %}
            {% endfor %}
            {% if ns.lines | count == 0 %}
              {% set queue = queue_details | default({}, true) %}
              {% set current_item = queue.get('current_item') if queue is mapping else none %}
              {% set next_item = queue.get('next_item') if queue is mapping else none %}
              {% if current_item %}
                {% set title = clean(title_from(current_item)) %}
                {% if title %}
                  {% set ns.lines = ns.lines + ['1\t' ~ title ~ '\t' ~ clean(artist_from(current_item)) ~ '\t' ~ clean(duration_from(current_item))] %}
                {% endif %}
              {% endif %}
              {% if next_item and ns.lines | count < 7 %}
                {% set title = clean(title_from(next_item)) %}
                {% if title %}
                  {% set ns.lines = ns.lines + ['0\t' ~ title ~ '\t' ~ clean(artist_from(next_item)) ~ '\t' ~ clean(duration_from(next_item))] %}
                {% endif %}
              {% endif %}
            {% endif %}
            {{ ns.lines | join('\n') }}
