# Album artwork download and decoding.
# artwork_image keeps artwork handling off the main YAML and applies the LVGL byte order consistently.
image:
  - platform: file
    file: "assets/images/figma/media_artwork_figma_composed_800.jpg"
    id: album_art_placeholder
    type: RGB565
http_request:
  id: http_req
  verify_ssl: true

artwork_image:
  - url: "https://placehold.co/800x800/2d2d2d/555555.jpg"
    id: album_art_background
    format: AUTO
    type: RGB565
    resize: 800x800
    darken: 0
    # The player scene owns the static scrim. Precomposing it here adds a
    # second full-screen PPA pass before the scene crossfade and can starve the
    # small animated wave region while a new cover is being published.
    scrim_color: 0x210F48
    scrim_opacity: 0
    # Hardware JPEG is used together with the DSI/DMA2D QoS throttles in
    # modules/common/core.yaml. Software JPEG writes the full 800x800 output
    # from the CPU and can still starve the DSI reader on the PSRAM bus.
    hardware_jpeg: true
    # Keep the currently displayed generation immutable while the next JPEG
    # is decoded. The presenter freezes it only after decode completes, so the
    # wave, marquee and input remain responsive during the long operation.
    reuse_active_buffer: false
    sendspin_id: sendspin_hub
    sendspin_slot: 0
    sendspin_paused: true
    placeholder: album_art_placeholder
    # Retained compressed-input capacity prevents per-track PSRAM reallocations
    # in the same critical window as continuous MIPI DSI scanout.
    buffer_size: 262144
    allow_insecure_local_urls: true
    on_before_image_swap:
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 1 && !id(artwork_decode_ui_guard) &&
                     !id(player_artwork_presenter).is_transition_active();
          then:
            - lambda: |-
                id(artwork_decode_ui_guard) = true;
                // LvglImagePresenter owns display invalidation only for the
                // short image swap and final DSI handoff.
            - lvgl_image_presenter.prepare_transition: player_artwork_presenter
    on_download_finished:
      - script.execute: media_apply_artwork
    on_error:
      - script.execute: media_handle_artwork_error
