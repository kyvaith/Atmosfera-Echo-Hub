# Media player settings exposed through Home Assistant.
# The selected player and display behavior are runtime-configurable rather than hardcoded in the firmware.
text:
  - platform: template
    name: "Media Player"
    id: media_player_entity
    entity_category: config
    icon: "mdi:cast-audio"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${tile_media_entity}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: subscribe_media_player

  - platform: template
    name: "Music Assistant API URL"
    id: ma_api_url
    entity_category: config
    icon: "mdi:api"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 180

  - platform: template
    name: "Music Assistant API Token"
    id: ma_api_token
    entity_category: config
    icon: "mdi:key-variant"
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255

  - platform: template
    name: "Music Assistant Queue ID"
    id: ma_queue_id
    entity_category: config
    icon: "mdi:playlist-music"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 120

number:
  - platform: template
    name: "Music Assistant Queue Limit"
    id: ma_queue_limit
    min_value: 1
    max_value: 500
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
    icon: "mdi:format-list-numbered"
    entity_category: config
    mode: box

  - platform: template
    name: "Playback: Track Info Duration"
    id: track_info_duration
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    mode: box

switch:
  - platform: template
    name: "Playback: Show Remaining Time"
    id: show_remaining_time
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:timer-sand"
    entity_category: config
    on_turn_on:
      - script.execute: refresh_progress_bar_from_state
    on_turn_off:
      - script.execute: refresh_progress_bar_from_state
  - platform: template
    name: "Playback: Show Progress Bar"
    id: show_progress_bar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:progress-clock"
    entity_category: config
    on_turn_on:
      - script.execute: refresh_progress_bar_from_state
    on_turn_off:
      - script.execute: refresh_progress_bar_from_state
  - platform: template
    name: "Playback: Auto-Show Track Info"
    id: auto_show_track_info
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:text-box-outline"
    entity_category: config
    on_turn_on:
      - script.execute: show_track_info
    on_turn_off:
      - script.execute: hide_track_info
