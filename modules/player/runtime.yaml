# Dynamic media player runtime.
# This handles the selected Home Assistant media_player, dynamic subscriptions and playback state UI.

globals:
  - id: subscription_gen
    type: int
    restore_value: no
    initial_value: '0'
  - id: subscribed_media_player_entity
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ha_base_url
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_media_position
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: last_media_progress_percent
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_media_progress_permille
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_media_progress_basis_points
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_position_timestamp
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_position_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: title_received_once
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ha_position_epoch
    type: int
    restore_value: no
    initial_value: '0'
  - id: artist_has_content
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: is_track_info_hidden
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: volume_updating_from_ha
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: volume_pending_pct
    type: int
    restore_value: no
    initial_value: '-1'
  - id: volume_pending_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_artwork_url
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: media_action_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: media_action_loader_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = none, 1 = PLAYING confirms play, 2 = non-playing confirms pause,
  # 3 = changed track metadata confirms previous/next.
  - id: media_action_confirmation
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_progress_hold_basis_points
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_progress_hold_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: media_action_spinner_angle
    type: int
    restore_value: no
    initial_value: '270'
  - id: artwork_download_deferred
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: artwork_block_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_artwork_refresh_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: media_applied_artwork_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: artwork_apply_target_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: artwork_decode_ui_guard
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: artwork_refresh_generation
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: artwork_refresh_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: media_player_state_was_playing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: media_player_play_started
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: title_marquee_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: title_marquee_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: title_marquee_scroll_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: title_marquee_text_width
    type: int
    restore_value: no
    initial_value: '456'

# The gallery and player share one transition backend. Artwork stays static;
# only its two decoded buffers are blended below the existing player UI.
lvgl_image_presenter:
  - id: player_artwork_presenter
    widget: album_art_background_widget
    source: album_art_background
    # The direct-region compositor caches and reapplies the wave over every
    # crossfade frame. Copying this whole transparent island from the old DSI
    # frame would also preserve the previous artwork underneath the control.
    motion: none
    crossfade: false
    # Artwork changes must not schedule a second full-screen PPA animation next
    # to the live wave. The presenter still owns the source handoff, but LVGL
    # performs the short opacity transition without a worker-side scene blend.
    frame_interval: 100ms

script:
  - id: subscribe_media_after_boot
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: |-
              return id(boot_sequence_done) &&
                     id(ui_tile_snapshots_ready) &&
                     !id(ui_snapshot_io_busy) &&
                     !lvgl_esphome_snapshot_is_active();
          timeout: 20s
      - delay: 300ms
      - script.execute: subscribe_media_player
      - script.execute: subscribe_media_queue_sensor
      - script.execute: subscribe_speaker_group_sensor

  - id: subscribe_media_player
    mode: restart
    then:
      - lambda: |-
          if (esphome::api::global_api_server == nullptr) return;

          std::string entity = id(media_player_entity).state;
          if (entity.empty() || entity == "media_player.music_assistant" ||
              entity == "media_player.sendspin_group" ||
              entity == "media_player.atmosfera_echo_hub") {
            entity = "${tile_media_entity}";
            auto call = id(media_player_entity).make_call();
            call.set_value(entity);
            call.perform();
          }

          if (entity.rfind("media_player.", 0) != 0) {
            id(subscription_gen) += 1;
            id(subscribed_media_player_entity) = "";
            ESP_LOGW("media_select", "Invalid entity '%s' - must start with media_player.", entity.c_str());
            return;
          }

          if (entity == id(subscribed_media_player_entity)) {
            ESP_LOGD("media_select", "Already subscribed to '%s'", entity.c_str());
            return;
          }

          id(title_received_once) = false;
          id(last_media_position) = 0.0f;
          id(last_media_progress_percent) = -1;
          id(last_media_progress_permille) = -1;
          id(last_media_progress_basis_points) = -1;
          id(ha_position_epoch) = 0;
          id(last_position_timestamp) = 0;
          id(last_position_millis) = 0;
          id(last_artwork_url) = "";
          id(artist_has_content) = false;
          id(subscription_gen) += 1;
          id(subscribed_media_player_entity) = entity;

          lv_label_set_text(id(title_label), "No Track");
          lv_label_set_text(id(artist_label), "-");
          lv_label_set_text(id(album_label), "");
          lv_label_set_text(id(queue_current_title_label), "No Track");
          lv_label_set_text(id(queue_current_artist_label), "-");
          lv_label_set_text(id(media_time_label), "0:00 / 0:00");
          lv_obj_clear_flag(id(figma_media_artwork_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(artwork_primary_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(artwork_scrim), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(title_marquee_scrim), LV_OBJ_FLAG_HIDDEN);
          id(media_wavy_progress).set_background(
              id(album_art_placeholder).get_lv_image_dsc(), false);
          id(last_media_progress_percent) = 0;
          id(last_media_progress_permille) = 0;
          id(last_media_progress_basis_points) = 0;
          id(media_update_main_control).execute();
          id(media_title_marquee_reset).execute();

          int gen = id(subscription_gen);
          int *gen_ptr = &id(subscription_gen);
          auto *api = esphome::api::global_api_server;
          using state_cb = std::function<void(esphome::StringRef)>;

          auto sub_text = [&](const std::string &attr, esphome::text_sensor::TextSensor *sensor) {
            api->subscribe_home_assistant_state(entity, esphome::optional<std::string>(attr),
                state_cb([gen, gen_ptr, sensor](esphome::StringRef state) {
                  if (gen != *gen_ptr) return;
                  sensor->publish_state(state.str());
                }));
          };

          auto sub_num = [&](const std::string &attr, esphome::sensor::Sensor *sensor) {
            api->subscribe_home_assistant_state(entity, esphome::optional<std::string>(attr),
                state_cb([gen, gen_ptr, sensor](esphome::StringRef state) {
                  if (gen != *gen_ptr) return;
                  auto v = esphome::parse_number<float>(state.str());
                  if (v.has_value()) sensor->publish_state(v.value());
                }));
          };

          sub_text("media_title", id(media_title_sensor));
          sub_text("media_artist", id(media_artist_sensor));
          sub_text("media_album_name", id(media_album_sensor));
          sub_text("entity_picture", id(media_entity_picture_sensor));
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>(""),
              state_cb([gen, gen_ptr](esphome::StringRef state) {
                if (gen != *gen_ptr) return;
                id(media_player_state_sensor).publish_state(state.str());
              }));
          sub_text("media_position_updated_at", id(media_position_updated_at_sensor));
          sub_num("media_duration", id(media_duration_sensor));
          sub_num("media_position", id(media_position_sensor));
          sub_num("volume_level", id(media_volume_sensor));
          sub_text("source", id(media_source_sensor));
          sub_text("group_members", id(group_members_sensor));

          ESP_LOGI("media_select", "Subscribed to '%s'", entity.c_str());

  - id: show_track_info
    mode: restart
    then:
      - lambda: |-
          id(is_track_info_hidden) = false;
      - lvgl.widget.show:
          - title_label
      - if:
          condition:
            lambda: 'return id(artist_has_content);'
          then:
            - lvgl.widget.show: artist_label

  - id: hide_track_info
    mode: restart
    then:
      - lambda: |-
          id(is_track_info_hidden) = true;
      - lvgl.widget.hide:
          - album_label
          - media_time_label

  - id: start_hide_track_info_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(auto_show_track_info).state && id(track_info_duration).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t)(id(track_info_duration).state * 1000.0f);'
            - if:
                condition:
                  lambda: |-
                    return id(media_player_state_sensor).has_state()
                        && (id(media_player_state_sensor).state == "PLAYING" ||
                            id(media_player_state_sensor).state == "playing");
                then:
                  - script.execute: hide_track_info

  - id: debounce_artwork_download
    mode: restart
    then:
      - delay: 100ms
      - lambda: |-
          const bool voice_busy = id(ui_active_app) == 3 ||
                                  lv_obj_is_visible(id(voice_assistant_overlay));
          const bool artwork_blocked = id(media_action_pending) ||
                                       id(ui_snapshot_io_busy) ||
                                       !id(boot_sequence_done) ||
                                       (int32_t)(id(artwork_block_until) - millis()) > 0;
          const bool artwork_needed = id(ui_active_app) == 1;
          if (voice_busy || artwork_blocked || !artwork_needed) {
            id(artwork_download_deferred) = true;
          }
      - if:
          condition:
            lambda: |-
              const bool artwork_blocked = id(media_action_pending) ||
                                           id(ui_snapshot_io_busy) ||
                                           !id(boot_sequence_done) ||
                                           (int32_t)(id(artwork_block_until) - millis()) > 0;
              return !id(last_artwork_url).empty() &&
                     !lv_obj_is_visible(id(voice_assistant_overlay)) &&
                     id(ui_active_app) == 1 &&
                     !artwork_blocked;
          then:
            - lambda: id(artwork_download_deferred) = false;
            - artwork_image.set_url:
                id: album_art_background
                update: true
                url: !lambda 'return id(last_artwork_url);'

  - id: media_resume_deferred_artwork
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const bool artwork_blocked = id(media_action_pending) ||
                                           id(ui_snapshot_io_busy) ||
                                           !id(boot_sequence_done) ||
                                           (int32_t)(id(artwork_block_until) - millis()) > 0;
              return id(artwork_download_deferred) &&
                     !lv_obj_is_visible(id(voice_assistant_overlay)) &&
                     id(ui_active_app) == 1 &&
                     !artwork_blocked;
          then:
            - if:
                condition:
                  lambda: 'return !id(last_artwork_url).empty();'
                then:
                  - lambda: id(artwork_download_deferred) = false;
                  - script.execute: debounce_artwork_download
                else:
                  - script.execute: media_apply_artwork

  - id: media_resume_artwork_after_player_open
    mode: restart
    then:
      - lambda: |-
          if (id(ui_active_app) != 1 || id(ui_snapshot_io_busy)) {
            id(artwork_download_deferred) = true;
            return;
          }
          id(album_art_background).set_sendspin_paused(false);
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 1 && !id(ui_snapshot_io_busy) &&
                     id(album_art_background).get_width() > 0 &&
                     id(album_art_background).get_height() > 0;
          then:
            - script.execute: media_apply_artwork
          else:
            # After a reboot SendSpin can restore metadata before its artwork
            # buffer is decoded. Publishing an empty image only marks the
            # request deferred forever; retry the existing URL so the normal
            # hardware-JPEG path fills the live buffer when Player is visible.
            - if:
                condition:
                  lambda: |-
                    return id(ui_active_app) == 1 && !id(ui_snapshot_io_busy) &&
                           !id(last_artwork_url).empty();
                then:
                  - script.execute: debounce_artwork_download

  - id: refresh_progress_bar_from_state
    mode: restart
    then:
      - lambda: |-
          if (id(ui_active_app) == 3 || lv_obj_is_visible(id(voice_assistant_overlay))) {
            return;
          }

          float dur = id(media_duration_sensor).has_state() ? id(media_duration_sensor).state : 0.0f;
          float pos = id(last_media_position);
          bool playing = id(media_player_state_sensor).has_state()
              && (id(media_player_state_sensor).state == "PLAYING" ||
                  id(media_player_state_sensor).state == "playing");
          bool paused = id(media_player_state_sensor).has_state()
              && (id(media_player_state_sensor).state == "PAUSED" ||
                  id(media_player_state_sensor).state == "paused");
          const bool idle = id(media_player_state_sensor).has_state()
              && (id(media_player_state_sensor).state == "IDLE" ||
                  id(media_player_state_sensor).state == "idle");
          const bool paused_like = paused || idle;
          bool active_media = id(media_player_state_sensor).has_state()
              && id(media_player_state_sensor).state != "IDLE"
              && id(media_player_state_sensor).state != "idle"
              && id(media_player_state_sensor).state != "OFF"
              && id(media_player_state_sensor).state != "off"
              && id(media_player_state_sensor).state != "STANDBY"
              && id(media_player_state_sensor).state != "standby"
              && id(media_player_state_sensor).state != "STOPPED"
              && id(media_player_state_sensor).state != "stopped";

          auto t = id(ha_time).now();
          if (playing && t.is_valid() && id(ha_position_epoch) != 0 && id(media_position_sensor).has_state()) {
            pos = id(media_position_sensor).state + (float)(t.timestamp - id(ha_position_epoch));
          } else if (playing && id(last_position_millis) != 0) {
            pos += (float)(millis() - id(last_position_millis)) / 1000.0f;
          }

          if (pos < 0.0f) pos = 0.0f;
          if (dur > 0.0f && pos > dur) pos = dur;
          if (playing) id(last_media_position) = pos;
          if (t.is_valid()) id(last_position_timestamp) = t.timestamp;
          id(last_position_millis) = millis();

          const int progress_range = 10000;
          int value = 0;
          const bool progress_hold_active =
              id(media_progress_hold_until) != 0 &&
              (int32_t) (id(media_progress_hold_until) - millis()) > 0;
          if ((paused_like || progress_hold_active) && id(media_progress_hold_basis_points) >= 0) {
            // Keep the exact visible endpoint throughout command feedback.
            // SendSpin can briefly publish a near-zero position while the
            // state still says PLAYING, then report IDLE for pause. Trusting
            // that transient echo made the wave jump backwards before it
            // stopped rotating.
            value = id(media_progress_hold_basis_points);
          } else if (dur > 0.0f) {
            value = (int)((pos / dur) * (float)progress_range + 0.5f);
          } else if (progress_hold_active) {
            value = id(media_progress_hold_basis_points);
          } else if (playing || active_media) {
            value = progress_range;
          }
          if (value < 0) value = 0;
          if (value > progress_range) value = progress_range;
          id(media_wavy_progress).initialize();
          id(media_wavy_progress).set_value_basis_points(value);
          const int permille = (value + 5) / 10;
          const int percent = (value + 50) / 100;
          if (value != id(last_media_progress_basis_points)) {
            id(last_media_progress_basis_points) = value;
            id(last_media_progress_permille) = permille;
            id(last_media_progress_percent) = percent;
          }

          int e = (int)pos;
          if (e < 0) e = 0;
          char buf[40];
          if (id(show_remaining_time).state) {
            int rem = (int)(dur - pos);
            if (rem < 0) rem = 0;
            if (dur >= 3600.0f) {
              snprintf(buf, sizeof(buf), "%d:%02d:%02d / -%d:%02d:%02d",
                       e / 3600, (e % 3600) / 60, e % 60,
                       rem / 3600, (rem % 3600) / 60, rem % 60);
            } else {
              snprintf(buf, sizeof(buf), "%d:%02d / -%d:%02d", e / 60, e % 60, rem / 60, rem % 60);
            }
          } else {
            int d = (int)dur;
            if (d < 0) d = 0;
            if (dur >= 3600.0f) {
              snprintf(buf, sizeof(buf), "%d:%02d:%02d / %d:%02d:%02d",
                       e / 3600, (e % 3600) / 60, e % 60,
                       d / 3600, (d % 3600) / 60, d % 60);
            } else {
              snprintf(buf, sizeof(buf), "%d:%02d / %d:%02d", e / 60, e % 60, d / 60, d % 60);
            }
          }
          if (!lv_obj_has_flag(id(media_time_label), LV_OBJ_FLAG_HIDDEN)) {
            const char *current = lv_label_get_text(id(media_time_label));
            if (current == nullptr || strcmp(current, buf) != 0) {
              lv_label_set_text(id(media_time_label), buf);
            }
          }

  - id: media_update_main_control
    mode: restart
    then:
      - lambda: |-
          int progress = id(last_media_progress_basis_points);
          if (progress < 0 && id(last_media_progress_permille) >= 0) progress = id(last_media_progress_permille) * 10;
          if (progress < 0 && id(last_media_progress_percent) >= 0) progress = id(last_media_progress_percent) * 100;
          if (progress < 0) progress = 0;
          if (progress > 10000) progress = 10000;
          const bool playing = id(media_player_state_sensor).has_state()
              && (id(media_player_state_sensor).state == "PLAYING" ||
                  id(media_player_state_sensor).state == "playing");
          const bool active_media = id(media_player_state_sensor).has_state()
              && id(media_player_state_sensor).state != "IDLE"
              && id(media_player_state_sensor).state != "idle"
              && id(media_player_state_sensor).state != "OFF"
              && id(media_player_state_sensor).state != "off"
              && id(media_player_state_sensor).state != "STANDBY"
              && id(media_player_state_sensor).state != "standby"
              && id(media_player_state_sensor).state != "STOPPED"
              && id(media_player_state_sensor).state != "stopped";
          const float dur = id(media_duration_sensor).has_state() ? id(media_duration_sensor).state : 0.0f;
          const bool progress_hold_active =
              id(media_progress_hold_until) != 0 &&
              (int32_t) (id(media_progress_hold_until) - millis()) > 0;
          if (progress_hold_active) {
            progress = id(media_progress_hold_basis_points);
          } else if (dur <= 0.0f && active_media) {
            progress = 10000;
          } else if (progress < 0) {
            progress = 0;
          }
          id(media_wavy_progress).initialize();
          id(media_wavy_progress).set_value_basis_points(progress);
          if (progress != id(last_media_progress_basis_points)) {
            // Keep the command-feedback snapshot in sync with the value that
            // is actually visible. This matters for streams: their rendered
            // progress is 100%, while the last timed-position update may
            // still contain 0% from before playback started.
            id(last_media_progress_basis_points) = progress;
            id(last_media_progress_permille) = (progress + 5) / 10;
            id(last_media_progress_percent) = (progress + 50) / 100;
          }
          // The icon follows the confirmed backend state. Playing and loader
          // visibility are one renderer transaction, so no intermediate
          // play/pause frame can escape while a transport action settles.
          id(media_wavy_progress).set_playback_state(playing, id(media_action_loader_visible));

  - id: media_title_marquee_reset
    mode: restart
    then:
      - script.stop: media_title_marquee_start_delayed
      - lambda: |-
          id(media_title_marquee).end(true);
          id(title_marquee_active) = false;
          id(title_marquee_start_ms) = 0;
          id(title_marquee_scroll_ms) = 0;

          const int viewport_w = lv_obj_get_content_width(id(title_marquee_viewport));
          const char *text = lv_label_get_text(id(title_label));
          if (text == nullptr) text = "";

          lv_point_t text_size;
          lv_text_get_size(&text_size, text,
                           lv_obj_get_style_text_font(id(title_label), LV_PART_MAIN),
                           lv_obj_get_style_text_letter_space(id(title_label), LV_PART_MAIN),
                           lv_obj_get_style_text_line_space(id(title_label), LV_PART_MAIN),
                           LV_COORD_MAX, LV_TEXT_FLAG_NONE);

          int text_w = text_size.x + 8;
          if (text_w < viewport_w) text_w = viewport_w;
          id(title_marquee_text_width) = text_w;

          lv_label_set_long_mode(id(title_label), LV_LABEL_LONG_CLIP);
          if (lv_obj_get_width(id(title_label)) != text_w) {
            lv_obj_set_width(id(title_label), text_w);
          }
          if (lv_obj_get_x(id(title_label)) != 0) {
            lv_obj_set_x(id(title_label), 0);
          }
          lv_obj_set_style_text_align(id(title_label),
                                      text_w > viewport_w ? LV_TEXT_ALIGN_LEFT : LV_TEXT_ALIGN_CENTER,
                                      LV_PART_MAIN);

  - id: media_title_marquee_start_delayed
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          const bool voice_visible = id(ui_active_app) == 3 ||
                                     lv_obj_is_visible(id(voice_assistant_overlay));
          if (id(ui_active_app) != 1 || voice_visible || id(ui_snapshot_io_busy) ||
              id(media_speaker_panel_open) || id(global_volume_dragging) ||
              !lv_obj_has_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN) ||
              !lv_obj_has_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN) ||
              !lv_obj_has_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN) ||
              !lv_obj_has_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN) ||
              !id(display_backlight).current_values.is_on()) {
            return;
          }
          const int overflow = id(title_marquee_text_width) -
                               lv_obj_get_content_width(id(title_marquee_viewport));
          if (overflow <= 0) {
            return;
          }
          // Match one source pixel to one 60-Hz display frame. The PPA region
          // compositor then receives a new integer position for every frame,
          // instead of periodically repeating a position and looking jerky.
          const uint32_t duration = ((uint32_t) overflow * 1000U + 59U) / 60U;
          id(title_marquee_scroll_ms) = duration;
          // The direct renderer first presents the exact native position and
          // atomically takes ownership from the LVGL label. Start the motion
          // clock only after that handoff is confirmed; otherwise the first
          // visible direct frame is already offset and looks like a blink.
          id(title_marquee_start_ms) = 0;
          id(title_marquee_active) = id(media_title_marquee).begin();
          if (!id(title_marquee_active)) {
            id(title_marquee_start_ms) = 0;
            id(title_marquee_scroll_ms) = 0;
          }

  - id: media_title_marquee_pause_direct
    mode: restart
    then:
      - lambda: |-
          id(media_title_marquee).end(true);
          id(title_marquee_active) = false;
          id(title_marquee_start_ms) = 0;
          id(title_marquee_scroll_ms) = 0;
          if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);

  - id: media_title_marquee_reset_and_start
    mode: restart
    then:
      - script.execute: media_title_marquee_reset
      - script.execute: media_title_marquee_start_delayed

  - id: media_transport_feedback_release
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return id(media_transport_feedback).release();'
          timeout: 120ms

  - id: media_transport_previous
    mode: restart
    then:
      - script.execute:
          id: media_show_action_spinner
          track_change: true
      - media_player.previous: sendspin_group

  - id: media_transport_next
    mode: restart
    then:
      - script.execute:
          id: media_show_action_spinner
          track_change: true
      - media_player.next: sendspin_group

  - id: media_show_action_spinner
    mode: restart
    parameters:
      track_change: bool
    then:
      - script.stop: media_hide_action_spinner_delayed
      - lambda: |-
          const bool playing = id(media_player_state_sensor).has_state() &&
              (id(media_player_state_sensor).state == "PLAYING" ||
               id(media_player_state_sensor).state == "playing");
          id(media_action_confirmation) = track_change ? 3 : (playing ? 2 : 1);
          id(media_action_pending) = true;
          id(media_action_loader_visible) = false;
          int hold = id(media_wavy_progress).get_value_basis_points();
          if (hold < 0) hold = id(last_media_progress_basis_points);
          if (hold < 0 && id(last_media_progress_permille) >= 0) hold = id(last_media_progress_permille) * 10;
          if (hold < 0 && id(last_media_progress_percent) >= 0) hold = id(last_media_progress_percent) * 100;
          if (hold < 0) hold = 0;
          if (hold > 10000) hold = 10000;
          id(media_progress_hold_basis_points) = hold;
          id(media_progress_hold_until) = millis() + 1500U;
          lv_obj_add_flag(id(media_action_spinner_arc), LV_OBJ_FLAG_HIDDEN);
          id(media_wavy_progress).initialize();
          id(media_wavy_progress).set_playback_state(playing, false);
      - script.execute: media_show_action_progress_delayed
      - script.execute: media_action_spinner_timeout

  - id: media_hide_action_spinner
    mode: restart
    then:
      - script.stop: media_show_action_progress_delayed
      - lambda: |-
          id(media_action_pending) = false;
          id(media_action_loader_visible) = false;
          id(media_action_confirmation) = 0;
          lv_obj_add_flag(id(media_action_spinner_arc), LV_OBJ_FLAG_HIDDEN);
          id(media_wavy_progress).initialize();
          id(media_update_main_control).execute();

  - id: media_show_action_progress_delayed
    mode: restart
    then:
      - delay: 1s
      - lambda: |-
          if (!id(media_action_pending)) {
            return;
          }
          const bool playing = id(media_player_state_sensor).has_state() &&
              (id(media_player_state_sensor).state == "PLAYING" ||
               id(media_player_state_sensor).state == "playing");
          id(media_action_loader_visible) = true;
          id(media_wavy_progress).initialize();
          id(media_wavy_progress).set_playback_state(playing, true);

  - id: media_hide_action_spinner_delayed
    mode: restart
    then:
      - delay: 450ms
      - script.execute: media_hide_action_spinner

  - id: media_action_spinner_timeout
    mode: restart
    then:
      - delay: 4s
      - script.execute: media_hide_action_spinner

  - id: show_volume_overlay
    mode: restart
    then:
      - lambda: |-
          id(global_volume_time_press_tracking) = false;
          lvgl_esphome_direct_regions_pause(true, 150);
          id(media_wavy_progress).set_direct_present(false);
          id(media_title_marquee).end(true);
          lvgl_esphome_direct_regions_pause(false, 0);
          if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);
          lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(global_volume_activation_surface), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(global_volume_overlay));
          const int pct = id(global_volume_renderer).clamp_pct(id(global_volume_pct));
          id(global_volume_knob_pct) = pct;
          id(global_volume_renderer).update(pct, pct);
          lv_obj_fade_in(id(global_volume_overlay), 120, 0);
          lv_obj_invalidate(id(global_volume_overlay));
          lv_refr_now(nullptr);
      - script.execute: volume_overlay_timeout

  - id: global_volume_begin_drag
    mode: restart
    then:
      - script.stop: volume_overlay_timeout
      - lambda: |-
          lvgl_esphome_direct_regions_pause(true, 150);
          id(media_wavy_progress).set_direct_present(false);
          id(media_title_marquee).end(true);
          lvgl_esphome_direct_regions_pause(false, 0);
          if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);
          id(global_volume_time_press_tracking) = false;
          id(ui_navigation).set_external_touch_capture(true);
          id(global_volume_dragging) = true;
          id(global_volume_drag_start_pct) = id(global_volume_renderer).clamp_pct(id(global_volume_pct));
          id(global_volume_knob_pct) = 50;
          lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(global_volume_activation_surface), LV_OBJ_FLAG_HIDDEN);
          id(global_volume_renderer).set_activation_widget_was_visible(!id(global_volume_activation_suppressed));
          const bool direct_ready = id(global_volume_renderer).begin(id(global_volume_drag_start_pct), 50);
          if (!direct_ready) {
            id(global_volume_renderer).update(id(global_volume_drag_start_pct), 50);
            lv_obj_clear_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(global_volume_overlay));
            lv_obj_invalidate(id(global_volume_overlay));
            lv_refr_now(nullptr);
          }

  - id: global_volume_long_press_guard
    mode: restart
    then:
      - delay: 250ms
      - if:
          condition:
            lambda: |-
              return id(global_volume_time_press_tracking) && !id(global_volume_dragging);
          then:
            - script.execute: global_volume_begin_drag

  - id: global_volume_finish_drag
    mode: restart
    then:
      - lambda: |-
          id(global_volume_time_press_tracking) = false;
          id(global_volume_dragging) = false;
          if (id(global_volume_pct) != id(global_volume_last_sent_pct)) {
            id(global_volume_send_pending) = true;
          }
          const bool direct_presented = id(global_volume_renderer).is_active();
          id(global_volume_renderer).end();
          lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
          if (id(global_volume_activation_suppressed))
            lv_obj_add_flag(id(global_volume_activation_surface), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(global_volume_activation_surface), LV_OBJ_FLAG_HIDDEN);
          // A direct overlay restores the captured frame itself. Forcing an
          // LVGL refresh here races the direct slideshow/camera renderer that
          // has just resumed and produces horizontal strips. Native fallback
          // still needs an immediate refresh.
          if (!direct_presented)
            lv_refr_now(nullptr);
      - script.execute: global_volume_send_to_ha
      - script.execute: global_volume_release_touch_capture

  - id: global_volume_release_touch_capture
    mode: restart
    then:
      # The physical RELEASE which closes the direct overlay is still pending
      # in LVGL's indev queue. Keep navigation captured through one complete UI
      # cycle so that release cannot click the Home tile below the clock.
      - lambda: 'lv_indev_reset(nullptr, nullptr);'
      - delay: 80ms
      - lambda: |-
          lv_indev_reset(nullptr, nullptr);
          id(ui_navigation).set_external_touch_capture(false);

  - id: global_volume_send_to_ha
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(global_volume_send_pending);'
          then:
            - lambda: |-
                id(global_volume_send_pending) = false;
                id(global_volume_last_sent_pct) = id(global_volume_renderer).clamp_pct(id(global_volume_pct));
                id(global_volume_last_send_ms) = millis();
                id(volume_pending_pct) = id(global_volume_last_sent_pct);
                id(volume_pending_until) = millis() + 1500;
            - media_player.volume_set:
                id: sendspin_group
                volume: !lambda 'return id(global_volume_renderer).clamp_pct(id(global_volume_pct)) / 100.0f;'

  - id: open_queue_panel
    mode: restart
    then:
      - lambda: |-
          lvgl_esphome_direct_regions_pause(true, 150);
          id(media_wavy_progress).set_direct_present(false);
          id(media_title_marquee).end(true);
          if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);
      - lvgl.widget.show: queue_panel
      - lambda: |-
          lv_obj_move_foreground(id(queue_panel));
          lv_obj_invalidate(id(queue_panel));
          lv_refr_now(nullptr);
          lvgl_esphome_direct_regions_pause(false, 0);
      - script.execute: subscribe_media_queue_sensor
      - delay: 150ms
      - script.execute: update_media_queue_panel

  - id: close_queue_panel
    mode: restart
    then:
      - lvgl.widget.hide: queue_panel

  - id: volume_overlay_timeout
    mode: restart
    then:
      - delay: 2500ms
      - lambda: |-
          if (!id(global_volume_dragging)) {
            lv_obj_fade_out(id(global_volume_overlay), 120, 0);
            if (id(global_volume_activation_suppressed))
              lv_obj_add_flag(id(global_volume_activation_surface), LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(id(global_volume_activation_surface), LV_OBJ_FLAG_HIDDEN);
          }
      - delay: 130ms
      - if:
          condition:
            lambda: 'return !id(global_volume_dragging);'
          then:
            - lvgl.widget.hide: global_volume_overlay

  - id: main_volume_step
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          int pct = id(global_volume_renderer).clamp_pct(id(global_volume_pct) + (direction > 0 ? 1 : -1));
          id(global_volume_pct) = pct;
          id(global_volume_knob_pct) = pct;
          id(volume_updating_from_ha) = false;
          id(audio_stack).set_output_volume(pct / 100.0f);
          id(global_volume_renderer).update(pct, pct);
          id(global_volume_send_pending) = true;
          id(global_volume_last_send_ms) = 0;
      - script.execute: global_volume_send_to_ha
      - script.execute: show_volume_overlay

  - id: media_show_lottie_visual
    mode: restart
    then:
      # Compatibility hook retained for navigation scripts. The old hidden
      # player Lottie rendered continuously even though its 1x1 canvas was
      # invisible; the artwork placeholder is now the only idle visual.
      - lambda: 'return;'

  - id: media_hide_lottie_visual
    mode: restart
    then:
      - lambda: 'return;'

  - id: media_apply_artwork
    mode: restart
    then:
      # SendSpin commonly publishes station artwork and track artwork back to
      # back. Coalesce that burst and let an already-running frame handoff
      # finish; cancelling it mid-PPA pass can leave the DSI scene owned by a
      # stale generation.
      - delay: 80ms
      - lambda: |-
          ESP_LOGW("artwork.ui",
                   "apply requested trace=%u generation=%u applied=%u target=%u app=%d phase=%d snapshot=%s "
                   "transition=%s prepared=%s guard=%s",
                   static_cast<unsigned>(id(album_art_background).get_trace_id()),
                   static_cast<unsigned>(id(album_art_background).get_buffer_generation()),
                   static_cast<unsigned>(id(media_applied_artwork_generation)),
                   static_cast<unsigned>(id(artwork_apply_target_generation)), id(ui_active_app),
                   id(voice_assistant_phase),
                   YESNO(id(ui_snapshot_io_busy)),
                   YESNO(id(player_artwork_presenter).is_transition_active()),
                   YESNO(id(player_artwork_presenter).is_transition_prepared()),
                   YESNO(id(artwork_decode_ui_guard)));
      - wait_until:
          condition:
            lambda: 'return !id(player_artwork_presenter).is_transition_active();'
          timeout: 3000ms
      - if:
          condition:
            lambda: |-
              const bool voice_busy = id(ui_active_app) == 3 ||
                                      lv_obj_is_visible(id(voice_assistant_overlay));
              return id(player_artwork_presenter).is_transition_active() || voice_busy ||
                     id(ui_snapshot_io_busy) || !id(boot_sequence_done) || id(ui_active_app) != 1;
          then:
            - lambda: |-
                ESP_LOGW("artwork.ui",
                         "apply deferred trace=%u generation=%u app=%d phase=%d snapshot=%s transition=%s",
                         static_cast<unsigned>(id(album_art_background).get_trace_id()),
                         static_cast<unsigned>(id(album_art_background).get_buffer_generation()), id(ui_active_app),
                         id(voice_assistant_phase), YESNO(id(ui_snapshot_io_busy)),
                         YESNO(id(player_artwork_presenter).is_transition_active()));
                id(artwork_download_deferred) = true;
                if (!id(player_artwork_presenter).is_transition_active())
                  id(player_artwork_presenter).cancel_transition();
                id(artwork_decode_ui_guard) = false;
                id(artwork_refresh_pending) = false;
          else:
            # Hide the idle visual before publishing the artwork so both
            # visibility changes are rendered in the same full frame.
            - script.execute: media_hide_lottie_visual
            - lambda: |-
                if (id(album_art_background).get_width() <= 0 || id(album_art_background).get_height() <= 0) {
                  id(artwork_download_deferred) = true;
                  id(player_artwork_presenter).cancel_transition();
                  id(artwork_decode_ui_guard) = false;
                  id(artwork_refresh_pending) = false;
                  return;
                }
                id(artwork_download_deferred) = false;
                auto *img = id(album_art_background_widget);
                auto *src = id(album_art_background).get_lv_image_dsc();
                const uint32_t artwork_trace_id = id(album_art_background).get_trace_id();
                const uint32_t artwork_generation = id(album_art_background).get_buffer_generation();
                const bool source_changed = artwork_generation != 0 &&
                                            artwork_generation != id(media_applied_artwork_generation);
                ESP_LOGW("artwork.ui",
                         "apply accepted trace=%u generation=%u applied=%u changed=%s src=%p background_ready=%s",
                         static_cast<unsigned>(artwork_trace_id), static_cast<unsigned>(artwork_generation),
                         static_cast<unsigned>(id(media_applied_artwork_generation)), YESNO(source_changed), src,
                         YESNO(id(media_wavy_progress).is_background_ready()));
                ESP_LOGD("artwork.ui", "artwork trace #%u ui apply start uptime=%lums src=%p img=%p",
                         artwork_trace_id, millis(), src, img);
                if (source_changed) {
                  // Park the direct marquee before the incoming LVGL scene is
                  // captured. Otherwise the static title in the captured
                  // frame and the old direct marquee region can briefly be
                  // presented together during the artwork handoff.
                  id(media_title_marquee).end(true);
                  id(title_marquee_active) = false;
                  id(title_marquee_start_ms) = 0;
                  id(title_marquee_scroll_ms) = 0;
                  if (lv_obj_get_x(id(title_label)) != 0)
                    lv_obj_set_x(id(title_label), 0);
                  lv_obj_add_flag(id(title_marquee_scrim), LV_OBJ_FLAG_HIDDEN);
                  id(artwork_apply_target_generation) = artwork_generation;
                  const bool first_visible_artwork = id(media_applied_artwork_generation) == 0;
                  if (!first_visible_artwork && !id(player_artwork_presenter).is_transition_prepared() &&
                      !id(player_artwork_presenter).prepare_transition()) {
                    ESP_LOGW("artwork.ui", "unable to prepare artwork transition for trace #%u",
                             static_cast<unsigned>(artwork_trace_id));
                  }
                }
                if (!lv_obj_has_flag(id(figma_media_artwork_widget), LV_OBJ_FLAG_HIDDEN)) {
                  lv_obj_add_flag(id(figma_media_artwork_widget), LV_OBJ_FLAG_HIDDEN);
                }
                if (lv_obj_has_flag(img, LV_OBJ_FLAG_HIDDEN)) {
                  lv_obj_clear_flag(img, LV_OBJ_FLAG_HIDDEN);
                }
                // Keep the purple artwork scrim above every decoded cover;
                // the private wave backdrop must never become visible itself.
                lv_obj_clear_flag(id(artwork_primary_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(artwork_scrim), LV_OBJ_FLAG_HIDDEN);
                if (!lv_obj_has_flag(id(artwork_error_label), LV_OBJ_FLAG_HIDDEN)) {
                  lv_obj_add_flag(id(artwork_error_label), LV_OBJ_FLAG_HIDDEN);
                }
                if (source_changed) {
                  const bool first_visible_artwork = id(media_applied_artwork_generation) == 0;
                  if (first_visible_artwork) {
                    // There is no previous cover to preserve on the first
                    // publish. Avoid creating a second 800x800 PSRAM scene
                    // just to crossfade from the placeholder; that allocation
                    // blocks the wave and can make the player look frozen.
                    lv_image_set_src(img, src);
                    lv_obj_invalidate(img);
                    id(media_applied_artwork_generation) = artwork_generation;
                    id(artwork_refresh_generation) = 0;
                    id(artwork_refresh_pending) = false;
                    id(player_artwork_presenter).cancel_transition();
                    ESP_LOGI("artwork.ui", "first artwork published directly trace=%u generation=%u",
                             static_cast<unsigned>(artwork_trace_id), static_cast<unsigned>(artwork_generation));
                  } else {
                    // Build the wave's private backdrop once per artwork
                    // generation. Reopening the player with the same image
                    // must not rebuild or cancel its direct-region state.
                    id(media_wavy_progress).set_background(src, true);
                    id(artwork_refresh_generation) = lvgl_esphome_get_direct_region_base_generation();
                    id(artwork_refresh_pending) = true;
                  }
                } else {
                  if (id(player_artwork_presenter).is_transition_prepared())
                    id(player_artwork_presenter).cancel_transition();
                  id(artwork_refresh_pending) = false;
                }
            - wait_until:
                condition:
                  lambda: |-
                    return !id(artwork_refresh_pending) || id(media_wavy_progress).is_background_ready();
                timeout: 1500ms
            - lambda: |-
                const bool background_ready = id(media_wavy_progress).is_background_ready();
                const bool transition_started =
                    id(artwork_refresh_pending) && background_ready &&
                    id(player_artwork_presenter).transition_to(id(album_art_background), 300);
                ESP_LOGW("artwork.ui",
                         "present trace=%u generation=%u pending=%s background_ready=%s started=%s",
                         static_cast<unsigned>(id(album_art_background).get_trace_id()),
                         static_cast<unsigned>(id(album_art_background).get_buffer_generation()),
                         YESNO(id(artwork_refresh_pending)),
                         YESNO(background_ready), YESNO(transition_started));
                if (id(artwork_refresh_pending) && !transition_started) {
                  if (id(artwork_refresh_pending) && !background_ready) {
                    ESP_LOGW("artwork.ui", "wave backdrop was not ready before artwork presentation");
                  }
                  id(player_artwork_presenter).cancel_transition();
                }
                id(artwork_decode_ui_guard) = false;
                if (id(artwork_refresh_pending) && !transition_started) {
                  // Direct/full-refresh mode turns this into one complete
                  // player frame. Do not call lv_refr_now() here: this script
                  // runs from the artwork completion callback, and a nested
                  // synchronous refresh can wait on the display pipeline for
                  // many seconds. The normal LVGL loop renders the queued
                  // frame while the regional compositors remain quiescent.
                  lv_obj_invalidate(id(wear_root));
                }
            - wait_until:
                condition:
                  lambda: 'return !id(player_artwork_presenter).is_transition_active();'
                timeout: 2500ms
            - lambda: |-
                const bool transition_complete = !id(player_artwork_presenter).is_transition_active();
                if (!transition_complete) {
                  ESP_LOGW("artwork.ui", "artwork handoff still active for generation %u",
                           static_cast<unsigned>(id(artwork_apply_target_generation)));
                } else if (!id(player_artwork_presenter).transition_failed()) {
                  id(media_applied_artwork_generation) = id(artwork_apply_target_generation);
                }
                id(artwork_decode_ui_guard) = false;
                id(artwork_refresh_pending) = false;
            - script.execute: media_title_marquee_reset_and_start
            - script.execute: start_hide_track_info_timer

  - id: media_handle_artwork_error
    mode: restart
    then:
      - lambda: |-
          id(media_applied_artwork_generation) = 0;
          id(player_artwork_presenter).cancel_transition();
          id(artwork_decode_ui_guard) = false;
          id(artwork_refresh_pending) = false;
          id(media_title_marquee).end(true);
          lv_obj_add_flag(id(title_marquee_scrim), LV_OBJ_FLAG_HIDDEN);
          id(media_wavy_progress).set_background(
              id(album_art_placeholder).get_lv_image_dsc(), false);
      - if:
          condition:
            lambda: 'return lv_obj_has_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN);'
          then:
            - lvgl.widget.show: figma_media_artwork_widget
            - lvgl.widget.hide:
                - artwork_primary_overlay
                - artwork_scrim
            - lvgl.widget.show: artwork_error_label
      - if:
          condition:
            lambda: 'return id(ui_page) == 0;'
          then:
            - script.execute: media_show_lottie_visual

text_sensor:
  - platform: sendspin
    id: sendspin_media_title
    sendspin_id: sendspin_hub
    type: title
    internal: true
    filters:
      - sanitize_html:
    on_value:
      - text_sensor.template.publish:
          id: media_title_sensor
          state: !lambda 'return x;'

  - platform: sendspin
    id: sendspin_media_artist
    sendspin_id: sendspin_hub
    type: artist
    internal: true
    filters:
      - sanitize_html:
    on_value:
      - text_sensor.template.publish:
          id: media_artist_sensor
          state: !lambda 'return x;'

  - platform: sendspin
    id: sendspin_media_album
    sendspin_id: sendspin_hub
    type: album
    internal: true
    filters:
      - sanitize_html:
    on_value:
      - text_sensor.template.publish:
          id: media_album_sensor
          state: !lambda 'return x;'

  - platform: sendspin
    id: sendspin_media_artwork_url
    sendspin_id: sendspin_hub
    type: artwork_url
    internal: true
    on_value:
      - text_sensor.template.publish:
          id: media_entity_picture_sensor
          state: !lambda 'return x;'

  - platform: template
    id: media_title_sensor
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - if:
                condition:
                  lambda: |-
                    return id(media_action_pending) &&
                           id(media_action_confirmation) == 3;
                then:
                  - script.execute: media_hide_action_spinner
            - if:
                condition:
                  lambda: 'return id(auto_show_track_info).state;'
                then:
                  - script.execute: show_track_info
            - script.execute: media_title_marquee_pause_direct
            - lvgl.label.update:
                id: title_label
                text: !lambda 'return x;'
            - script.execute: media_title_marquee_reset_and_start
            - lvgl.label.update:
                id: queue_current_title_label
                text: !lambda 'return x;'
            - lambda: |-
                if (id(title_received_once)) {
                  id(last_media_position) = 0.0f;
                  id(last_media_progress_percent) = -1;
                  id(last_media_progress_permille) = -1;
                  id(last_media_progress_basis_points) = -1;
                  id(ha_position_epoch) = 0;
                  auto t = id(ha_time).now();
                  if (t.is_valid()) id(last_position_timestamp) = t.timestamp;
                  id(last_position_millis) = millis();
                  id(refresh_progress_bar_from_state).execute();
                } else {
                  id(title_received_once) = true;
                }
            - if:
                condition:
                  lambda: 'return !id(last_artwork_url).empty() && id(ui_active_app) == 1;'
                then:
                  - script.execute: debounce_artwork_download
            - script.execute: start_hide_track_info_timer
          else:
            - script.execute: media_title_marquee_pause_direct
            - lvgl.label.update:
                id: title_label
                text: "No Track"
            - script.execute: media_title_marquee_reset
            - lvgl.label.update:
                id: queue_current_title_label
                text: "No Track"

  - platform: template
    id: media_artist_sensor
    internal: true
    on_value:
      - lambda: |-
          id(artist_has_content) = !x.empty() && x != "-";
      - if:
          condition:
            lambda: 'return id(artist_has_content);'
          then:
            - lvgl.label.update:
                id: artist_label
                text: !lambda 'return x;'
            - lvgl.label.update:
                id: queue_current_artist_label
                text: !lambda 'return x;'
            - if:
                condition:
                  lambda: 'return !id(is_track_info_hidden);'
                then:
                  - lvgl.widget.show: artist_label
          else:
            - lvgl.label.update:
                id: artist_label
                text: "-"
            - lvgl.label.update:
                id: queue_current_artist_label
                text: "-"
            - lvgl.widget.hide: artist_label

  - platform: template
    id: media_album_sensor
    internal: true
    on_value:
      - lvgl.label.update:
          id: album_label
          text: !lambda 'return x;'

  - platform: template
    id: media_entity_picture_sensor
    internal: true
    on_value:
      - lambda: |-
          // SendSpin ArtworkRole supplies negotiated binary artwork. Keep the
          // metadata URL only as diagnostic state and do not fetch arbitrary
          // remote artwork URLs from the UI task.
          id(last_artwork_url) = "";
          id(last_artwork_refresh_ms) = millis();

  - platform: template
    id: media_player_state_sensor
    internal: true
    on_value:
      - lambda: |-
          const bool now_playing = x == "PLAYING" || x == "playing";
          id(media_player_play_started) = now_playing && !id(media_player_state_was_playing);
          id(media_player_state_was_playing) = now_playing;
      - lambda: |-
          // SendSpin exposes a paused stream as IDLE. Capture the last visible
          // progress before the state handlers freeze the wave. This also
          // covers pauses requested outside this screen (for example from MA).
          if (x == "IDLE" || x == "idle") {
            const bool command_hold_active =
                id(media_progress_hold_until) != 0 &&
                (int32_t) (id(media_progress_hold_until) - millis()) > 0;
            if (!command_hold_active) {
              int hold = id(last_media_progress_basis_points);
              if (hold < 0 && id(last_media_progress_permille) >= 0) hold = id(last_media_progress_permille) * 10;
              if (hold < 0 && id(last_media_progress_percent) >= 0) hold = id(last_media_progress_percent) * 100;
              if (hold < 0) hold = 0;
              if (hold > 10000) hold = 10000;
              id(media_progress_hold_basis_points) = hold;
              id(media_progress_hold_until) = millis() + 1500U;
            }
          }
      - if:
          condition:
            lambda: 'return x == "PLAYING" || x == "playing";'
          then:
            # Stop the fallback Lottie before artwork/network work starts. It
            # otherwise keeps rasterizing behind the player during the most
            # bandwidth-sensitive part of playback startup.
            - script.execute: media_hide_lottie_visual
            - lambda: |-
                id(artwork_block_until) = 0;
                if (id(ui_active_app) == 1) {
                  id(album_art_background).set_sendspin_paused(false);
                }
            - script.execute: media_update_main_control
            - if:
                condition:
                  lambda: |-
                    return id(boot_sequence_done) && id(ui_active_app) == 0 &&
                           id(media_player_play_started) &&
                           !id(camera_paused_media) &&
                           !id(voice_assistant_suppress_media_auto_open);
                then:
                  - lvgl.navigation.open: player_application
            - lambda: |-
                if (id(media_player_play_started) && id(camera_paused_media)) {
                  ESP_LOGI("camera.runtime", "Consumed internal camera media resume");
                  id(camera_paused_media) = false;
                }
            - if:
                condition:
                  lambda: 'return id(auto_show_track_info).state;'
                then:
                  - script.execute: show_track_info
            - script.execute: start_hide_track_info_timer
            - if:
                condition:
                  lambda: |-
                    return id(media_action_pending) &&
                           id(media_action_confirmation) == 1;
                then:
                  - script.execute: media_hide_action_spinner_delayed
      - if:
          condition:
            lambda: 'return x == "PAUSED" || x == "paused" || x == "IDLE" || x == "idle" || x == "OFF" || x == "off" || x == "STANDBY" || x == "standby" || x == "STOPPED" || x == "stopped";'
          then:
            - lambda: 'id(artwork_block_until) = 0;'
            - script.execute: media_update_main_control
            - if:
                condition:
                  lambda: |-
                    return id(media_action_pending) &&
                           id(media_action_confirmation) == 2;
                then:
                  - script.execute: media_hide_action_spinner_delayed
            - script.stop: start_hide_track_info_timer
            - script.execute: media_resume_deferred_artwork
      - if:
          condition:
            lambda: |-
              const bool idle = x == "IDLE" || x == "idle";
              const bool stopped = x == "OFF" || x == "off" || x == "STANDBY" || x == "standby" ||
                                   x == "STOPPED" || x == "stopped";
              if (stopped) return true;
              if (!idle) return false;

              // An IDLE transition at the actual end of a finite track should
              // still clear the progress. Other IDLE transitions are pauses
              // and retain the last rendered wave instead of flashing empty.
              const float duration = id(media_duration_sensor).has_state() ? id(media_duration_sensor).state : 0.0f;
              float position = id(last_media_position);
              if (id(media_position_sensor).has_state() && id(media_position_sensor).state > position) {
                position = id(media_position_sensor).state;
              }
              return duration > 0.0f && position >= duration - 0.75f;
          then:
            - lambda: |-
                id(last_media_position) = 0.0f;
                id(ha_position_epoch) = 0;
                id(last_position_timestamp) = 0;
                id(last_position_millis) = 0;
                id(last_media_progress_percent) = -1;
                id(last_media_progress_permille) = -1;
                id(last_media_progress_basis_points) = -1;
                id(media_progress_hold_basis_points) = 0;
                id(media_progress_hold_until) = 0;
            - lambda: |-
                id(media_wavy_progress).initialize();
                id(media_wavy_progress).set_value(0);
      - script.execute: refresh_progress_bar_from_state

  - platform: template
    id: media_position_updated_at_sensor
    internal: true
    on_value:
      - lambda: |-
          int yr, mo, dy, hr, mn, sc;
          if (sscanf(x.c_str(), "%d-%d-%dT%d:%d:%d", &yr, &mo, &dy, &hr, &mn, &sc) != 6 &&
              sscanf(x.c_str(), "%d-%d-%d %d:%d:%d", &yr, &mo, &dy, &hr, &mn, &sc) != 6) {
            return;
          }
          int y = yr;
          int m = mo;
          if (m <= 2) {
            y--;
            m += 12;
          }
          long days = 365L * y + y / 4 - y / 100 + y / 400 + (153 * (m - 3) + 2) / 5 + dy - 719469;
          int epoch = (int)(days * 86400L + hr * 3600 + mn * 60 + sc);
          id(ha_position_epoch) = epoch;
          if (id(media_position_sensor).has_state()) {
            id(last_position_timestamp) = epoch;
            float anchor = id(media_position_sensor).state;
            auto t = id(ha_time).now();
            if (t.is_valid()) anchor += (float)(t.timestamp - epoch);
            if (anchor < 0.0f) anchor = 0.0f;
            id(last_media_position) = anchor;
          }
          id(refresh_progress_bar_from_state).execute();

  - platform: template
    id: media_source_sensor
    internal: true

sensor:
  - platform: sendspin
    id: sendspin_track_duration_ms
    sendspin_id: sendspin_hub
    type: track_duration
    internal: true
    on_value:
      - sensor.template.publish:
          id: media_duration_sensor
          state: !lambda 'return x / 1000.0f;'

  - platform: sendspin
    id: sendspin_track_progress_ms
    sendspin_id: sendspin_hub
    type: track_progress
    internal: true
    update_interval: 1s
    on_value:
      - lambda: |-
          id(ha_position_epoch) = 0;
      - sensor.template.publish:
          id: media_position_sensor
          state: !lambda 'return x / 1000.0f;'

  - platform: template
    id: media_duration_sensor
    internal: true
    on_value:
      - script.execute: refresh_progress_bar_from_state

  - platform: template
    id: media_position_sensor
    internal: true
    on_value:
      - lambda: |-
          id(last_media_position) = x;
          auto t = id(ha_time).now();
          if (id(ha_position_epoch) != 0) {
            id(last_position_timestamp) = id(ha_position_epoch);
            if (t.is_valid()) id(last_media_position) = x + (float)(t.timestamp - id(ha_position_epoch));
          } else if (t.is_valid()) {
            id(last_position_timestamp) = t.timestamp;
          }
          id(last_position_millis) = millis();
          if (id(last_media_position) < 0.0f) id(last_media_position) = 0.0f;
          id(refresh_progress_bar_from_state).execute();

  - platform: template
    id: media_volume_sensor
    internal: true
    on_value:
      - lambda: |-
          float volume = x;
          if (volume < 0.0f) volume = 0.0f;
          if (volume > 1.0f) volume = 1.0f;
          int pct = (int)(volume * 100.0f + 0.5f);
          if (id(volume_pending_until) != 0) {
            uint32_t now = millis();
            bool pending_active = (int32_t)(id(volume_pending_until) - now) > 0;
            if (pending_active && pct != id(volume_pending_pct)) {
              ESP_LOGD("volume", "Ignoring stale volume echo: %d%% while waiting for %d%%", pct, id(volume_pending_pct));
              return;
            }
            id(volume_pending_pct) = -1;
            id(volume_pending_until) = 0;
          }
          id(volume_updating_from_ha) = true;
          id(global_volume_pct) = pct;
          if (!id(global_volume_dragging)) {
            id(global_volume_knob_pct) = pct;
          }
          if (id(global_volume_dragging) ||
              !lv_obj_has_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN)) {
            id(global_volume_renderer).update(pct, id(global_volume_knob_pct));
          }
          id(volume_updating_from_ha) = false;
          if (id(media_speaker_panel_open) && id(speaker_count) <= 1) {
            id(speaker_volumes)[0] = volume;
            id(update_speaker_group_panel).execute();
          }

interval:
  - interval: 16ms
    then:
      - lambda: |-
          id(media_title_marquee).service();
          const bool voice_visible = id(ui_active_app) == 3 ||
                                     lv_obj_is_visible(id(voice_assistant_overlay));
          const bool player_visible = id(ui_active_app) == 1 && !voice_visible &&
                                      id(display_backlight).remote_values.is_on();
          uint16_t blocker_mask = 0;
          if (!player_visible) blocker_mask |= 1U << 0;
          if (id(ui_snapshot_io_busy)) blocker_mask |= 1U << 1;
          if (id(media_speaker_panel_open)) blocker_mask |= 1U << 2;
          if (!lv_obj_has_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN)) blocker_mask |= 1U << 3;
          if (!lv_obj_has_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN)) blocker_mask |= 1U << 4;
          if (id(global_volume_dragging)) blocker_mask |= 1U << 5;
          if (!lv_obj_has_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN)) blocker_mask |= 1U << 6;
          if (!lv_obj_has_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN)) blocker_mask |= 1U << 7;
          const bool player_uncovered = blocker_mask == 0;
          static uint16_t previous_blocker_mask = 0xFFFF;
          if (id(settings_perf_logs_switch).state && player_visible && blocker_mask != previous_blocker_mask) {
            ESP_LOGI("media.wave", "direct-present blockers=0x%02X snapshot=%s speaker=%s queue=%s panel=%s drag=%s global_vol=%s local_vol=%s",
                     blocker_mask,
                     YESNO(id(ui_snapshot_io_busy)), YESNO(id(media_speaker_panel_open)),
                     YESNO(!lv_obj_has_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN)),
                     YESNO(!lv_obj_has_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN)),
                     YESNO(id(global_volume_dragging)),
                     YESNO(!lv_obj_has_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN)),
                     YESNO(!lv_obj_has_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN)));
          }
          previous_blocker_mask = player_visible ? blocker_mask : 0xFFFF;
          id(media_wavy_progress).set_direct_present(player_uncovered);

          // Compose the title strip before submitting the ready waveform. The
          // regional compositor can then collect both requests in one DSI
          // frame instead of presenting two independently competing frames.
          if (id(title_marquee_active)) {
            if (!player_visible) {
              id(title_marquee_active) = false;
              id(media_title_marquee).end(true);
              if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);
            } else if (!player_uncovered) {
              if (id(media_title_marquee).is_active()) {
                id(media_title_marquee).end(true);
                if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);
              }
            } else {
              const int overflow = id(title_marquee_text_width) -
                                   lv_obj_get_content_width(id(title_marquee_viewport));
              if (overflow <= 0 || id(title_marquee_scroll_ms) == 0) {
                id(title_marquee_active) = false;
                id(media_title_marquee).end(true);
                if (lv_obj_get_x(id(title_label)) != 0) lv_obj_set_x(id(title_label), 0);
              } else {
                const uint32_t now = millis();
                if (id(title_marquee_start_ms) == 0) {
                  if (id(media_title_marquee).is_ready_for_motion()) {
                    // Keep the confirmed position-zero frame for one complete
                    // UI cycle. Motion starts on the following 16-ms tick.
                    id(title_marquee_start_ms) = now;
                  }
                } else {
                  const uint32_t elapsed = now - id(title_marquee_start_ms);
                  if (elapsed >= id(title_marquee_scroll_ms) + 700U) {
                    // Present the initial title position through the same direct
                    // region before handing it back to LVGL. Releasing the
                    // region first leaves its last scrolled pixels in the DSI
                    // framebuffer until a later unrelated refresh.
                    if (id(media_title_marquee).is_at_position(0)) {
                      id(title_marquee_active) = false;
                      // Keep the completed direct region parked at the native
                      // title position. Releasing it here makes the three DSI
                      // framebuffers alternate briefly between the final
                      // scrolled strip and the restored LVGL label.
                    } else {
                      id(media_title_marquee).update(0);
                    }
                  } else if (elapsed < id(title_marquee_scroll_ms)) {
                    const int x = -((int64_t) overflow * (int64_t) elapsed /
                                    (int64_t) id(title_marquee_scroll_ms));
                    if (id(media_title_marquee).is_active()) {
                      // The component deduplicates equal integer positions and
                      // coalesces pending work, so submitting at display cadence
                      // keeps motion smooth without rendering stale frames.
                      id(media_title_marquee).update(x);
                    } else if (lv_obj_get_x(id(title_label)) != x) {
                      lv_obj_set_x(id(title_label), x);
                    }
                  }
                }
              }
            }
          }

          // The worker on the core opposite ESPHome rasterizes the next
          // regional frame. The UI loop only submits the completed buffer, so
          // audio can pre-empt drawing without blocking component processing.
          id(media_wavy_progress).service_present();
          const bool playing = id(media_player_state_sensor).has_state() &&
              (id(media_player_state_sensor).state == "PLAYING" ||
               id(media_player_state_sensor).state == "playing");
          const bool animate_wave = playing && !id(media_action_pending);
          const bool animate_loader = id(media_action_loader_visible);
          if (player_uncovered && (animate_wave || animate_loader)) {
            id(media_wavy_progress).tick(3.0f);
          }

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 1
                  && id(media_duration_sensor).has_state()
                  && id(media_duration_sensor).state > 0.0f
                  && id(media_player_state_sensor).has_state()
                  && (id(media_player_state_sensor).state == "PLAYING" ||
                      id(media_player_state_sensor).state == "playing")
                  && !lv_obj_is_visible(id(voice_assistant_overlay));
          then:
            - script.execute: refresh_progress_bar_from_state

  - interval: 1s
    then:
      # The visible home clock and HA link indicator live inside the resident
      # Home snapshot. The former global clock label is intentionally inert.
      - script.execute: ui_refresh_home_header
      - lambda: |-
          if (id(media_progress_hold_until) != 0 &&
              (int32_t) (millis() - id(media_progress_hold_until)) >= 0) {
            id(media_progress_hold_until) = 0;
            id(media_update_main_control).execute();
          }
      - if:
          condition:
            lambda: |-
              return id(ui_home_snapshot_refresh_pending) &&
                     id(boot_sequence_done) &&
                     lv_obj_has_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN) &&
                     id(ui_active_app) == 0 && id(ui_page) == 1 &&
                     !id(ui_snapshot_io_busy) && !id(ui_touch_active) &&
                     !id(global_volume_dragging) &&
                     !id(global_volume_time_press_tracking) &&
                     !lvgl_esphome_snapshot_is_active();
          then:
            - script.execute: ui_refresh_home_snapshot_if_pending
