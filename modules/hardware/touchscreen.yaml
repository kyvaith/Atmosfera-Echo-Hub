# Touch controller.
# Home pages use lightweight swipe tracking here. The high-performance snapshot
# compositor is intentionally not part of the upstream-PR integration test build.
globals:
  - id: display_touch_wake_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: display_touch_wake_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_last_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: immich_swipe_tracking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: immich_swipe_dragging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: immich_swipe_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: immich_swipe_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: immich_swipe_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: immich_swipe_last_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_transport_touch_tracking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: media_transport_touch_cancelled
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: media_transport_touch_button
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_transport_touch_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_transport_touch_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_transport_touch_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_transport_touch_last_y
    type: int
    restore_value: no
    initial_value: '0'

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: touchscreen_bus
    display: my_display
    update_interval: 16ms
    on_touch:
      then:
        - lambda: |-
            if (id(boot_sequence_done) && !id(display_backlight).current_values.is_on()) {
              id(display_touch_wake_pending) = false;
              id(ui_touch_click_block_until_ms) = millis() + 900;
              lv_indev_reset(nullptr, nullptr);
              id(display_wake).execute();
              return;
            }

            id(global_volume_time_press_tracking) = false;
            if (id(boot_sequence_done) && id(display_backlight).current_values.is_on() &&
                !id(ui_snapshot_io_busy) &&
                touch.x >= 280 && touch.x <= 520 && touch.y >= 0 && touch.y <= 84) {
              id(global_volume_time_press_tracking) = true;
              id(global_volume_time_press_start_ms) = millis();
              id(global_volume_time_press_start_x) = touch.x;
              id(global_volume_time_press_start_y) = touch.y;
              id(ui_touch_click_block_until_ms) = millis() + 1500;
              id(global_volume_long_press_guard).execute();
              atmosfera_ui::volume_overlay_direct_prepare(
                  id(global_volume_arc), id(global_volume_knob), id(global_volume_pct_label));
              return;
            }

            id(media_transport_touch_tracking) = false;
            id(media_transport_touch_cancelled) = false;
            id(media_transport_touch_button) = 0;
            const int voice_phase = id(voice_assistant_phase);
            const bool player_controls_uncovered =
                id(ui_active_app) == 1 && !id(ui_snapshot_io_busy) &&
                id(display_backlight).current_values.is_on() &&
                (int32_t)(millis() - id(ui_touch_click_block_until_ms)) >= 0 &&
                (voice_phase == ${voice_assist_idle_phase_id} ||
                 voice_phase == ${voice_assist_not_ready_phase_id}) &&
                lv_obj_has_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN) &&
                lv_obj_has_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN) &&
                lv_obj_has_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN) &&
                lv_obj_has_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
            if (player_controls_uncovered) {
              auto hit_button = [&](lv_obj_t *button) -> bool {
                if (button == nullptr || !lv_obj_is_visible(button)) return false;
                lv_area_t area;
                lv_obj_get_coords(button, &area);
                return touch.x >= area.x1 && touch.x <= area.x2 &&
                       touch.y >= area.y1 && touch.y <= area.y2;
              };
              lv_obj_t *transport_button = nullptr;
              if (hit_button(id(prev_button))) {
                id(media_transport_touch_button) = -1;
                transport_button = id(prev_button);
              } else if (hit_button(id(next_button))) {
                id(media_transport_touch_button) = 1;
                transport_button = id(next_button);
              }
              if (transport_button != nullptr) {
                id(media_transport_touch_tracking) = true;
                id(media_transport_touch_start_x) = touch.x;
                id(media_transport_touch_start_y) = touch.y;
                id(media_transport_touch_last_x) = touch.x;
                id(media_transport_touch_last_y) = touch.y;
                id(ui_touch_active) = true;
                atmosfera_ui::media_transport_feedback_begin(transport_button);
                return;
              }
            }

            const int page = id(ui_page);
            id(tile_swipe_tracking) = id(ui_active_app) == 0 && !id(ui_snapshot_io_busy) &&
                                      id(ui_tile_snapshots_ready) && page >= 1 && page <= 4;
            id(tile_swipe_dragging) = false;
            id(tile_swipe_page) = page;
            id(tile_swipe_next_page) = 0;
            id(tile_swipe_next_x) = 0;
            id(tile_swipe_commit_latched) = false;
            id(tile_swipe_start_x) = touch.x;
            id(tile_swipe_start_y) = touch.y;
            id(tile_swipe_last_x) = touch.x;
            id(tile_swipe_last_y) = touch.y;
            id(tile_swipe_last_render_ms) = 0;
            if (id(tile_swipe_tracking)) {
              // A rapid follow-up swipe must supersede delayed LVGL cleanup
              // from the previous gesture. Otherwise the 450/520 ms scripts
              // rearrange or restyle the live tree underneath the second
              // direct-compositor animation.
              id(ui_restore_home_tiles_after_drag).stop();
            }

            // Reserve only the bottom 50 px for the system close gesture. The
            // previous 180 px software zone swallowed the queue and speaker
            // grouping buttons before LVGL could dispatch their click event.
            id(app_close_tracking) = id(ui_active_app) != 0 && touch.y >= 750;
            if (id(ui_active_app) == 3 && touch.x >= 320 && touch.x <= 480 && touch.y >= 708) {
              id(app_close_tracking) = false;
            }
            id(app_close_dragging) = false;
            id(app_close_start_x) = touch.x;
            id(app_close_start_y) = touch.y;
            id(app_close_last_x) = touch.x;
            id(app_close_last_y) = touch.y;

            // Direct PPA presentation bypasses LVGL's draw loop while a photo
            // moves. Track photo navigation at the touchscreen boundary so it
            // remains available independently of LVGL gesture dispatch.
            id(immich_swipe_tracking) = id(ui_active_app) == 4 && !id(ui_snapshot_io_busy) &&
                                        !id(app_close_tracking);
            id(immich_swipe_dragging) = false;
            id(immich_swipe_start_x) = touch.x;
            id(immich_swipe_start_y) = touch.y;
            id(immich_swipe_last_x) = touch.x;
            id(immich_swipe_last_y) = touch.y;

            id(settings_scroll_tracking) = id(ui_active_app) == 2 && !id(ui_snapshot_io_busy) &&
                                           !id(app_close_tracking) && !lvgl_esphome_snapshot_is_active();
            id(settings_scroll_dragging) = false;
            id(settings_scroll_start_x) = touch.x;
            id(settings_scroll_start_y) = touch.y;
            id(settings_scroll_last_x) = touch.x;
            id(settings_scroll_last_y) = touch.y;
            id(settings_scroll_start_scroll_y) = lv_obj_get_scroll_y(id(settings_root));
            id(settings_scroll_last_render_ms) = 0;
            id(settings_scroll_last_sample_y) = touch.y;
            id(settings_scroll_last_sample_ms) = millis();
            id(settings_scroll_velocity_px_s) = 0;

            id(ui_touch_active) = true;
            id(ui_manual_pressed_obj) = nullptr;
            auto press_if_hit = [&](lv_obj_t *obj) -> bool {
              if (obj == nullptr || !lv_obj_is_visible(obj)) return false;
              lv_area_t area;
              lv_obj_get_coords(obj, &area);
              if (touch.x < area.x1 || touch.x > area.x2 ||
                  touch.y < area.y1 || touch.y > area.y2) return false;
              id(ui_manual_pressed_obj) = obj;
              lv_obj_add_state(obj, LV_STATE_PRESSED);
              lv_obj_invalidate(obj);
              return true;
            };
            if (id(tile_swipe_tracking)) {
              lv_obj_t *buttons[] = {
                id(tile_light_button), id(tile_switch_button), id(tile_scene_button),
                id(tile_trigger_button), id(tile_climate_button), id(tile_cover_button),
                id(tile_garage_button), id(tile_lock_button), id(tile_alarm_button),
                id(tile_door_window_button), id(tile_presence_button), id(tile_sensor_button),
                id(tile_weather_button), id(tile_clock_button), id(tile_world_clock_button),
                id(tile_media_button), id(tile_subpage_button), id(tile_fan_button),
                id(tile_fan_speed_button), id(tile_webhook_button), id(tile_internal_button),
                id(tile_settings_button), id(tile_voice_button),
              };
              for (auto *button : buttons) {
                if (press_if_hit(button)) break;
              }
            }
    on_update:
      then:
        - lambda: |-
            if (touches.empty()) return;
            const auto &touch = touches[0];
            if (id(display_touch_wake_pending)) {
              id(display_touch_wake_last_x) = touch.x;
              id(display_touch_wake_last_y) = touch.y;
              return;
            }
            if (id(global_volume_dragging)) {
              const int knob_pct = atmosfera_ui::volume_arc_pct_from_point(touch.x, touch.y);
              const int pct = atmosfera_ui::volume_drag_value_from_visual_pct(
                  knob_pct, id(global_volume_drag_start_pct));
              const int previous_pct = id(global_volume_pct);
              id(global_volume_pct) = pct;
              id(global_volume_knob_pct) = knob_pct;
              // Audio follows every distinct percentage immediately. Coalesce
              // only the expensive LVGL redraws so the overlay cannot build a
              // queue of stale touch frames behind the finger.
              static uint32_t last_volume_visual_ms = 0;
              const uint32_t now = millis();
              if (now - last_volume_visual_ms >= 16U || pct == 0 || pct == 100) {
                last_volume_visual_ms = now;
                atmosfera_ui::volume_overlay_update_drag_point(
                    id(global_volume_arc), id(global_volume_knob), id(global_volume_pct_label),
                    pct, knob_pct, touch.x, touch.y);
              }
              if (pct != previous_pct) {
                // Keep the hardware output under the finger. Home Assistant is
                // updated once, when the drag ends.
                id(audio_stack).set_output_volume(pct / 100.0f);
              }
              if (pct != id(global_volume_last_sent_pct)) {
                id(global_volume_send_pending) = true;
              }
              id(ui_touch_click_block_until_ms) = millis() + 700;
              return;
            }
            if (id(global_volume_time_press_tracking)) {
              const int dx = touch.x - id(global_volume_time_press_start_x);
              const int dy = touch.y - id(global_volume_time_press_start_y);
              if (abs(dx) > 90 || abs(dy) > 90) {
                id(global_volume_time_press_tracking) = false;
                id(global_volume_long_press_guard).stop();
                atmosfera_ui::volume_overlay_direct_cancel_prepare();
                return;
              }
              if (millis() - id(global_volume_time_press_start_ms) >= 450) {
                id(global_volume_begin_drag).execute();
              }
              return;
            }
            if (id(media_transport_touch_tracking)) {
              id(media_transport_touch_last_x) = touch.x;
              id(media_transport_touch_last_y) = touch.y;
              const int dx = touch.x - id(media_transport_touch_start_x);
              const int dy = touch.y - id(media_transport_touch_start_y);
              if (!id(media_transport_touch_cancelled) && (abs(dx) > 10 || abs(dy) > 10)) {
                id(media_transport_touch_cancelled) = true;
                id(ui_touch_click_block_until_ms) = millis() + 300;
                if (!atmosfera_ui::media_transport_feedback_end()) {
                  id(media_transport_feedback_release).execute();
                }
              }
              return;
            }
            if (id(app_close_tracking)) {
              id(app_close_last_x) = touch.x;
              id(app_close_last_y) = touch.y;
              const int dx = id(app_close_last_x) - id(app_close_start_x);
              const int dy_up = id(app_close_start_y) - id(app_close_last_y);
              constexpr int close_start_y = 10;
              if (abs(dx) > 6 || dy_up > 6) {
                id(ui_touch_click_block_until_ms) = millis() + 700;
              }
              if (!id(app_close_dragging) && dy_up >= close_start_y && dy_up > abs(dx) + 4) {
                id(app_close_dragging) = true;
                id(app_close_tracking) = false;
                id(ui_touch_block_for_drag).execute();
                if (id(ui_active_app) == 1) {
                  atmosfera_ui::media_wavy_arc_set_direct_present(false);
                  atmosfera_ui::title_marquee_direct_end(true);
                }
                // Latch the gesture immediately. Capturing the closing frame
                // belongs to ui_close_app in the main loop, never to this
                // latency-sensitive touchscreen callback.
                id(app_close_requested) = true;
                return;
              }
            }
            if (id(immich_swipe_tracking)) {
              id(immich_swipe_last_x) = touch.x;
              id(immich_swipe_last_y) = touch.y;
              const int dx = id(immich_swipe_last_x) - id(immich_swipe_start_x);
              const int dy = id(immich_swipe_last_y) - id(immich_swipe_start_y);
              if (!id(immich_swipe_dragging) && abs(dx) >= 10 && abs(dx) > abs(dy) + 6) {
                id(immich_swipe_dragging) = true;
                id(ui_touch_block_for_drag).execute();
              }
              if (id(immich_swipe_dragging))
                id(ui_touch_click_block_until_ms) = millis() + 700;
              return;
            }
            if (id(settings_scroll_tracking)) {
              id(settings_scroll_last_x) = touch.x;
              id(settings_scroll_last_y) = touch.y;
              const int dx = id(settings_scroll_last_x) - id(settings_scroll_start_x);
              const int dy = id(settings_scroll_last_y) - id(settings_scroll_start_y);
              constexpr int start_y = 2;
              constexpr uint32_t render_interval_ms = 4;
              const uint32_t sample_now = millis();
              const uint32_t sample_dt = sample_now - id(settings_scroll_last_sample_ms);
              if (sample_dt > 0 && sample_dt <= 100) {
                const int instantaneous =
                    -((touch.y - id(settings_scroll_last_sample_y)) * 1000) / static_cast<int>(sample_dt);
                id(settings_scroll_velocity_px_s) =
                    (id(settings_scroll_velocity_px_s) * 2 + instantaneous) / 3;
              }
              id(settings_scroll_last_sample_y) = touch.y;
              id(settings_scroll_last_sample_ms) = sample_now;
              if (abs(dx) > 4 || abs(dy) > 4) {
                id(ui_touch_click_block_until_ms) = millis() + 700;
              }

              if (!id(settings_scroll_dragging)) {
                if (abs(dy) < start_y || abs(dy) + 6 < abs(dx)) return;

                if (id(ui_manual_pressed_obj) != nullptr) {
                  lv_obj_clear_state(id(ui_manual_pressed_obj), LV_STATE_PRESSED);
                  lv_obj_invalidate(id(ui_manual_pressed_obj));
                  id(ui_manual_pressed_obj) = nullptr;
                }

                // LVGL may have already pressed a clickable child before the
                // gesture crossed the scroll threshold. Clear that state
                // synchronously before capturing the scroll bitmap so the
                // release animation cannot reveal a stale hover frame.
                id(ui_disable_settings_rows_for_drag).execute();
                if (!lvgl_esphome_snapshot_scroll_begin(id(settings_root), 800, 800)) {
                  id(settings_scroll_tracking) = false;
                  return;
                }
                id(settings_scroll_dragging) = true;
                id(ui_touch_block_for_drag).execute();
              }

              const uint32_t now = millis();
              if (id(settings_scroll_last_render_ms) != 0 &&
                  now - id(settings_scroll_last_render_ms) < render_interval_ms) {
                return;
              }
              id(settings_scroll_last_render_ms) = now;
              lvgl_esphome_snapshot_scroll_update(id(settings_scroll_start_scroll_y) - dy);
              return;
            }
            if (!id(tile_swipe_tracking)) return;

            id(tile_swipe_last_x) = touch.x;
            id(tile_swipe_last_y) = touch.y;

            const int page = id(tile_swipe_page);
            if (page < 1 || page > 4 || id(ui_page) != page) return;

            const int dx = id(tile_swipe_last_x) - id(tile_swipe_start_x);
            const int dy = id(tile_swipe_last_y) - id(tile_swipe_start_y);
            constexpr int width = 800;
            constexpr int start_x = 10;
            constexpr int commit_x = width / 4;
            constexpr uint32_t render_interval_ms = 4;
            if (abs(dx) > 6 || abs(dy) > 6) {
              id(ui_touch_click_block_until_ms) = millis() + 700;
            }

            auto page_root = [&](int p) -> lv_obj_t * {
              switch (p) {
                case 1: return id(controls_root_1);
                case 2: return id(controls_root_2);
                case 3: return id(controls_root_3);
                case 4: return id(controls_root_4);
                default: return nullptr;
              }
            };
            auto clamp_i = [](int value, int lo, int hi) -> int {
              if (value < lo) return lo;
              if (value > hi) return hi;
              return value;
            };

            if (!id(tile_swipe_dragging)) {
              if (abs(dx) < start_x || abs(dx) <= abs(dy) + 8) return;

              if (id(ui_manual_pressed_obj) != nullptr) {
                lv_obj_clear_state(id(ui_manual_pressed_obj), LV_STATE_PRESSED);
                lv_obj_invalidate(id(ui_manual_pressed_obj));
                id(ui_manual_pressed_obj) = nullptr;
              }

              const int dir = dx < 0 ? 1 : -1;
              const int next_page = page + dir;
              if (next_page < 1 || next_page > 4) {
                if (!lvgl_esphome_snapshot_swipe_edge_begin(page_root(page), width)) {
                  id(tile_swipe_tracking) = false;
                  return;
                }
                id(tile_swipe_dragging) = true;
                id(tile_swipe_next_page) = 0;
                id(tile_swipe_next_x) = dir > 0 ? width : -width;
                id(tile_swipe_last_render_ms) = 0;
                id(ui_disable_home_tiles_for_drag).execute();
                id(ui_touch_block_for_drag).execute();
                return;
              }

              const int next_x = dir > 0 ? width : -width;
              lvgl_esphome_snapshot_swipe_set_page_indicator(page, 4);
              if (!lvgl_esphome_snapshot_swipe_begin(page_root(page), page_root(next_page), width, next_x)) {
                id(tile_swipe_tracking) = false;
                return;
              }
              id(tile_swipe_dragging) = true;
              id(ui_disable_home_tiles_for_drag).execute();
              id(ui_touch_block_for_drag).execute();
              id(tile_swipe_next_page) = next_page;
              id(tile_swipe_next_x) = next_x;
              id(tile_swipe_last_render_ms) = 0;
            }

            const int initial_next_x = id(tile_swipe_next_x);
            if (initial_next_x == 0) return;
            const bool edge_bounce = id(tile_swipe_next_page) == 0;
            int current_x = dx;
            if (edge_bounce) {
              if (initial_next_x > 0) {
                current_x = clamp_i(current_x, -width / 2, 0);
              } else {
                current_x = clamp_i(current_x, 0, width / 2);
              }
            } else if (initial_next_x > 0) {
              current_x = clamp_i(current_x, -width, 0);
            } else {
              current_x = clamp_i(current_x, 0, width);
            }
            const int next_x = edge_bounce ? initial_next_x : initial_next_x + current_x;

            if (abs(dx) >= commit_x && abs(dx) > abs(dy)) {
              id(tile_swipe_commit_latched) = true;
            }

            const uint32_t now = millis();
            if (id(tile_swipe_last_render_ms) != 0 &&
                now - id(tile_swipe_last_render_ms) < render_interval_ms) {
              return;
            }
            id(tile_swipe_last_render_ms) = now;
            lvgl_esphome_snapshot_swipe_request_update(current_x, next_x);
    on_release:
      then:
        - lambda: |-
            id(ui_touch_active) = false;
            if (id(ui_manual_pressed_obj) != nullptr) {
              lv_obj_clear_state(id(ui_manual_pressed_obj),
                  static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
              lv_obj_invalidate(id(ui_manual_pressed_obj));
              id(ui_manual_pressed_obj) = nullptr;
            }
            if (id(display_touch_wake_pending)) {
              const uint32_t held_ms = millis() - id(display_touch_wake_start_ms);
              const int dx = id(display_touch_wake_last_x) - id(display_touch_wake_start_x);
              const int dy = id(display_touch_wake_last_y) - id(display_touch_wake_start_y);
              const bool deliberate_wake =
                  held_ms >= 80 && held_ms <= 2500 && abs(dx) <= 120 && abs(dy) <= 120;
              id(display_touch_wake_pending) = false;
              if (deliberate_wake && id(boot_sequence_done) &&
                  !id(display_backlight).current_values.is_on()) {
                id(ui_touch_click_block_until_ms) = millis() + 900;
                lv_indev_reset(nullptr, nullptr);
                id(display_wake).execute();
              }
              return;
            }
            if (id(global_volume_dragging)) {
              id(ui_touch_click_block_until_ms) = millis() + 900;
              id(global_volume_finish_drag).execute();
              return;
            }
            if (id(global_volume_time_press_tracking)) {
              id(global_volume_time_press_tracking) = false;
              id(global_volume_long_press_guard).stop();
              atmosfera_ui::volume_overlay_direct_cancel_prepare();
              id(ui_touch_click_block_until_ms) = millis() + 500;
              return;
            }
            if (id(media_transport_touch_tracking)) {
              const int dx = id(media_transport_touch_last_x) - id(media_transport_touch_start_x);
              const int dy = id(media_transport_touch_last_y) - id(media_transport_touch_start_y);
              const bool activate = !id(media_transport_touch_cancelled) && abs(dx) <= 10 && abs(dy) <= 10;
              const int button = id(media_transport_touch_button);
              id(media_transport_touch_tracking) = false;
              id(media_transport_touch_cancelled) = false;
              id(media_transport_touch_button) = 0;
              if (!atmosfera_ui::media_transport_feedback_end()) {
                id(media_transport_feedback_release).execute();
              }
              if (activate) {
                if (button < 0) id(media_transport_previous).execute();
                else if (button > 0) id(media_transport_next).execute();
              }
              return;
            }
            if (id(app_close_tracking)) {
              const int dx = id(app_close_last_x) - id(app_close_start_x);
              const int dy = id(app_close_last_y) - id(app_close_start_y);
              const bool moved = abs(dx) > 10 || abs(dy) > 10;
              if (moved) {
                id(ui_touch_click_block_until_ms) = millis() + 300;
              }
              id(app_close_tracking) = false;
              id(app_close_dragging) = false;
              if (moved) id(ui_release_touch_blocker).execute();
              lvgl_esphome_snapshot_app_clear_prepared_close();
            }
            if (id(immich_swipe_tracking)) {
              const int dx = id(immich_swipe_last_x) - id(immich_swipe_start_x);
              const int dy = id(immich_swipe_last_y) - id(immich_swipe_start_y);
              const bool was_dragging = id(immich_swipe_dragging);
              const bool was_tap = !was_dragging && abs(dx) <= 10 && abs(dy) <= 10;
              id(immich_swipe_tracking) = false;
              id(immich_swipe_dragging) = false;
              if (was_dragging) {
                id(ui_touch_click_block_until_ms) = millis() + 700;
                id(ui_release_touch_blocker).execute();
                if (abs(dx) >= 70 && abs(dx) > abs(dy) + 12) {
                  if (dx < 0)
                    id(immich_next_photo_now).execute();
                  else
                    id(immich_previous_photo).execute();
                }
                return;
              }
              if (was_tap) {
                id(ui_touch_click_block_until_ms) = millis() + 300;
                id(immich_show_controls).execute();
                return;
              }
            }
            if (id(settings_scroll_tracking)) {
              const int dx = id(settings_scroll_last_x) - id(settings_scroll_start_x);
              const int dy = id(settings_scroll_last_y) - id(settings_scroll_start_y);
              const bool was_dragging = id(settings_scroll_dragging);
              const bool was_tap = !was_dragging && abs(dx) <= 10 && abs(dy) <= 10;
              if (was_dragging) {
                lvgl_esphome_snapshot_scroll_finish_inertial(
                    id(settings_scroll_start_scroll_y) - dy, id(settings_scroll_velocity_px_s));
                id(ui_touch_click_block_until_ms) = millis() + 1000;
                id(ui_release_touch_blocker).execute();
                id(ui_restore_settings_rows_after_drag).execute();
              } else if (was_tap) {
                const int x = id(settings_scroll_last_x);
                const int y = id(settings_scroll_last_y);
                auto point_in = [&](lv_obj_t *row) -> bool {
                  if (row == nullptr || lv_obj_has_flag(row, LV_OBJ_FLAG_HIDDEN)) return false;
                  lv_area_t area;
                  lv_obj_get_coords(row, &area);
                  return x >= area.x1 && x <= area.x2 && y >= area.y1 && y <= area.y2;
                };
                auto send_click = [&](lv_obj_t *row) -> bool {
                  if (!point_in(row)) return false;
                  id(ui_manual_pressed_obj) = row;
                  lv_obj_add_state(row, LV_STATE_PRESSED);
                  lv_obj_invalidate(row);
                  lv_obj_send_event(row, LV_EVENT_CLICKED, nullptr);
                  id(ui_release_manual_pressed_feedback).execute();
                  return true;
                };
                lv_obj_t *rows[] = {
                  id(settings_true_colour_button),
                  id(settings_screen_tone_button),
                  id(settings_perf_overlay_button),
                  id(settings_system_logs_button),
                  id(settings_perf_logs_button),
                  id(settings_swipe_logs_button),
                  id(settings_beta_firmware_button),
                  id(settings_display_brightness_button),
                  id(settings_display_timeout_button),
                  id(settings_voice_mute_button),
                  id(settings_wake_sound_button),
                  id(settings_wake_sensitivity_button),
                };
                for (auto *row : rows) {
                  if (send_click(row)) break;
                }
              } else if (abs(dx) > 10 || abs(dy) > 10) {
                id(ui_touch_click_block_until_ms) = millis() + 1000;
                id(ui_release_touch_blocker).execute();
                id(ui_restore_settings_rows_after_drag).execute();
              }
              id(settings_scroll_tracking) = false;
              id(settings_scroll_dragging) = false;
              id(settings_scroll_last_render_ms) = 0;
              id(settings_scroll_last_sample_ms) = 0;
              id(settings_scroll_velocity_px_s) = 0;
              if (was_dragging || was_tap) return;
            }
            if (!id(tile_swipe_tracking)) {
              return;
            }
            id(tile_swipe_tracking) = false;
            const int page = id(tile_swipe_page);
            int next_page = id(tile_swipe_next_page);
            const int dx = id(tile_swipe_last_x) - id(tile_swipe_start_x);
            const int dy = id(tile_swipe_last_y) - id(tile_swipe_start_y);
            const int abs_dx = abs(dx);
            const int abs_dy = abs(dy);
            const bool was_dragging = id(tile_swipe_dragging);
            const bool was_tap = !was_dragging && abs_dx <= 10 && abs_dy <= 10;
            constexpr int width = 800;
            constexpr int commit_x = width / 4;
            if (id(tile_swipe_dragging) || abs_dx > 10 || abs_dy > 10) {
              id(ui_touch_click_block_until_ms) = millis() + 300;
              id(ui_release_touch_blocker).execute();
              id(ui_restore_home_tiles_after_drag).execute();
            }

            auto clamp_i = [](int value, int lo, int hi) -> int {
              if (value < lo) return lo;
              if (value > hi) return hi;
              return value;
            };

            if (next_page < 1 || next_page > 4) {
              const int dir = dx < 0 ? 1 : -1;
              next_page = page + dir;
            }

            const bool commit =
                id(tile_swipe_dragging) &&
                (id(tile_swipe_commit_latched) || (abs_dx >= commit_x && abs_dx > abs_dy)) &&
                next_page >= 1 && next_page <= 4;

            if (commit) {
              // Update the live dots while the compositor still owns the
              // visible frame. Otherwise handoff briefly reveals the previous
              // LVGL indicator before the delayed page settle corrects it.
              id(ui_page) = next_page;
              lvgl_esphome_snapshot_swipe_set_page_indicator(next_page, 4);
              lv_obj_t *dots[] = {
                id(page_indicator_1), id(page_indicator_2),
                id(page_indicator_3), id(page_indicator_4),
              };
              int dot_x = 352;
              for (int i = 0; i < 4; i++) {
                const bool active = (i + 1) == next_page;
                const int dot_w = active ? 30 : 10;
                lv_obj_set_x(dots[i], dot_x);
                lv_obj_set_width(dots[i], dot_w);
                lv_obj_set_style_bg_color(
                    dots[i], lv_color_hex(active ? 0xF2F2F2 : 0x5C5F5E), LV_PART_MAIN);
                dot_x += dot_w + 12;
              }
              int required_first = next_page - 1;
              if (required_first < 1) required_first = 1;
              if (required_first > 2) required_first = 2;
              const int required_last = required_first + 2;
              if (id(ui_tile_snapshot_cached_first) != required_first ||
                  id(ui_tile_snapshot_cached_last) != required_last) {
                id(ui_tile_snapshots_ready) = false;
              }
            }

            if (id(tile_swipe_dragging) && id(tile_swipe_next_x) != 0) {
              const int initial_next_x = id(tile_swipe_next_x);
              const bool edge_bounce = id(tile_swipe_next_page) == 0;
              int current_x = dx;
              if (edge_bounce) {
                if (initial_next_x > 0) {
                  current_x = clamp_i(current_x, -width / 2, 0);
                } else {
                  current_x = clamp_i(current_x, 0, width / 2);
                }
              } else if (initial_next_x > 0) {
                current_x = clamp_i(current_x, -width, 0);
              } else {
                current_x = clamp_i(current_x, 0, width);
              }

              const int target_current_x = commit ? -initial_next_x : 0;
              const int target_next_x = (commit || edge_bounce) ? 0 : initial_next_x;
              const int distance = abs(target_current_x - current_x);
              uint32_t duration_ms = 0;
              if (distance > 8) {
                duration_ms = (uint32_t) ((distance * 380) / width);
                if (duration_ms < 140) duration_ms = 140;
                if (duration_ms > 420) duration_ms = 420;
              }
              lvgl_esphome_snapshot_swipe_request_finish(target_current_x, target_next_x, duration_ms, commit);
            } else {
              lvgl_esphome_snapshot_swipe_end();
            }

            if (commit) {
              // Shift the fixed previous/current/next raw window as soon as
              // the compositor releases its final frame. The script retries
              // while the finish animation still owns the display.
              id(ui_refresh_tile_snapshots).execute();
              if (id(settings_swipe_logs_switch).state) {
                ESP_LOGI("touch.swipe", "page=%d next=%d latched=%d dx=%d",
                         page, next_page, id(tile_swipe_commit_latched), dx);
              }
            }

            if (was_tap) {
              const int x = id(tile_swipe_last_x);
              const int y = id(tile_swipe_last_y);
              auto send_click = [&](lv_obj_t *button) -> bool {
                if (button == nullptr || !lv_obj_is_visible(button)) return false;
                lv_area_t area;
                lv_obj_get_coords(button, &area);
                if (x < area.x1 || x > area.x2 || y < area.y1 || y > area.y2) return false;
                lv_obj_send_event(button, LV_EVENT_CLICKED, nullptr);
                return true;
              };
              lv_obj_t *buttons[] = {
                id(tile_light_button), id(tile_switch_button), id(tile_scene_button),
                id(tile_trigger_button), id(tile_climate_button), id(tile_cover_button),
                id(tile_garage_button), id(tile_lock_button), id(tile_alarm_button),
                id(tile_door_window_button), id(tile_presence_button), id(tile_sensor_button),
                id(tile_weather_button), id(tile_clock_button), id(tile_world_clock_button),
                id(tile_media_button), id(tile_subpage_button), id(tile_fan_button),
                id(tile_fan_speed_button), id(tile_webhook_button), id(tile_internal_button),
                id(tile_settings_button), id(tile_voice_button),
              };
              for (auto *button : buttons) {
                if (send_click(button)) break;
              }
            }

            id(tile_swipe_dragging) = false;
            id(tile_swipe_page) = 0;
            id(tile_swipe_next_page) = 0;
            id(tile_swipe_next_x) = 0;
            id(tile_swipe_commit_latched) = false;
            id(tile_swipe_last_render_ms) = 0;
