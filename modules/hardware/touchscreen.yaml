# Touch controller.
# Home pages use lightweight swipe tracking here. The high-performance snapshot
# compositor is intentionally not part of the upstream-PR integration test build.
globals:
  - id: display_touch_wake_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: display_touch_wake_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_touch_wake_last_y
    type: int
    restore_value: no
    initial_value: '0'

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: touchscreen_bus
    display: my_display
    update_interval: 16ms
    on_touch:
      then:
        - lambda: |-
            if (id(boot_sequence_done) && !id(display_backlight).current_values.is_on()) {
              id(display_touch_wake_pending) = false;
              id(ui_touch_click_block_until_ms) = millis() + 900;
              lv_indev_reset(nullptr, nullptr);
              id(display_wake).execute();
              return;
            }

            id(global_volume_time_press_tracking) = false;
            if (id(boot_sequence_done) && id(display_backlight).current_values.is_on() &&
                !id(ui_snapshot_io_busy) &&
                touch.x >= 280 && touch.x <= 520 && touch.y >= 0 && touch.y <= 84) {
              id(global_volume_time_press_tracking) = true;
              id(global_volume_time_press_start_ms) = millis();
              id(global_volume_time_press_start_x) = touch.x;
              id(global_volume_time_press_start_y) = touch.y;
              id(ui_touch_click_block_until_ms) = millis() + 1500;
              id(global_volume_long_press_guard).execute();
              return;
            }

            const int page = id(ui_page);
            id(tile_swipe_tracking) = id(ui_active_app) == 0 && !id(ui_snapshot_io_busy) && page >= 1 && page <= 4;
            id(tile_swipe_dragging) = false;
            id(tile_swipe_page) = page;
            id(tile_swipe_next_page) = 0;
            id(tile_swipe_next_x) = 0;
            id(tile_swipe_commit_latched) = false;
            id(tile_swipe_start_x) = touch.x;
            id(tile_swipe_start_y) = touch.y;
            id(tile_swipe_last_x) = touch.x;
            id(tile_swipe_last_y) = touch.y;
            id(tile_swipe_last_render_ms) = 0;

            id(app_close_tracking) = id(ui_active_app) != 0 && !id(ui_snapshot_io_busy) && touch.y >= 700;
            if (id(ui_active_app) == 3 && touch.x >= 320 && touch.x <= 480 && touch.y >= 708) {
              id(app_close_tracking) = false;
            }
            if (id(app_close_tracking)) {
              id(ui_touch_block_for_drag).execute();
              lv_obj_t *app = nullptr;
              if (id(ui_active_app) == 1) {
                app = id(wear_root);
              } else if (id(ui_active_app) == 2) {
                app = id(settings_root);
              } else if (id(ui_active_app) == 3) {
                app = id(voice_assistant_overlay);
              }
              if (app != nullptr) {
                lvgl_esphome_snapshot_app_prepare_close(app);
              }
            }
            id(app_close_dragging) = false;
            id(app_close_start_x) = touch.x;
            id(app_close_start_y) = touch.y;
            id(app_close_last_x) = touch.x;
            id(app_close_last_y) = touch.y;

            id(settings_scroll_tracking) = id(ui_active_app) == 2 && !id(ui_snapshot_io_busy) && !id(app_close_tracking);
            id(settings_scroll_dragging) = false;
            id(settings_scroll_start_x) = touch.x;
            id(settings_scroll_start_y) = touch.y;
            id(settings_scroll_last_x) = touch.x;
            id(settings_scroll_last_y) = touch.y;
            id(settings_scroll_start_scroll_y) = lv_obj_get_scroll_y(id(settings_root));
            id(settings_scroll_last_render_ms) = 0;
    on_update:
      then:
        - lambda: |-
            if (touches.empty()) return;
            const auto &touch = touches[0];
            if (id(display_touch_wake_pending)) {
              id(display_touch_wake_last_x) = touch.x;
              id(display_touch_wake_last_y) = touch.y;
              return;
            }
            if (id(global_volume_dragging)) {
              const int knob_pct = atmosfera_ui::volume_arc_pct_from_point(touch.x, touch.y);
              const int pct = atmosfera_ui::volume_drag_value_from_visual_pct(
                  knob_pct, id(global_volume_drag_start_pct));
              id(global_volume_pct) = pct;
              id(global_volume_knob_pct) = knob_pct;
              atmosfera_ui::volume_overlay_update_drag_point(
                  id(global_volume_arc), id(global_volume_knob), id(global_volume_pct_label),
                  pct, knob_pct, touch.x, touch.y);
              const uint32_t now = millis();
              if (pct != id(global_volume_last_sent_pct) &&
                  (now - id(global_volume_last_send_ms) >= 90 || pct == 0 || pct == 100)) {
                id(global_volume_send_pending) = true;
                id(global_volume_send_to_ha).execute();
              }
              id(ui_touch_click_block_until_ms) = millis() + 700;
              return;
            }
            if (id(global_volume_time_press_tracking)) {
              const int dx = touch.x - id(global_volume_time_press_start_x);
              const int dy = touch.y - id(global_volume_time_press_start_y);
              if (abs(dx) > 90 || abs(dy) > 90) {
                id(global_volume_time_press_tracking) = false;
                id(global_volume_long_press_guard).stop();
                return;
              }
              if (millis() - id(global_volume_time_press_start_ms) >= 450) {
                id(global_volume_begin_drag).execute();
              }
              return;
            }
            if (id(app_close_tracking)) {
              id(app_close_last_x) = touch.x;
              id(app_close_last_y) = touch.y;
              const int dx = id(app_close_last_x) - id(app_close_start_x);
              const int dy_up = id(app_close_start_y) - id(app_close_last_y);
              constexpr int close_start_y = 10;
              if (abs(dx) > 6 || dy_up > 6) {
                id(ui_touch_click_block_until_ms) = millis() + 700;
              }
              if (!id(app_close_dragging) && dy_up >= close_start_y && dy_up > abs(dx) + 4) {
                id(app_close_dragging) = true;
                id(ui_touch_block_for_drag).execute();
                id(app_close_requested) = true;
                id(app_close_tracking) = false;
                return;
              }
            }
            if (id(settings_scroll_tracking)) {
              id(settings_scroll_last_x) = touch.x;
              id(settings_scroll_last_y) = touch.y;
              const int dx = id(settings_scroll_last_x) - id(settings_scroll_start_x);
              const int dy = id(settings_scroll_last_y) - id(settings_scroll_start_y);
              constexpr int start_y = 2;
              constexpr uint32_t render_interval_ms = 4;
              if (abs(dx) > 4 || abs(dy) > 4) {
                id(ui_touch_click_block_until_ms) = millis() + 700;
              }

              if (!id(settings_scroll_dragging)) {
                if (abs(dy) < start_y || abs(dy) + 6 < abs(dx)) return;

                if (!lvgl_esphome_snapshot_scroll_begin(id(settings_root), 800, 800)) {
                  id(settings_scroll_tracking) = false;
                  return;
                }
                id(settings_scroll_dragging) = true;
                id(ui_disable_settings_rows_for_drag).execute();
                id(ui_touch_block_for_drag).execute();
              }

              const uint32_t now = millis();
              if (id(settings_scroll_last_render_ms) != 0 &&
                  now - id(settings_scroll_last_render_ms) < render_interval_ms) {
                return;
              }
              id(settings_scroll_last_render_ms) = now;
              lvgl_esphome_snapshot_scroll_update(id(settings_scroll_start_scroll_y) - dy);
              return;
            }
            if (!id(tile_swipe_tracking)) return;

            id(tile_swipe_last_x) = touch.x;
            id(tile_swipe_last_y) = touch.y;

            const int page = id(tile_swipe_page);
            if (page < 1 || page > 4 || id(ui_page) != page) return;

            const int dx = id(tile_swipe_last_x) - id(tile_swipe_start_x);
            const int dy = id(tile_swipe_last_y) - id(tile_swipe_start_y);
            constexpr int width = 800;
            constexpr int start_x = 10;
            constexpr int commit_x = width / 4;
            constexpr uint32_t render_interval_ms = 4;
            if (abs(dx) > 6 || abs(dy) > 6) {
              id(ui_touch_click_block_until_ms) = millis() + 700;
            }

            auto page_root = [&](int p) -> lv_obj_t * {
              switch (p) {
                case 1: return id(controls_root_1);
                case 2: return id(controls_root_2);
                case 3: return id(controls_root_3);
                case 4: return id(controls_root_4);
                default: return nullptr;
              }
            };
            auto clamp_i = [](int value, int lo, int hi) -> int {
              if (value < lo) return lo;
              if (value > hi) return hi;
              return value;
            };

            if (!id(tile_swipe_dragging)) {
              if (abs(dx) < start_x || abs(dx) <= abs(dy) + 8) return;

              const int dir = dx < 0 ? 1 : -1;
              const int next_page = page + dir;
              if (next_page < 1 || next_page > 4) {
                if (!lvgl_esphome_snapshot_swipe_edge_begin(page_root(page), width)) {
                  id(tile_swipe_tracking) = false;
                  return;
                }
                id(tile_swipe_dragging) = true;
                id(tile_swipe_next_page) = 0;
                id(tile_swipe_next_x) = dir > 0 ? width : -width;
                id(tile_swipe_last_render_ms) = 0;
                id(ui_touch_block_for_drag).execute();
                return;
              }

              const int next_x = dir > 0 ? width : -width;
              lvgl_esphome_snapshot_swipe_set_page_indicator(page, 4);
              if (!lvgl_esphome_snapshot_swipe_begin(page_root(page), page_root(next_page), width, next_x)) {
                id(tile_swipe_tracking) = false;
                return;
              }
              id(tile_swipe_dragging) = true;
              id(ui_touch_block_for_drag).execute();
              id(tile_swipe_next_page) = next_page;
              id(tile_swipe_next_x) = next_x;
              id(tile_swipe_last_render_ms) = 0;
            }

            const int initial_next_x = id(tile_swipe_next_x);
            if (initial_next_x == 0) return;
            const bool edge_bounce = id(tile_swipe_next_page) == 0;
            int current_x = dx;
            if (edge_bounce) {
              if (initial_next_x > 0) {
                current_x = clamp_i(current_x, -width / 2, 0);
              } else {
                current_x = clamp_i(current_x, 0, width / 2);
              }
            } else if (initial_next_x > 0) {
              current_x = clamp_i(current_x, -width, 0);
            } else {
              current_x = clamp_i(current_x, 0, width);
            }
            const int next_x = edge_bounce ? initial_next_x : initial_next_x + current_x;

            if (abs(dx) >= commit_x && abs(dx) > abs(dy)) {
              id(tile_swipe_commit_latched) = true;
            }

            const uint32_t now = millis();
            if (id(tile_swipe_last_render_ms) != 0 &&
                now - id(tile_swipe_last_render_ms) < render_interval_ms) {
              return;
            }
            id(tile_swipe_last_render_ms) = now;
            lvgl_esphome_snapshot_swipe_request_update(current_x, next_x);
    on_release:
      then:
        - lambda: |-
            if (id(display_touch_wake_pending)) {
              const uint32_t held_ms = millis() - id(display_touch_wake_start_ms);
              const int dx = id(display_touch_wake_last_x) - id(display_touch_wake_start_x);
              const int dy = id(display_touch_wake_last_y) - id(display_touch_wake_start_y);
              const bool deliberate_wake =
                  held_ms >= 80 && held_ms <= 2500 && abs(dx) <= 120 && abs(dy) <= 120;
              id(display_touch_wake_pending) = false;
              if (deliberate_wake && id(boot_sequence_done) &&
                  !id(display_backlight).current_values.is_on()) {
                id(ui_touch_click_block_until_ms) = millis() + 900;
                lv_indev_reset(nullptr, nullptr);
                id(display_wake).execute();
              }
              return;
            }
            if (id(global_volume_dragging)) {
              id(ui_touch_click_block_until_ms) = millis() + 900;
              id(global_volume_finish_drag).execute();
              return;
            }
            if (id(global_volume_time_press_tracking)) {
              id(global_volume_time_press_tracking) = false;
              id(global_volume_long_press_guard).stop();
              id(ui_touch_click_block_until_ms) = millis() + 500;
              return;
            }
            if (id(app_close_tracking)) {
              const int dx = id(app_close_last_x) - id(app_close_start_x);
              const int dy = id(app_close_last_y) - id(app_close_start_y);
              if (abs(dx) > 10 || abs(dy) > 10) {
                id(ui_touch_click_block_until_ms) = millis() + 300;
              }
              id(app_close_tracking) = false;
              id(app_close_dragging) = false;
              id(ui_release_touch_blocker).execute();
              lvgl_esphome_snapshot_app_clear_prepared_close();
            }
            if (id(settings_scroll_tracking)) {
              const int dx = id(settings_scroll_last_x) - id(settings_scroll_start_x);
              const int dy = id(settings_scroll_last_y) - id(settings_scroll_start_y);
              const bool was_dragging = id(settings_scroll_dragging);
              const bool was_tap = !was_dragging && abs(dx) <= 10 && abs(dy) <= 10;
              if (was_dragging) {
                lvgl_esphome_snapshot_scroll_finish_retain(id(settings_scroll_start_scroll_y) - dy);
                id(ui_touch_click_block_until_ms) = millis() + 1000;
                id(ui_release_touch_blocker).execute();
                id(ui_restore_settings_rows_after_drag).execute();
              } else if (was_tap) {
                const int x = id(settings_scroll_last_x);
                const int y = id(settings_scroll_last_y);
                auto point_in = [&](lv_obj_t *row) -> bool {
                  if (row == nullptr || lv_obj_has_flag(row, LV_OBJ_FLAG_HIDDEN)) return false;
                  lv_area_t area;
                  lv_obj_get_coords(row, &area);
                  return x >= area.x1 && x <= area.x2 && y >= area.y1 && y <= area.y2;
                };
                auto send_click = [&](lv_obj_t *row) -> bool {
                  if (!point_in(row)) return false;
                  lv_obj_add_state(row, LV_STATE_PRESSED);
                  lv_obj_invalidate(row);
                  lv_obj_send_event(row, LV_EVENT_CLICKED, nullptr);
                  lv_timer_t *timer = lv_timer_create([](lv_timer_t *timer) {
                    auto *pressed_row = static_cast<lv_obj_t *>(lv_timer_get_user_data(timer));
                    if (pressed_row != nullptr) {
                      lv_obj_clear_state(pressed_row, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
                      lv_obj_invalidate(pressed_row);
                    }
                    lv_timer_delete(timer);
                  }, 90, row);
                  if (timer != nullptr) {
                    lv_timer_set_repeat_count(timer, 1);
                  }
                  return true;
                };
                lv_obj_t *rows[] = {
                  id(settings_true_colour_button),
                  id(settings_screen_tone_button),
                  id(settings_perf_overlay_button),
                  id(settings_system_logs_button),
                  id(settings_perf_logs_button),
                  id(settings_swipe_logs_button),
                  id(settings_beta_firmware_button),
                  id(settings_display_brightness_button),
                  id(settings_display_timeout_button),
                  id(settings_voice_mute_button),
                  id(settings_wake_sound_button),
                  id(settings_wake_sensitivity_button),
                };
                for (auto *row : rows) {
                  if (send_click(row)) break;
                }
              } else if (abs(dx) > 10 || abs(dy) > 10) {
                id(ui_touch_click_block_until_ms) = millis() + 1000;
                id(ui_release_touch_blocker).execute();
                id(ui_restore_settings_rows_after_drag).execute();
              }
              id(settings_scroll_tracking) = false;
              id(settings_scroll_dragging) = false;
              id(settings_scroll_last_render_ms) = 0;
              if (was_dragging || was_tap) return;
            }
            if (!id(tile_swipe_tracking)) {
              return;
            }
            id(tile_swipe_tracking) = false;
            const int page = id(tile_swipe_page);
            int next_page = id(tile_swipe_next_page);
            const int dx = id(tile_swipe_last_x) - id(tile_swipe_start_x);
            const int dy = id(tile_swipe_last_y) - id(tile_swipe_start_y);
            const int abs_dx = abs(dx);
            const int abs_dy = abs(dy);
            constexpr int width = 800;
            constexpr int commit_x = width / 4;
            if (id(tile_swipe_dragging) || abs_dx > 10 || abs_dy > 10) {
              id(ui_touch_click_block_until_ms) = millis() + 300;
              id(ui_release_touch_blocker).execute();
            }

            auto clamp_i = [](int value, int lo, int hi) -> int {
              if (value < lo) return lo;
              if (value > hi) return hi;
              return value;
            };

            if (next_page < 1 || next_page > 4) {
              const int dir = dx < 0 ? 1 : -1;
              next_page = page + dir;
            }

            const bool commit =
                id(tile_swipe_dragging) &&
                (id(tile_swipe_commit_latched) || (abs_dx >= commit_x && abs_dx > abs_dy)) &&
                next_page >= 1 && next_page <= 4;

            if (id(tile_swipe_dragging) && id(tile_swipe_next_x) != 0) {
              const int initial_next_x = id(tile_swipe_next_x);
              const bool edge_bounce = id(tile_swipe_next_page) == 0;
              int current_x = dx;
              if (edge_bounce) {
                if (initial_next_x > 0) {
                  current_x = clamp_i(current_x, -width / 2, 0);
                } else {
                  current_x = clamp_i(current_x, 0, width / 2);
                }
              } else if (initial_next_x > 0) {
                current_x = clamp_i(current_x, -width, 0);
              } else {
                current_x = clamp_i(current_x, 0, width);
              }

              const int target_current_x = commit ? -initial_next_x : 0;
              const int target_next_x = (commit || edge_bounce) ? 0 : initial_next_x;
              const int distance = abs(target_current_x - current_x);
              uint32_t duration_ms = 0;
              if (distance > 8) {
                duration_ms = (uint32_t) ((distance * 380) / width);
                if (duration_ms < 140) duration_ms = 140;
                if (duration_ms > 420) duration_ms = 420;
              }
              lvgl_esphome_snapshot_swipe_request_finish(target_current_x, target_next_x, duration_ms, commit);
            } else {
              lvgl_esphome_snapshot_swipe_end();
            }

            if (commit) {
              id(ui_page) = next_page;
              if (next_page == 1) {
                id(ui_set_tile_visibility_1).execute();
              } else if (next_page == 2) {
                id(ui_set_tile_visibility_2).execute();
              } else if (next_page == 3) {
                id(ui_set_tile_visibility_3).execute();
              } else if (next_page == 4) {
                id(ui_set_tile_visibility_4).execute();
              }
              id(ui_refresh_tile_snapshots).execute();
              if (id(settings_swipe_logs_switch).state) {
                ESP_LOGI("touch.swipe", "page=%d next=%d latched=%d dx=%d",
                         page, next_page, id(tile_swipe_commit_latched), dx);
              }
            }

            id(tile_swipe_dragging) = false;
            id(tile_swipe_page) = 0;
            id(tile_swipe_next_page) = 0;
            id(tile_swipe_next_x) = 0;
            id(tile_swipe_commit_latched) = false;
            id(tile_swipe_last_render_ms) = 0;
