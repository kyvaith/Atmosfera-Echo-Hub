# Boot-time and Home Assistant memory diagnostics.
# These values make PSRAM mode/speed visible even when ESP-IDF early boot logs are missed.
esphome:
  includes:
    - <esp_heap_caps.h>
    - <esp_psram.h>
    - <sdkconfig.h>

task_runtime_profiler:
  id: runtime_profiler

script:
  - id: diagnostics_log_runtime_memory
    mode: queued
    parameters:
      phase: string
    then:
      - lambda: |-
          const size_t psram_total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
          const size_t psram_free = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          const size_t internal_total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
          const size_t internal_free = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          const size_t dsi_frame_bytes = id(my_display).get_frame_buffer_size() * 3U;
          const size_t snapshot_bytes = lvgl_esphome_snapshot_memory_bytes();
          const size_t player_art_bytes = id(album_art_background).memory_usage_bytes();
          const size_t gallery_a_bytes = id(immich_photo_image).memory_usage_bytes();
          const size_t gallery_motion_bytes = id(immich_slideshow).memory_usage_bytes();
          const size_t camera_bytes = id(camera_stream_image).memory_usage_bytes();
          size_t lottie_bytes = 0;
          if (id(boot_esphome_animation) != nullptr) {
            auto *ctx = static_cast<esphome::lvgl::LottieContext *>(
                lv_obj_get_user_data(id(boot_esphome_animation)));
            lottie_bytes = esphome::lvgl::lottie_memory_usage_bytes(ctx);
            esphome::lvgl::lottie_log_memory_usage(ctx, phase.c_str());
          }
          const size_t known = dsi_frame_bytes + snapshot_bytes + player_art_bytes + gallery_a_bytes +
                               gallery_motion_bytes + camera_bytes + lottie_bytes;
          ESP_LOGW("memory.phase",
                   "%s psram=%uK/%uK used=%uK largest=%uK internal=%uK/%uK used=%uK known=%uK residual=%dK "
                   "dsi=%uK snapshot=%uK player_art=%uK gallery=%uK motion=%uK camera=%uK lottie=%uK",
                   phase.c_str(), (unsigned) (psram_free / 1024), (unsigned) (psram_total / 1024),
                   (unsigned) ((psram_total - psram_free) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (internal_free / 1024), (unsigned) (internal_total / 1024),
                   (unsigned) ((internal_total - internal_free) / 1024), (unsigned) (known / 1024),
                   (int) ((static_cast<int64_t>(psram_total - psram_free) - static_cast<int64_t>(known)) / 1024),
                   (unsigned) (dsi_frame_bytes / 1024), (unsigned) (snapshot_bytes / 1024),
                   (unsigned) (player_art_bytes / 1024), (unsigned) (gallery_a_bytes / 1024),
                   (unsigned) (gallery_motion_bytes / 1024),
                   (unsigned) (camera_bytes / 1024),
                   (unsigned) (lottie_bytes / 1024));
          lvgl_esphome_snapshot_log_memory(phase.c_str());
          id(album_art_background).log_memory_usage((phase + ".player").c_str());
          id(immich_photo_image).log_memory_usage((phase + ".photo_a").c_str());
          id(immich_slideshow).log_memory_usage((phase + ".gallery_motion").c_str());

text_sensor:
  - platform: template
    id: diagnostics_psram_config
    name: "PSRAM Configuration"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5min
    lambda: |-
      const char *mode = "unknown";
      int speed_mhz = 0;
      bool fetch_xip = false;
      bool rodata_xip = false;
      #if defined(CONFIG_SPIRAM_MODE_HEX)
      mode = "hex/16-line";
      #elif defined(CONFIG_SPIRAM_MODE_OCT)
      mode = "octal/8-line";
      #elif defined(CONFIG_SPIRAM_MODE_QUAD)
      mode = "quad/4-line";
      #endif
      #if defined(CONFIG_SPIRAM_SPEED)
      speed_mhz = CONFIG_SPIRAM_SPEED;
      #endif
      #if defined(CONFIG_SPIRAM_FETCH_INSTRUCTIONS)
      fetch_xip = true;
      #endif
      #if defined(CONFIG_SPIRAM_RODATA)
      rodata_xip = true;
      #endif
      char buf[96];
      snprintf(buf, sizeof(buf), "%s, %dMHz, fetch_xip=%s, rodata_xip=%s",
               mode, speed_mhz, YESNO(fetch_xip), YESNO(rodata_xip));
      return std::string(buf);

binary_sensor:
  - platform: template
    id: diagnostics_psram_initialized
    name: "PSRAM Initialized"
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return esp_psram_is_initialized();

sensor:
  - platform: template
    id: diagnostics_psram_size
    name: "PSRAM Size"
    entity_category: diagnostic
    device_class: data_size
    state_class: measurement
    disabled_by_default: true
    unit_of_measurement: "MiB"
    accuracy_decimals: 2
    update_interval: 5min
    lambda: |-
      return esp_psram_get_size() / 1048576.0f;

  - platform: template
    id: diagnostics_psram_heap_total
    name: "PSRAM Heap Total"
    entity_category: diagnostic
    device_class: data_size
    state_class: measurement
    disabled_by_default: true
    unit_of_measurement: "MiB"
    accuracy_decimals: 2
    update_interval: 5min
    lambda: |-
      return heap_caps_get_total_size(MALLOC_CAP_SPIRAM) / 1048576.0f;

  - platform: template
    id: diagnostics_psram_heap_free
    name: "PSRAM Heap Free"
    entity_category: diagnostic
    device_class: data_size
    state_class: measurement
    disabled_by_default: true
    unit_of_measurement: "MiB"
    accuracy_decimals: 2
    update_interval: 5min
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1048576.0f;

  - platform: template
    id: diagnostics_psram_largest_free_block
    name: "PSRAM Largest Free Block"
    entity_category: diagnostic
    device_class: data_size
    state_class: measurement
    disabled_by_default: true
    unit_of_measurement: "MiB"
    accuracy_decimals: 2
    update_interval: 5min
    lambda: |-
      return heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1048576.0f;

  - platform: template
    id: diagnostics_internal_heap_free
    name: "Internal Heap Free"
    entity_category: diagnostic
    device_class: data_size
    state_class: measurement
    disabled_by_default: true
    unit_of_measurement: "KiB"
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;
