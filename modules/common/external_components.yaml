# External components used by Atmosfera Echo Hub.
# Productized components come from one coherent ESPHome integration worktree.
# The legacy artwork component remains isolated until its lifecycle is replaced
# with the generic runtime/online image pipeline.
external_components:
  - source:
      type: local
      path: ${esphome_components_path}
    components:
      - audio_processor
      - artwork_image
      - display
      - esp_afe
      - esp_audio_stack
      - esp32_jpeg
      - image
      - immich_gallery
      - lvgl_material
      - lvgl_image_presenter
      - lvgl
      - mipi_dsi
      - network_camera
      - sendspin
      - task_runtime_profiler
      - va_pipecat
