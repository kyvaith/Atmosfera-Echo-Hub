# External components used by Atmosfera Echo Hub.
# Productized components come from one coherent ESPHome integration worktree.
# The legacy artwork component remains isolated until its lifecycle is replaced
# with the generic runtime/online image pipeline.
external_components:
  - source:
      type: local
      path: C:/Users/kyvai/kyvaith-esphome-productization-lvgl/esphome/components
    components:
      - audio_processor
      - display
      - esp_afe
      - esp_audio_stack
      - esp32_jpeg
      - generic_image
      - image
      - lvgl_image_presenter
      - lvgl_material
      - lvgl_region_presenter
      - lvgl
      - micro_wake_word
      - mipi_dsi
      - online_image
      - runtime_image
      - sendspin
  - source:
      type: local
      path: C:/Users/kyvai/kyvaith-esphome-artwork-bridge/esphome/components
    components:
      - artwork_image
  - source:
      type: local
      path: C:/Users/kyvai/kyvaith-esphome/esphome/components
    components: [va_client]
