# Device-level runtime settings.
# These entities are exposed in Home Assistant and mirrored where practical on the round settings page.
globals:
- id: boot_sequence_done
  type: bool
  restore_value: no
  initial_value: 'false'
- id: settings_perf_overlay_enabled
  type: bool
  restore_value: true
  initial_value: 'false'
- id: display_last_interaction_ms
  type: uint32_t
  restore_value: no
  initial_value: '0'

script:
- id: display_wake
  mode: restart
  then:
  - if:
      condition:
        lambda: 'return id(boot_sequence_done);'
      then:
      - lambda: |-
          id(display_last_interaction_ms) = millis();
          ESP_LOGW("backlight.diag", "wake brightness=%.0f%% uptime=%lums",
                   id(settings_display_brightness).state,
                   (unsigned long) millis());
      - if:
          condition:
            lambda: 'return id(ui_active_app) == 1;'
          then:
            - script.execute: media_title_marquee_reset_and_start
      # Repeated assistant/UI activity refreshes the timeout but must not
      # restart a long hardware fade while the panel is already lit.
      - if:
          condition:
            lambda: 'return !id(display_backlight).remote_values.is_on();'
          then:
          - output.ledc.set_next_fade_duration:
              id: backlight_output
              duration: 3600ms
          - light.turn_on:
              id: display_backlight
              brightness: !lambda |-
                const float b = id(settings_display_brightness).state;
                return (b < 28.0f ? 28.0f : b) / 100.0f;
              transition_length: 0ms

# Use a product-level inactivity clock instead of LVGL's one-shot on_idle
# trigger. This remains deterministic when a keep-awake application ends
# without a new touch and ignores internal LVGL redraw/presentation activity.
interval:
- interval: 1s
  then:
  - if:
      condition:
        lambda: |-
          if (!id(boot_sequence_done) ||
              !id(display_backlight).remote_values.is_on()) {
            return false;
          }

          const float timeout_s = id(settings_display_timeout).state;
          if (!std::isfinite(timeout_s) || timeout_s <= 0.0f) {
            return false;
          }

          const int app = id(ui_active_app);
          const int voice_phase = id(voice_assistant_phase);
          // The backend phase, not the currently selected page, owns the
          // conversation lifetime. A wake-word session may be active before
          // ui_active_app catches up, or while an overlay temporarily changes
          // navigation state; neither case may let the display timeout fire.
          const bool conversation_active =
              voice_phase == ${voice_assist_waiting_phase_id} ||
              voice_phase == ${voice_assist_listening_phase_id} ||
              voice_phase == ${voice_assist_thinking_phase_id} ||
              voice_phase == ${voice_assist_replying_phase_id};
          // The gallery owns the whole display while it is open. Keep it lit
          // both during motion and while its navigation HUD is visible.
          const bool slideshow_active = app == 4;
          const bool camera_preview_active = app == 5;

          if (conversation_active || slideshow_active || camera_preview_active) {
            // Start a fresh timeout after the protected activity ends instead
            // of switching the panel off immediately on app/session close.
            id(display_last_interaction_ms) = millis();
            return false;
          }

          const uint32_t timeout_ms =
              static_cast<uint32_t>(timeout_s * 1000.0f);
          return millis() - id(display_last_interaction_ms) >= timeout_ms;
      then:
      - lambda: |-
          ESP_LOGW("backlight.diag",
                   "timeout off app=%d voice_phase=%d idle=%lums uptime=%lums",
                   id(ui_active_app), id(voice_assistant_phase),
                   (unsigned long) (millis() - id(display_last_interaction_ms)),
                   (unsigned long) millis());
      - output.ledc.set_next_fade_duration:
          id: backlight_output
          duration: 3600ms
      - light.turn_off:
          id: display_backlight
          transition_length: 0ms

switch:
- platform: template
  id: settings_beta_firmware_switch
  name: "Beta Firmware"
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  entity_category: config
  disabled_by_default: true
  icon: "mdi:test-tube"
  on_turn_on:
  - logger.log:
      level: INFO
      tag: firmware
      format: "OTA updates set to beta channel"
  - lambda: 'id(firmware_update).set_source_url("${firmware_manifest_beta_url}");'
  - component.update: firmware_update
  - script.execute: ui_update_beta_firmware_state
  on_turn_off:
  - logger.log:
      level: INFO
      tag: firmware
      format: "OTA updates set to stable channel"
  - lambda: 'id(firmware_update).set_source_url("${firmware_manifest_url}");'
  - component.update: firmware_update
  - script.execute: ui_update_beta_firmware_state
- platform: template
  id: settings_true_colour_switch
  name: "True Colour Mode"
  optimistic: true
  restore_mode: ALWAYS_ON
  on_turn_on:
  - script.execute: ui_update_true_colour_state
  on_turn_off:
  - switch.turn_on: settings_true_colour_switch
  - script.execute: ui_update_true_colour_state
- platform: template
  id: settings_screen_tone_switch
  name: "Screen Tone"
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - script.execute: ui_update_screen_tone_state
  on_turn_off:
  - script.execute: ui_update_screen_tone_state
- platform: template
  id: settings_perf_overlay_switch
  name: "Performance Overlay"
  lambda: 'return id(settings_perf_overlay_enabled);'
  turn_on_action:
  - globals.set:
      id: settings_perf_overlay_enabled
      value: 'true'
  - switch.template.publish:
      id: settings_perf_overlay_switch
      state: true
  - script.execute: ui_update_perf_overlay_state
  turn_off_action:
  - globals.set:
      id: settings_perf_overlay_enabled
      value: 'false'
  - switch.template.publish:
      id: settings_perf_overlay_switch
      state: false
  - script.execute: ui_update_perf_overlay_state
- platform: template
  id: settings_system_logs_switch
  name: "System Logs"
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - logger.set_level: INFO
  - script.execute: ui_update_system_logs_state
  on_turn_off:
  - if:
      condition:
        switch.is_off: settings_perf_logs_switch
      then:
      - logger.set_level: WARN
  - script.execute: ui_update_system_logs_state
- platform: template
  id: settings_perf_logs_switch
  name: "Performance Logs"
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - logger.set_level: INFO
  - lambda: lvgl_esphome_set_perf_logging_enabled(true);
  - script.execute: ui_update_perf_logs_state
  on_turn_off:
  - lambda: lvgl_esphome_set_perf_logging_enabled(false);
  - if:
      condition:
        switch.is_off: settings_system_logs_switch
      then:
      - logger.set_level: WARN
  - script.execute: ui_update_perf_logs_state
- platform: template
  id: settings_swipe_logs_switch
  name: "Swipe Debug Logs"
  optimistic: true
  restore_mode: ALWAYS_OFF
  on_turn_on:
  - script.execute: ui_update_swipe_logs_state
  on_turn_off:
  - script.execute: ui_update_swipe_logs_state

number:
- platform: template
  id: settings_display_brightness
  name: "Display Brightness"
  min_value: 28
  max_value: 100
  step: 5
  initial_value: 85
  optimistic: true
  restore_value: true
  unit_of_measurement: "%"
  icon: "mdi:brightness-6"
  entity_category: config
  mode: slider
  on_value:
  - script.execute: ui_update_display_brightness_state
  - if:
      condition:
        and:
        - lambda: 'return id(boot_sequence_done);'
        - light.is_on: display_backlight
      then:
      - lambda: |-
          ESP_LOGW("backlight.diag", "brightness apply=%.0f%% uptime=%lums",
                   id(settings_display_brightness).state,
                   (unsigned long) millis());
      - light.turn_on:
          id: display_backlight
          brightness: !lambda |-
            const float b = id(settings_display_brightness).state;
            return (b < 28.0f ? 28.0f : b) / 100.0f;
          transition_length: 0ms

- platform: template
  id: settings_display_timeout
  name: "Display Timeout"
  min_value: 0
  max_value: 300
  step: 15
  initial_value: 60
  optimistic: true
  restore_value: true
  unit_of_measurement: "s"
  icon: "mdi:timer-outline"
  entity_category: config
  mode: box
  on_value:
  - script.execute: ui_update_display_timeout_state

