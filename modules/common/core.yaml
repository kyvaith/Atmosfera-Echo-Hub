    - action: debug_capture_screen
      variables:
        offset: int
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              static std::string capture;
              static constexpr size_t CHUNK_SIZE = 3000;
              if (offset <= 0) {
                capture.clear();
                esphome::esp32_jpeg::JpegBuffer jpeg;
                const esphome::esp32_jpeg::EncodeConfig config{
                    .width = 800,
                    .height = 800,
                    .input_format = esphome::esp32_jpeg::PixelFormat::RGB888,
                    .down_sampling = esphome::esp32_jpeg::DownSampling::YUV420,
                    .quality = 70,
                    .pixel_reverse = false,
                    .input_dma_owned = true,
                    .retain_output_buffer = false,
                    .output_buffer_size = 512U * 1024U,
                    .dma2d_burst_length = 64,
                    .dma2d_descriptor_burst = 0,
                    .timeout_ms = 120,
                };
                auto *display = lv_display_get_default();
                auto *component = display == nullptr
                                      ? nullptr
                                      : static_cast<esphome::lvgl::LvglComponent *>(lv_display_get_user_data(display));
                if (component != nullptr)
                  component->log_direct_buffer_state("capture-before-pause");
                lvgl_esphome_direct_regions_pause(true, 150);
                if (component != nullptr)
                  component->log_direct_buffer_state("capture-paused");
                lv_lock();
                const auto *frame = component == nullptr
                                      ? id(my_display).get_presented_frame_buffer()
                                      : component->direct_get_stable_presented_frame(100);
                if (frame == nullptr) {
                  lv_unlock();
                  lvgl_esphome_direct_regions_pause(false, 0);
                  root["error"] = "no stable presented framebuffer";
                  return;
                }
                const esp_err_t error =
                    esphome::esp32_jpeg::encode(config, frame, 800U * 800U * 3U, &jpeg);
                lv_unlock();
                if (component != nullptr)
                  component->log_direct_buffer_state("capture-before-resume");
                lvgl_esphome_direct_regions_pause(false, 0);
                if (component != nullptr)
                  component->log_direct_buffer_state("capture-resumed");
                if (error != ESP_OK || jpeg.empty()) {
                  root["error"] = esp_err_to_name(error);
                  return;
                }
                capture = esphome::base64_encode(jpeg.data(), jpeg.size());
              }
              const size_t start = static_cast<size_t>(std::max<int32_t>(offset, 0));
              if (start >= capture.size()) {
                root["error"] = "capture offset out of range";
                return;
              }
              const size_t count = std::min(CHUNK_SIZE, capture.size() - start);
              const bool complete = start + count >= capture.size();
              const std::string chunk = capture.substr(start, count);
              root["width"] = 800;
              root["height"] = 800;
              root["total_size"] = capture.size();
              root["offset"] = start;
              root["jpeg_base64_chunk"] = chunk;
              if (complete) {
                capture.clear();
                capture.shrink_to_fit();
              }
    - action: debug_capture_region_raw
      variables:
        x: int
        y: int
        width: int
        height: int
        scale: int
        offset: int
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              // Stream a downsampled RGB888 region without allocating a full
              // screenshot or JPEG scratch buffer. This remains usable while
              // the voice presenter owns several large PSRAM surfaces.
              static constexpr size_t RAW_CHUNK_BYTES = 2250;
              static uint8_t chunk[RAW_CHUNK_BYTES];
              auto *display = lv_display_get_default();
              if (display == nullptr) {
                root["error"] = "no display";
                return;
              }
              const int screen_width = lv_display_get_horizontal_resolution(display);
              const int screen_height = lv_display_get_vertical_resolution(display);
              const int step = std::max<int32_t>(scale, 1);
              const int left = std::clamp<int32_t>(x, 0, screen_width - 1);
              const int top = std::clamp<int32_t>(y, 0, screen_height - 1);
              const int capture_width = std::clamp<int32_t>(width, 1, screen_width - left);
              const int capture_height = std::clamp<int32_t>(height, 1, screen_height - top);
              const int output_width = (capture_width + step - 1) / step;
              const int output_height = (capture_height + step - 1) / step;
              const size_t total_size = static_cast<size_t>(output_width) * output_height * 3U;
              const size_t start = static_cast<size_t>(std::max<int32_t>(offset, 0));
              if (start >= total_size) {
                root["error"] = "capture offset out of range";
                return;
              }
              const auto *frame = id(my_display).get_presented_frame_buffer();
              if (frame == nullptr) {
                root["error"] = "no presented framebuffer";
                return;
              }
              const size_t source_stride = id(my_display).get_frame_buffer_stride();
              const size_t count = std::min(RAW_CHUNK_BYTES, total_size - start);
              for (size_t index = 0; index < count; index++) {
                const size_t source_byte = start + index;
                const size_t output_pixel = source_byte / 3U;
                const size_t channel = source_byte % 3U;
                const int output_x = static_cast<int>(output_pixel % output_width);
                const int output_y = static_cast<int>(output_pixel / output_width);
                const int source_x = std::min(left + output_x * step, left + capture_width - 1);
                const int source_y = std::min(top + output_y * step, top + capture_height - 1);
                chunk[index] = frame[static_cast<size_t>(source_y) * source_stride +
                                     static_cast<size_t>(source_x) * 3U + channel];
              }
              root["width"] = output_width;
              root["height"] = output_height;
              root["total_size"] = total_size;
              root["offset"] = start;
              root["data_b64"] = esphome::base64_encode(chunk, count);
