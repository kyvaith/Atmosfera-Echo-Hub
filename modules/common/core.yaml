# Core ESPHome runtime and network integration.
# This file intentionally holds boot behavior, API, logging, Wi-Fi and the lightweight web server.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: ${esphome_min_version}
  build_path: C:/aeh-build/${name}
  project:
    name: "${project_namespace}.${friendly_name}"
    version: ${firmware_version}
  platformio_options:
    board_build.flash_mode: qio
    # These are project-local compile-time toggles consumed by patched
    # ESPHome/ESP-IDF code. They are not Kconfig symbols, so sdkconfig_options
    # would silently drop them.
    build_flags:
      - -DCONFIG_ESPHOME_JPEG_DMA2D_BURST_LENGTH=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_DESC_BURST_DISABLE=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_SKIP_PRE_OUTPUT_MSYNC=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_RUNTIME_SKIP_POST_OUTPUT_MSYNC=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_OUTPUT_MSYNC_CHUNK=16384
      - -DCONFIG_ESPHOME_JPEG_DMA2D_OUTPUT_MSYNC_YIELD=1
      - -DCONFIG_ESPHOME_JPEG_DECODER_INTERNAL_INPUT_MAX_BYTES=131072
      - -DCONFIG_ESPHOME_JPEG_DECODER_DIRECT_PSRAM_INPUT=1
      - -DCONFIG_ESPHOME_ARTWORK_SKIP_DMA_OUTPUT_MSYNC=1
      - -DCONFIG_ESPHOME_ARTWORK_CACHE_SYNC_CHUNK=4096
      - -DCONFIG_ESPHOME_ARTWORK_CACHE_SYNC_FIFO_MIN=896
      - -DCONFIG_ESPHOME_ARTWORK_CACHE_SYNC_WAIT_US=3000
      - -DCONFIG_ESPHOME_ARTWORK_POST_DECODE_DSI_QUIET_MS=24
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_DSI_QUIET_MS=48
      - -DCONFIG_ESPHOME_DSI_MSYNC_CHUNK=32768
      - -DCONFIG_ESPHOME_DSI_CACHE_WRITE_QOS=0
      - -DCONFIG_ESPHOME_DSI_CACHE_READ_QOS=1
      - -DCONFIG_ESPHOME_DSI_CPU_WRITE_QOS=0
      - -DCONFIG_ESPHOME_DSI_CPU_READ_QOS=1
      - -DCONFIG_ESPHOME_DSI_GDMA_WRITE_QOS=0
      - -DCONFIG_ESPHOME_DSI_GDMA_READ_QOS=15
      - -DCONFIG_ESPHOME_DSI_STRESS_DIAGNOSTICS=1
      - -DCONFIG_ESPHOME_MIPI_DSI_DMA_FLOW_CONTROLLER=1
      - -DCONFIG_ESPHOME_MIPI_DSI_DISABLE_FRAME_ACK=1
      - -DCONFIG_ESPHOME_MIPI_DSI_CONTINUOUS_HS_CLOCK=1
      - -DCONFIG_ESPHOME_LVGL_PPA_DSI_BACKPRESSURE=1
      - -DCONFIG_ESPHOME_LVGL_PPA_DSI_FIFO_MIN=1000
      - -DCONFIG_ESPHOME_LVGL_PPA_DSI_WAIT_US=6000
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_BACKPRESSURE=1
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_FIFO_MIN=896
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_WAIT_US=3000
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_ROW_PERIOD=4
      - -DCONFIG_ESPHOME_LVGL_PPA_BLEND_BAND_HEIGHT=1
      - -DCONFIG_ESPHOME_LVGL_PPA_BLEND_BAND_GAP_US=100
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_BURST_LENGTH=128
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_BAND_HEIGHT=8
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_BAND_GAP_US=25
      - -DCONFIG_ESPHOME_LVGL_PPA_SKIP_DMA_SOURCE_MSYNC=1
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_AXI_BURSTINESS=4
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_PEAK_LEVEL=2
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSACTION_LEVEL=4
    extra_scripts:
      - "pre:C:/Users/kyvai/atmosfera-echo-hub/tools/patch_espidf_freertos_static_alloc.py"
  on_boot:
    priority: 600
    then:
    - micro_wake_word.stop:
    - output.turn_off: backlight_output
    - light.turn_off:
        id: display_backlight
    - lambda: |-
        id(album_art_background).set_sendspin_paused(true);
    - lvgl.page.show:
        id: controls_page
    - delay: 250ms
    - script.execute: ui_build_tile_snapshots_now
    - script.wait: ui_build_tile_snapshots_now
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
    - output.turn_off: backlight_output
    - light.turn_off:
        id: display_backlight
    - script.execute: boot_show_esphome_animation
    - wait_until:
        condition:
          lambda: |-
            if (id(boot_esphome_animation) == nullptr) return true;
            auto *ctx = static_cast<esphome::lvgl::LottieContext *>(lv_obj_get_user_data(id(boot_esphome_animation)));
            return esphome::lvgl::lottie_is_ready(ctx);
        timeout: 4s
    - lambda: |-
        ESP_LOGW("boot.diag",
                 "boot lottie prepared internal=%uK/%uK psram=%uK/%uK",
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
    - lambda: 'id(backlight_output).set_next_fade_duration(2400);'
    - light.turn_on:
        id: display_backlight
        brightness: !lambda |-
          const float b = id(settings_display_brightness).state;
          return (b < 28.0f ? 28.0f : b) / 100.0f;
        transition_length: 0ms
    - delay: 2600ms
    - script.execute: boot_start_esphome_animation
    - delay: 4200ms
    - lambda: |-
        ESP_LOGW("boot.diag",
                 "boot transition: hide animation internal=%uK/%uK psram=%uK/%uK",
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
        lvgl_esphome_dsi_mark_stress("boot-hide-overlay", 700);
    - script.execute: boot_hide_esphome_animation
    - script.wait: boot_hide_esphome_animation
    - lambda: |-
        lvgl_esphome_dsi_mark_stress("boot-show-home-apply", 1500);
    - script.execute: ui_show_home_content_after_boot
    - script.wait: ui_show_home_content_after_boot
    - script.execute: ui_apply_settings_state
    - script.wait: ui_apply_settings_state
    - lambda: |-
        lv_timer_handler();
        lv_refr_now(nullptr);
        lv_timer_handler();
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
        ESP_LOGW("boot.diag",
                 "boot transition: controls shown internal=%uK/%uK psram=%uK/%uK",
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
    - script.execute: boot_finish_esphome_overlay
    - script.wait: boot_finish_esphome_overlay
    - lambda: |-
        lv_refr_now(nullptr);
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
    - delay: 700ms
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
        lvgl_esphome_dsi_mark_stress("boot-pa-enable", 500);
    - switch.turn_on: pa_enable
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(240);
        lvgl_esphome_dsi_mark_stress("boot-audio-unmute", 600);
    - delay: 240ms
    - media_player.unmute: local_music_player
    - media_player.volume_set:
        id: local_music_player
        volume: 50%
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(240);
        lvgl_esphome_dsi_mark_stress("boot-boot-sound", 1200);
    - script.execute: ui_play_boot_sound
    - lambda: |-
        lvgl_esphome_dsi_mark_stress("boot-done-flag", 600);
    - globals.set:
        id: boot_sequence_done
        value: 'true'
    - micro_wake_word.start:
    - script.execute: voice_assistant_apply_idle_wake_word
    - lambda: |-
        ESP_LOGW("boot.diag", "boot transition: done");

ota:
- platform: esphome

api:
  homeassistant_states: true
  actions:
    - action: debug_open_player
      then:
        - script.execute: ui_open_player_app
    - action: debug_open_settings
      then:
        - script.execute: ui_open_settings_app
    - action: debug_open_voice
      then:
        - script.execute: ui_open_voice_app
    - action: debug_open_queue
      then:
        - script.execute: open_queue_panel
    - action: debug_open_speaker_group
      then:
        - script.execute: open_speaker_group_panel
    - action: debug_close_app
      then:
        - script.execute: ui_close_app
    - action: debug_open_immich
      then:
        - script.execute: ui_open_immich_app
    - action: debug_next_immich_photo
      then:
        - script.execute: immich_fetch_next_photo
    - action: debug_next_track
      then:
        - media_player.next: sendspin_group
    - action: debug_previous_track
      then:
        - media_player.previous: sendspin_group
    - action: debug_set_artwork
      variables:
        url: string
      then:
        - artwork_image.set_url:
            id: album_art_background
            update: true
            url: !lambda 'return url;'
  on_client_connected:
  - lambda: |-
      ESP_LOGD("api.diag", "CONNECTED client=%s address=%s uptime=%lums internal_free=%uKiB psram_free=%uKiB",
               client_info.c_str(),
               client_address.c_str(),
               (unsigned long) millis(),
               (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
               (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
  - lambda: |-
      if (client_info.find("Home Assistant") != std::string::npos) {
        id(ha_base_url) = client_address;
        const std::string current_rt = id(settings_realtime_backend_url).state;
        if (current_rt.empty() || current_rt.find("homeassistant.local") != std::string::npos) {
          std::string host = client_address;
          const size_t scheme = host.find("://");
          if (scheme != std::string::npos) {
            host = host.substr(scheme + 3);
          }
          const size_t slash = host.find('/');
          if (slash != std::string::npos) {
            host = host.substr(0, slash);
          }
          const size_t first_colon = host.find(':');
          const size_t last_colon = host.rfind(':');
          if (first_colon != std::string::npos && first_colon == last_colon) {
            host = host.substr(0, first_colon);
          }
          const std::string realtime_url = "ws://" + host + ":${ha_openai_realtime_port}/";
          ESP_LOGD("api.diag", "Detected realtime backend URL: %s", realtime_url.c_str());
          id(va)->set_timeout("detected_realtime_backend_url", 1500, [realtime_url]() {
            ESP_LOGD("api.diag", "Using detected realtime backend URL: %s", realtime_url.c_str());
            id(va)->set_url(realtime_url);
          });
        }
      }
  - script.execute: subscribe_media_after_boot
  on_client_disconnected:
  - lambda: |-
      ESP_LOGD("api.diag", "DISCONNECTED client=%s address=%s uptime=%lums wifi_connected=%s rssi=%.0fdBm internal_free=%uKiB psram_free=%uKiB",
               client_info.c_str(),
               client_address.c_str(),
               (unsigned long) millis(),
               (esphome::wifi::global_wifi_component != nullptr && esphome::wifi::global_wifi_component->is_connected()) ? "YES" : "NO",
               id(diagnostics_wifi_rssi).state,
               (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
               (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));

time:
- platform: homeassistant
  id: ha_time

logger:
  hardware_uart: UART0
  # Compile INFO support so the on-device diagnostics switches can enable it,
  # while keeping normal operation quiet through initial_level.
  level: INFO
  initial_level: WARN
  logs:
    wifi: WARN
    wifi_esp32: WARN
    api.connection: WARN
    esp32_hosted: WARN
    esp-idf: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: none
  post_connect_roaming: false
  on_connect:
    - lambda: |-
        ESP_LOGD("wifi.diag", "CONNECT uptime=%lums rssi=%.0fdBm internal_free=%uKiB psram_free=%uKiB",
                 (unsigned long) millis(),
                 id(diagnostics_wifi_rssi).state,
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
  on_disconnect:
    - lambda: |-
        ESP_LOGD("wifi.diag", "DISCONNECT_TRIGGER uptime=%lums last_rssi=%.0fdBm internal_free=%uKiB psram_free=%uKiB",
                 (unsigned long) millis(),
                 id(diagnostics_wifi_rssi).state,
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));

# Keep the local web server disabled on the P4 audio profile. It consumes TCP
# listen sockets and internal memory, and audio streaming is much more sensitive
# to both than this device is to local HTTP diagnostics.
