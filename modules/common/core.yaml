# Core ESPHome runtime and network integration.
# This file intentionally holds boot behavior, API, logging, Wi-Fi and the lightweight web server.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: ${esphome_min_version}
  # Keep this integration worktree isolated from the production checkout.
  build_path: C:/aeh-build/${name}-productization-idf555-late-hs
  project:
    name: "${project_namespace}.${friendly_name}"
    version: ${firmware_version}
  # These are project-local compile-time toggles consumed by patched
  # ESPHome/ESP-IDF code. They are not Kconfig symbols, so sdkconfig_options
  # would silently drop them. The native build_flags key works with both the
  # ESP-IDF/CMake and PlatformIO build paths.
  build_flags:
      # JPEG is a one-shot producer competing with the continuously scanned
      # DSI framebuffer. A 64-byte burst leaves arbitration points for DSI
      # without reducing image quality or the 128-byte LVGL/PPA animation path.
      - -DCONFIG_ESPHOME_JPEG_DMA2D_BURST_LENGTH=64
      - -DCONFIG_ESPHOME_JPEG_DMA2D_DESC_BURST_DISABLE=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_PRE_OUTPUT_MSYNC_CHUNK=65536
      - -DCONFIG_ESPHOME_JPEG_DMA2D_PRE_OUTPUT_MSYNC_YIELD=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_RUNTIME_SKIP_POST_OUTPUT_MSYNC=1
      - -DCONFIG_ESPHOME_JPEG_DMA2D_OUTPUT_MSYNC_CHUNK=16384
      - -DCONFIG_ESPHOME_JPEG_DMA2D_OUTPUT_MSYNC_YIELD=1
      - -DCONFIG_ESPHOME_JPEG_DECODER_INTERNAL_INPUT_MAX_BYTES=131072
      - -DCONFIG_ESPHOME_JPEG_DECODER_DIRECT_PSRAM_INPUT=1
      - -DCONFIG_ESPHOME_JPEG_BUFFER_DIAGNOSTICS=0
      - -DCONFIG_ESPHOME_ARTWORK_SKIP_DMA_OUTPUT_MSYNC=1
      - -DCONFIG_ESPHOME_ARTWORK_BUFFER_DIAGNOSTICS=0
      - -DCONFIG_ESPHOME_ARTWORK_CACHE_SYNC_CHUNK=4096
      - -DCONFIG_ESPHOME_ARTWORK_CACHE_SYNC_FIFO_MIN=832
      - -DCONFIG_ESPHOME_ARTWORK_CACHE_SYNC_WAIT_US=3000
      # Apply the 800x800 artwork scrim as short PPA transactions. This lets
      # the 60 Hz wave and marquee compositor run between artwork bands.
      - -DCONFIG_ESPHOME_ARTWORK_PPA_BLEND_BAND_HEIGHT=32
      - -DCONFIG_ESPHOME_ARTWORK_POST_DECODE_DSI_QUIET_MS=0
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_DSI_QUIET_MS=0
      # Local Immich requests used to let the HTTP client write 4 KiB chunks
      # straight into PSRAM. Keep the socket-side buffer internal and copy one
      # cache-sized block at a time so DSI keeps arbitration opportunities.
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_RX_BUFFER_SIZE=1024
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_STAGING_SIZE=4096
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_READ_CHUNK=4096
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_COPY_FIFO_GUARD=1
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_COPY_CHUNK=1024
      # Leave one scheduler tick between PSRAM writes. The FIFO guard alone
      # can approve several adjacent writes while the display still has data,
      # then all of them reach the shared bus before DSI can recover.
      - -DCONFIG_ESPHOME_ARTWORK_LOCAL_HTTP_COPY_DELAY_TICKS=1
      # Bound each physical C6 read so its measured DMA occupancy, including
      # arbitration overhead, fits inside vertical blanking. HTTP still drains
      # 4 KiB at a time; only the underlying CMD53 transactions are split.
      - -DCONFIG_ESPHOME_ESP_HOSTED_SDIO_RX_CHUNK_SIZE=1024
      # The measured idle FIFO floor is 894-895 words. Keep the guard below
      # that floor so a safe vblank slot is actually attainable; the SDIO
      # helper now waits for one instead of eventually transferring anyway.
      - -DCONFIG_ESPHOME_ESP_HOSTED_SDIO_DSI_FIFO_MIN=832
      - -DCONFIG_ESPHOME_ESP_HOSTED_SDIO_DSI_FIFO_WAIT_US=3000
      # Parse the C6 stream incrementally from one 1 KiB internal DMA buffer.
      # This removes the two growing 20-28 KiB stream buffers whose fallback to
      # PSRAM could contend with the continuously scanned DSI framebuffer.
      - -DCONFIG_ESPHOME_ESP_HOSTED_SDIO_INCREMENTAL_RX=1
      # Keep MTU-sized lwIP payloads in internal RAM while capacity is
      # available. This avoids a second PSRAM write for every Wi-Fi packet;
      # the patched driver falls back safely and vblank-guards only that rare
      # external-memory copy.
      - -DCONFIG_ESPHOME_ESP_HOSTED_SDIO_RX_NETWORK_INTERNAL=1
      # Allocate the latency-critical 48 KiB raw SDIO RX pool before ESP-Hosted
      # creates its queues, while internal RAM is still contiguous. Keep the
      # generic 40 KiB transport pool on the normal allocator so audio/LVGL
      # retain enough internal RAM after boot.
      - -DCONFIG_ESPHOME_ESP_HOSTED_SDIO_RX_INTERNAL_MEMPOOL=1
      - -DCONFIG_ESPHOME_ESP_HOSTED_COMMON_INTERNAL_MEMPOOL=0
      - -DCONFIG_ESPHOME_DSI_MSYNC_CHUNK=32768
      - -DCONFIG_ESPHOME_DSI_CACHE_WRITE_QOS=0
      - -DCONFIG_ESPHOME_DSI_CACHE_READ_QOS=1
      - -DCONFIG_ESPHOME_DSI_CPU_WRITE_QOS=0
      - -DCONFIG_ESPHOME_DSI_CPU_READ_QOS=1
      - -DCONFIG_ESPHOME_DSI_GDMA_WRITE_QOS=0
      - -DCONFIG_ESPHOME_DSI_GDMA_READ_QOS=15
      # Frame callbacks now only acknowledge autonomous GDMA reload progress.
      # Keep them above default-priority SDMMC traffic so buffer
      # handoffs are observed promptly during Wi-Fi bursts.
      - -DCONFIG_ESPHOME_MIPI_DSI_GDMA_INTR_PRIORITY=3
      # Temporary dense FIFO sampling inside explicitly marked JPEG/transition
      # windows. Remove after the blue-flash source is classified.
      - -DCONFIG_ESPHOME_DSI_STRESS_DIAGNOSTICS=1
      - -DCONFIG_ESPHOME_MIPI_DSI_DMA_FLOW_CONTROLLER=1
      - -DCONFIG_ESPHOME_MIPI_DSI_DISABLE_FRAME_ACK=1
      - -DCONFIG_ESPHOME_MIPI_DSI_CONTINUOUS_HS_CLOCK=1
      - -DCONFIG_ESPHOME_LVGL_PPA_DSI_BACKPRESSURE=1
      - -DCONFIG_ESPHOME_LVGL_PPA_DSI_FIFO_MIN=832
      - -DCONFIG_ESPHOME_LVGL_PPA_DSI_WAIT_US=6000
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_BACKPRESSURE=1
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_FIFO_MIN=832
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_WAIT_US=3000
      - -DCONFIG_ESPHOME_LVGL_SW_ARTWORK_DSI_ROW_PERIOD=4
      - -DCONFIG_ESPHOME_LVGL_PPA_BLEND_BAND_HEIGHT=32
      - -DCONFIG_ESPHOME_LVGL_PPA_BLEND_BAND_GAP_US=0
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_BURST_LENGTH=128
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_BAND_HEIGHT=32
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_BAND_GAP_US=0
      # Split full-screen transforms into phase-aligned vertical strips. A
      # single 800x800 SRM transaction can complete with unwritten rows on P4.
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSFORM_BAND_HEIGHT=220
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSFORM_BAND_GAP_US=0
      # ESP-IDF 5.5 performs the macro-block split internally. One SRM command
      # preserves scaler phase and avoids four task/driver submissions per frame.
      - -DCONFIG_ESPHOME_LVGL_PPA_DIRECT_FULL_FRAME=1
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_ANIMATION_BURST_LENGTH=128
      - -DCONFIG_ESPHOME_LVGL_PPA_DIRECT_ANIMATION_BURST_LENGTH=128
      # Persistent regional animations share the PSRAM bus with the DSI scan.
      # Keep full-screen transforms at 128 while giving wave/marquee updates
      # shorter arbitration bursts and a FIFO-margin gate.
      - -DCONFIG_ESPHOME_LVGL_PPA_DIRECT_REGION_BURST_LENGTH=128
      - -DCONFIG_ESPHOME_LVGL_PPA_DIRECT_REGION_DSI_FIFO_MIN=832
      - -DCONFIG_ESPHOME_LVGL_PPA_DIRECT_REGION_DSI_WAIT_US=3000
      - -DCONFIG_ESPHOME_LVGL_SNAPSHOT_DMA2D_M2M=1
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSFORM_DSI_FIFO_MIN=832
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSFORM_DSI_WAIT_US=3000
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSFORM_POST_WAIT=0
      - -DCONFIG_ESPHOME_LVGL_PPA_SKIP_DMA_SOURCE_MSYNC=1
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_AXI_BURSTINESS=4
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_PEAK_LEVEL=2
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_TRANSACTION_LEVEL=4
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_WRITE_PRIORITY=0
      - -DCONFIG_ESPHOME_LVGL_PPA_SRM_READ_PRIORITY=0
  on_boot:
    priority: 600
    then:
    - micro_wake_word.stop:
    - script.stop: ui_play_va_error_sound
    - output.turn_off: backlight_output
    - light.turn_off:
        id: display_backlight
    - lambda: |-
        id(album_art_background).set_sendspin_paused(true);
        id(boot_audio_ready) = false;
    - lvgl.page.show:
        id: controls_page
    - delay: 250ms
    # Reserve the full Lottie frame cache while PSRAM is still contiguous.
    # Tile snapshots are deliberately built afterwards; doing this in the
    # opposite order fragmented the largest block and forced live vector
    # rendering during the visible splash animation.
    - script.execute: boot_show_esphome_animation
    - wait_until:
        condition:
          lambda: |-
            if (id(boot_esphome_animation) == nullptr) return true;
            auto *ctx = static_cast<esphome::lvgl::LottieContext *>(lv_obj_get_user_data(id(boot_esphome_animation)));
            return esphome::lvgl::lottie_is_ready(ctx);
        timeout: 4s
    # Apply persisted UI state while the panel is still dark. Performing these
    # label/style updates during the splash-to-home hand-off can starve DSI.
    - script.execute: ui_apply_settings_state
    - script.wait: ui_apply_settings_state
    # Preserve large contiguous blocks for the raw home-page cache first. The
    # encoded artwork buffers are then reserved once, while the panel is still
    # dark, and reused for every Music Assistant/Immich image.
    - lambda: |-
        const bool player_reserved = id(album_art_background).reserve_download_buffer();
        const bool immich_a_reserved = id(immich_photo_image).reserve_download_buffer();
        const bool immich_a_http = id(immich_photo_image).reserve_local_http_client(id(immich_url).state);
        ESP_LOGW("boot.diag", "JPEG input buffers reserved player=%d immich=%d http=%d psram=%uK/%uK",
                 player_reserved, immich_a_reserved, immich_a_http,
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
    # Wi-Fi scan/association briefly consumes enough memory bandwidth to make
    # an otherwise fast Lottie frame miss its visible cadence. Keep the panel
    # dark until association has settled, with a bounded offline fallback.
    - wait_until:
        condition:
          lambda: |-
            return esphome::wifi::global_wifi_component != nullptr &&
                   esphome::wifi::global_wifi_component->is_connected();
        timeout: 6s
    - delay: 300ms
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
    - output.turn_off: backlight_output
    - light.turn_off:
        id: display_backlight
    - lambda: |-
        ESP_LOGW("boot.diag",
                 "boot lottie prepared internal=%uK/%uK psram=%uK/%uK",
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
    - output.ledc.set_next_fade_duration:
        id: backlight_output
        duration: 2400ms
    - light.turn_on:
        id: display_backlight
        brightness: !lambda |-
          const float b = id(settings_display_brightness).state;
          return (b < 28.0f ? 28.0f : b) / 100.0f;
        transition_length: 0ms
    - delay: 2600ms
    # Audio initialization is complete by this point. Enable the amplifier
    # before the final splash phase so the chime can accompany the wordmark
    # without exposing codec/PA startup noise.
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
        lvgl_esphome_dsi_mark_stress("boot-pa-enable", 500);
    - switch.turn_on: pa_enable
    - delay: 240ms
    - media_player.unmute: local_music_player
    - media_player.volume_set:
        id: local_music_player
        volume: 50%
    - lambda: |-
        lvgl_esphome_snapshot_dsi_quiet_ms(240);
        lvgl_esphome_dsi_mark_stress("boot-boot-sound", 6000);
    - script.execute: boot_start_esphome_animation
    - script.wait: boot_reveal_esphome_wordmark
    # The wordmark and chime are now complete. Fade the panel fully to black
    # before changing the overlay ownership. Snapshotting while the boot
    # overlay was still present allowed a scanout fragment of the splash to
    # become the first Home transition frame.
    - output.ledc.set_next_fade_duration:
        id: backlight_output
        duration: 700ms
    - light.turn_off:
        id: display_backlight
        transition_length: 0ms
    - delay: 730ms
    - lambda: |-
        ESP_LOGW("boot.diag",
                 "boot transition: hide animation internal=%uK/%uK psram=%uK/%uK",
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
        lvgl_esphome_dsi_mark_stress("boot-hide-overlay", 700);
    - script.execute: boot_hide_esphome_animation
    - script.wait: boot_hide_esphome_animation
    - script.execute: boot_finish_esphome_overlay
    - script.wait: boot_finish_esphome_overlay
    # Stop and hide the splash before any cache/layout work. The panel is
    # already dark, so this does not change the visible sequence, but it keeps
    # the boot Lottie from competing with snapshot encoding and prevents its
    # last direct frame from leaking into Home.
    - lambda: |-
        if (!lvgl_esphome_direct_regions_pause(true, 500)) {
          ESP_LOGW("boot.diag", "direct-region drain timed out before first Home refresh");
        }
        lvgl_esphome_snapshot_dsi_quiet_ms(180);
        // Force one ordinary LVGL refresh after the splash is gone so both
        // display buffers contain the covered Home tree, not a stale boot
        // fragment.
        lv_refr_now(nullptr);
    # Build the application and Home caches only after the splash worker and
    # its overlay have been fully stopped.
    - script.execute: ui_build_tile_snapshots_now
    - script.wait: ui_build_tile_snapshots_now
    - script.execute: ui_finish_boot_tile_snapshot_cache
    - script.wait: ui_finish_boot_tile_snapshot_cache
    - lambda: |-
        auto *frame = id(my_display).get_presented_frame_buffer();
        lv_area_t area{};
        uint32_t white_pixels = 0;
        if (frame != nullptr && id(boot_esphome_animation) != nullptr) {
          lv_obj_get_coords(id(boot_esphome_animation), &area);
          for (int y = area.y1; y <= area.y2; y++) {
            const uint8_t *row = frame + (static_cast<size_t>(y) * 800U + area.x1) * 3U;
            for (int x = area.x1; x <= area.x2; x++, row += 3U) {
              white_pixels += row[0] > 210U && row[1] > 210U && row[2] > 210U;
            }
          }
        }
        ESP_LOGW("boot.diag", "final trace before home: white=%u fb=%p",
                 (unsigned) white_pixels, frame);
        lvgl_esphome_dsi_mark_stress("boot-show-home-apply", 1500);
    - script.execute: ui_show_home_content_after_boot
    - script.wait: ui_show_home_content_after_boot
    - lambda: |-
        // Keep the boot-wide region lease held while the final Home frame is
        // seeded into both LVGL/DSI buffers. Releasing first allowed a queued
        // weather frame to race this handoff and occasionally left the next
        // application transition with the pressed tile in front.
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
        ESP_LOGW("boot.diag",
                 "boot transition: controls shown internal=%uK/%uK psram=%uK/%uK",
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                 (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                 (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
    - lambda: |-
        lv_refr_now(nullptr);
        if (!lvgl_esphome_direct_handoff_to_lvgl(120)) {
          ESP_LOGW("boot.diag", "home framebuffer handoff did not seed both LVGL buffers");
        }
        if (!lvgl_esphome_direct_regions_pause(false, 120)) {
          ESP_LOGW("boot.diag", "direct-region resume after Home handoff timed out");
        }
        lvgl_esphome_snapshot_dsi_quiet_ms(450);
    - output.ledc.set_next_fade_duration:
        id: backlight_output
        duration: 900ms
    - light.turn_on:
        id: display_backlight
        brightness: !lambda |-
          const float b = id(settings_display_brightness).state;
          return (b < 28.0f ? 28.0f : b) / 100.0f;
        transition_length: 0ms
    - delay: 930ms
    - lambda: |-
        lvgl_esphome_dsi_mark_stress("boot-done-flag", 600);
    - globals.set:
        id: boot_sequence_done
        value: 'true'
    - lambda: |-
        // A backend can report the first connection error while its socket
        // is still settling. Do not let that delayed error chime overlap the
        // boot chime or the final black-to-Home handoff.
        id(boot_error_sound_allowed_after_ms) = millis() + 5000U;
    - script.execute: home_weather_refresh
    # The weather presenter is deliberately armed only after the boot overlay
    # and the first Home snapshot are on screen. Otherwise its one-shot Lottie
    # can finish underneath the splash and only the retained last frame leaks
    # into the first visible Home frame.
    - lvgl_material.weather.resume:
        id: home_weather_presenter
        value: 'true'
    - lambda: |-
        id(display_last_interaction_ms) = millis();
        lv_display_trigger_activity(nullptr);
    - script.execute: voice_assistant_start_idle_wake_word
    - lambda: |-
        ESP_LOGW("boot.diag", "boot transition: done");
    - globals.set:
        id: boot_audio_ready
        value: 'true'

ota:
- platform: esphome

api:
  custom_services: true
  homeassistant_states: true
  actions:
    - action: home_tiles_set_config
      variables:
        payload: string
      then:
        - lvgl_material.tiles.configure:
            id: home_material_tiles
            payload: !lambda 'return payload;'
        - lambda: |-
            const uint32_t changed = id(home_material_tiles).get_last_changed_slots();
            if (changed != 0) {
              id(ui_managed_tile_refresh_pending_mask) |= changed;
              id(ui_refresh_managed_tile_snapshots).execute();
            }
    - action: notification_show
      variables:
        title: string
        message: string
        icon: string
        duration_ms: int
      then:
        - lvgl_material.notification.show:
            id: material_notification_overlay
            title: !lambda 'return title;'
            message: !lambda 'return message;'
            icon: !lambda 'return icon;'
            duration: !lambda 'return duration_ms;'
    - action: notification_dismiss
      then:
        - lvgl_material.notification.dismiss:
            id: material_notification_overlay
    - action: debug_restart
      then:
        - lambda: 'App.safe_reboot();'
    - action: debug_test_long_title
      then:
        - lambda: |-
            id(media_title_sensor).publish_state(
                "A deliberately long Atmosfera Echo Hub title used to benchmark smooth marquee rendering");
        - script.execute: media_title_marquee_reset_and_start
    - action: debug_benchmark_home_swipe
      then:
        - lambda: |-
            if (id(ui_active_app) != 0 || id(ui_snapshot_io_busy)) return;
            id(ui_page) = 1;
            id(ui_home_page) = 1;
            lvgl_esphome_set_swipe_logging_enabled(true);
            lvgl_esphome_snapshot_swipe_set_page_indicator(1, 4);
            if (!lvgl_esphome_snapshot_swipe_begin(
                    id(controls_root_1), id(controls_root_2), 800, 800)) {
              ESP_LOGW("swipe.bench", "Unable to start synthetic home swipe");
            }
        - repeat:
            count: 31
            then:
              - lambda: |-
                  const int x = -static_cast<int>(((iteration + 1U) * 480U) / 31U);
                  lvgl_esphome_snapshot_swipe_request_update(x, 800 + x);
              - delay: 16ms
        - lambda: |-
            lvgl_esphome_snapshot_swipe_request_finish(-800, 0, 280, true);
        # Reproduce a real chained gesture while the first page is still
        # settling instead of waiting for the previous animation to go idle.
        - delay: 32ms
        - lambda: |-
            id(ui_page) = 2;
            id(ui_home_page) = 2;
            lvgl_esphome_snapshot_swipe_set_page_indicator(2, 4);
            if (!lvgl_esphome_snapshot_swipe_begin(
                    id(controls_root_2), id(controls_root_3), 800, 800)) {
              ESP_LOGW("swipe.bench", "Unable to start immediate synthetic 2->3 swipe");
            }
        - repeat:
            count: 31
            then:
              - lambda: |-
                  const int x = -static_cast<int>(((iteration + 1U) * 480U) / 31U);
                  lvgl_esphome_snapshot_swipe_request_update(x, 800 + x);
              - delay: 16ms
        - lambda: |-
            lvgl_esphome_snapshot_swipe_request_finish(-800, 0, 280, true);
        - delay: 420ms
        - lambda: |-
            id(ui_page) = 3;
            id(ui_home_page) = 3;
            lvgl_esphome_set_swipe_logging_enabled(id(settings_swipe_logs_switch).state);
        - script.execute: ui_apply_tile_positions
        - script.execute: ui_refresh_tile_snapshots
    - action: debug_navigation_home
      variables:
        page: int
      then:
        - lambda: |-
            int index = page - 1;
            if (index < 0) index = 0;
            if (index > 3) index = 3;
            id(ui_navigation).show_home();
            id(ui_navigation).activate_home_view(index);
            id(ui_page) = index + 1;
            id(ui_home_page) = index + 1;
            id(home_weather_presenter).resume_after_navigation(index == 0);
        - script.execute: ui_apply_tile_positions
    - action: debug_navigation_touch
      variables:
        phase: int
        x: int
        y: int
      then:
        - lambda: |-
            if (phase == 0) {
              id(ui_navigation).touch_begin(x, y);
            } else if (phase == 1) {
              id(ui_navigation).touch_update(x, y);
            } else {
              id(ui_navigation).touch_end();
            }
    - action: debug_weather_press
      variables:
        pressed: bool
      then:
        - lambda: |-
            lv_obj_send_event(id(tile_weather_button),
                              pressed ? LV_EVENT_PRESSED : LV_EVENT_RELEASED,
                              nullptr);
    - action: debug_navigation_trace
      variables:
        enabled: bool
      then:
        - lambda: 'lvgl_esphome_set_swipe_logging_enabled(enabled);'
    - action: debug_task_profile
      then:
        - task_runtime_profiler.log: runtime_profiler
    - action: debug_log_memory
      variables:
        phase: string
      then:
        - script.execute:
            id: diagnostics_log_runtime_memory
            phase: !lambda 'return phase;'
    - action: debug_open_player
      then:
        - lvgl.navigation.open: player_application
    - action: debug_snapshot_app_state
      variables:
        phase: string
      then:
