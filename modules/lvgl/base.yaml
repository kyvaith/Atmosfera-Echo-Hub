# Static portions of the ESPHome boot mark stay outside Lottie. Only the
# animated white trace is rasterized for every frame.
image:
  - platform: file
    file: "assets/images/esphome_house.svg"
    id: boot_esphome_house_asset
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "assets/images/esphome_wordmark.svg"
    id: boot_esphome_wordmark_asset
    type: RGB
    transparency: alpha_channel

# LVGL renderer configuration.
# Page definitions are split into modules/lvgl/pages so the renderer settings stay easy to scan.
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  update_interval: 10ms
  # Keep LVGL on full/direct rendering. The partial framebuffer compositor was
  # faster in a few synthetic paths, but on this RGB888 MIPI DSI panel it caused
  # persistent horizontal artifacts with artwork and assistant screens.
  buffer_size: 100%
  draw_rounding: 32
  direct_mode: true
  full_refresh: true
  byte_order: little_endian
  bg_color: 0x000000
  fps_benchmark: true
  # We expose FPS/CPU through our own settings-controlled HUD; keep LVGL's
  # native sysmon disabled so it does not add another always-on overlay/timer.
  perf_monitor: false
  color_depth: 32
  # M3 Wear OS Tiles design tokens. Geometry is defined by each tile
  # archetype, while surfaces, typography colors and radii stay centralized.
  style_definitions:
    - id: m3_tile_surface
      bg_color: 0x071018
      bg_opa: 100%
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 200
      pad_all: 0
      text_color: 0xF5F7FA
    - id: m3_tile_primary
      bg_color: ${home_accent_color}
      bg_opa: 100%
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 200
      pad_all: 0
      text_color: 0x071018
    - id: m3_tile_secondary
      bg_color: 0x4FC3F7
      bg_opa: 100%
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 200
      pad_all: 0
      text_color: 0x071018
    - id: m3_tile_tertiary
      bg_color: 0x26A69A
      bg_opa: 100%
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 200
      pad_all: 0
      text_color: 0x071018
    - id: m3_tile_primary_container
      bg_color: 0x8AD8F8
      bg_opa: 100%
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 200
      pad_all: 0
      text_color: 0x071018
  use_ppa: true
  use_ppa_draw: true
  use_ppa_blend: true
  use_ppa_img: true
  profiler: false
  # Route Home gestures through the LVGL input driver. The direct compositor
  # keeps the current JPEG-backed previous/current/next window, while LVGL
  # owns tap cancellation and pressed-state dispatch.
  navigation:
    id: ui_navigation
    home:
      page: controls_page
      widgets:
        - controls_root_1
        - controls_root_2
        - controls_root_3
        - controls_root_4
      indicators:
        - page_indicator_1
        - page_indicator_2
        - page_indicator_3
        - page_indicator_4
    blockers:
      - boot_overlay
      - voice_assistant_overlay
      - global_volume_overlay
      - ui_touch_blocker
    close_edge_size: 50
    close_commit_threshold: 36
    # Capture on the first directional sample. A stationary contact is still
    # deferred and replayed as a tap on release, so this does not turn normal
    # taps into swipes.
    # Ignore only the GT911's one-pixel stationary jitter. A real horizontal
    # move still starts on its first physical sample, while a tap cannot nudge
    # the direct carousel before its button action is replayed.
    swipe_start_distance: 0
    axis_bias: 1
    home_commit_threshold: 25%
    on_home_changed:
      - globals.set:
          id: ui_page
          value: !lambda 'return page;'
      - globals.set:
          id: ui_home_page
          value: !lambda 'return page;'
    on_home_touch_start:
      - lambda: |-
          id(ui_last_touch_activity_ms) = millis();
      - script.stop: ui_refresh_home_snapshot_if_pending
      - script.stop: ui_refresh_managed_tile_snapshots
    on_home_swipe_start:
      - lvgl_material.weather.suspend: home_weather_presenter
    on_home_touch_end:
      - lambda: 'id(ui_last_touch_activity_ms) = millis();'
      - if:
          condition:
            lambda: 'return id(ui_managed_tile_refresh_pending_mask) != 0;'
          then:
            - script.execute: ui_refresh_managed_tile_snapshots
      # Weather is resumed only from on_home_presented, after the swipe
      # compositor has committed the destination page. Resuming here races
      # the last gesture frame and makes page 1 briefly catch up or disappear.
    on_home_presented:
      # Returning from an application can present the same Home index, so
      # on_home_changed is not guaranteed to run after an app changes ui_page.
      - globals.set:
          id: ui_page
          value: !lambda 'return page;'
      - globals.set:
          id: ui_home_page
          value: !lambda 'return page;'
      - lvgl_material.weather.resume:
          id: home_weather_presenter
          value: !lambda 'return id(boot_sequence_done) && page == 1;'
      # Weather promotion is asynchronous. Re-assert the fixed status chrome
      # after the handoff so a completed weather frame cannot cover it.
      - delay: 20ms
      - script.execute: ui_refresh_global_status_icons
      # A Home Assistant tile update can arrive while another carousel page is
      # visible.  The touch-end callback may then run the refresh worker while
      # ui_page still names the source page, so page 2's pending slots are
      # intentionally left queued.  Retry after the navigation owner commits
      # the destination page; otherwise the security snapshot keeps its old
      # palette until a later state update happens to hit page 2 again.
      - if:
          condition:
            lambda: 'return id(ui_managed_tile_refresh_pending_mask) != 0;'
          then:
            - script.execute: ui_refresh_managed_tile_snapshots
    applications:
      - id: player_application
        page: music_page
        widget: wear_root
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.execute: ui_clear_interaction_press
          - script.wait: ui_clear_interaction_press
          - script.stop: ui_refresh_tile_snapshots
          - lambda: 'lvgl_esphome_snapshot_set_status_icons_visible(true);'
          - script.stop: volume_overlay_timeout
          - script.stop: open_speaker_group_panel
          - script.stop: update_speaker_group_panel
          - lambda: 'id(home_weather_presenter).release_for_application();'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              // Retain the active cover across closes; only idle decoder
              // capacity may be reclaimed before rebuilding the pair.
              id(album_art_background).release_unused_decode_capacity();
              // Keep Gallery's large contiguous decode surface intact. Player
              // owns a separate two-buffer RGB565 pool so its current cover
              // and next crossfade generation never fragment Gallery memory.
              constexpr size_t player_decode_capacity = 800U * 800U * sizeof(uint16_t);
              const bool player_pool_ready =
                  id(album_art_background).reserve_decode_buffer_capacity(player_decode_capacity, 2);
              ESP_LOGI("ui.memory", "Player decode pool ready=%s psram=%uK/%uK",
                       YESNO(player_pool_ready),
                       (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                       (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
              // Quiesce the regional renderer before selecting its backdrop.
              // Disabling it intentionally drops pending image work, so doing
              // this last left the boot placeholder queued under live artwork.
              id(media_wavy_progress).set_direct_present(false);
              id(media_speaker_panel_open) = false;
              id(global_volume_time_press_tracking) = false;
              id(global_volume_dragging) = false;
              id(global_volume_renderer).end();
              lv_anim_del(id(global_volume_overlay), nullptr);
              lv_anim_del(id(volume_overlay), nullptr);
              lv_obj_set_style_opa(id(global_volume_overlay), LV_OPA_COVER, 0);
              lv_obj_set_style_opa(id(volume_overlay), LV_OPA_COVER, 0);
              lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN);
              auto *live_artwork = id(album_art_background).get_lv_image_dsc();
              auto *placeholder_artwork = id(album_art_placeholder).get_lv_image_dsc();
              const bool artwork_is_placeholder =
                  live_artwork != nullptr && placeholder_artwork != nullptr &&
                  (live_artwork == placeholder_artwork ||
                   live_artwork->data == placeholder_artwork->data);
              const bool has_live_artwork =
                  id(album_art_background).get_buffer_generation() != 0 &&
                  live_artwork != nullptr && live_artwork->header.w > 0 && live_artwork->header.h > 0 &&
                  !artwork_is_placeholder;
              if (has_live_artwork) {
                lv_image_set_src(id(album_art_background_widget), live_artwork);
                lv_obj_add_flag(id(figma_media_artwork_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(artwork_primary_overlay), LV_OBJ_FLAG_HIDDEN);
                // Keep the direct crop and the full artwork surface on the
                // same pixels. A separate full-screen scrim can be hidden by
                // the artwork error path after the crop was prepared.
                lv_obj_add_flag(id(artwork_scrim), LV_OBJ_FLAG_HIDDEN);
                id(media_wavy_progress).set_background(live_artwork, false);
              } else {
                // Missing artwork is rendered by artwork_bg_panel's generated
                // accent gradient. Keep the legacy bitmap hidden so its
                // purple placeholder never becomes part of the player scene.
                lv_obj_add_flag(id(figma_media_artwork_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(artwork_primary_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(artwork_scrim), LV_OBJ_FLAG_HIDDEN);
                id(media_wavy_progress).set_background_gradient(
                    id(ui_accent_dark_color), id(ui_accent_color), false);
              }
        on_before_reveal:
          # Prepare the live Player while the compositor still presents the
          # final snapshot frame, preventing a one-frame placeholder flash.
          - script.execute: ui_prepare_player_page
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '1'
          - script.execute: ui_refresh_global_status_icons
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: 'lv_obj_move_foreground(id(app_close_gesture_zone));'
          - delay: 40ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - lambda: |-
              // Wake the player renderer immediately after the app becomes visible.
              // Waiting for the next 16 ms interval made the first player frame look frozen.
              id(media_wavy_progress).set_direct_present(true);
              id(media_wavy_progress).service_present();
          - script.execute: media_update_main_control
          - script.execute: media_resume_artwork_after_player_open
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - script.stop: volume_overlay_timeout
          - script.stop: open_speaker_group_panel
          - script.stop: update_speaker_group_panel
          - lambda: |-
              id(media_speaker_panel_open) = false;
              id(global_volume_time_press_tracking) = false;
              id(global_volume_dragging) = false;
              id(global_volume_renderer).end();
              lv_anim_del(id(global_volume_overlay), nullptr);
              lv_anim_del(id(volume_overlay), nullptr);
              lv_obj_set_style_opa(id(global_volume_overlay), LV_OPA_COVER, 0);
              lv_obj_set_style_opa(id(volume_overlay), LV_OPA_COVER, 0);
              lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN);
          - script.execute: ui_quiesce_player_direct_regions
          - script.wait: ui_quiesce_player_direct_regions
        on_close:
          - lvgl.widget.hide:
              - global_volume_overlay
              - volume_overlay
              - queue_panel
              - speaker_group_panel
        on_close_cancelled:
          - lambda: |-
              lvgl_esphome_direct_regions_pause(false, 0);
              id(album_art_background).set_sendspin_paused(false);
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - script.execute: media_update_main_control
          - script.execute: media_title_marquee_reset_and_start
          - script.execute: media_resume_artwork_after_player_open
        on_closed:
          - globals.set:
              id: ui_active_app
              value: '0'
          - lambda: 'id(home_weather_presenter).resume_after_application(id(ui_page) == 1);'
          - script.execute: ui_refresh_global_status_icons
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - lambda: |-
              // Preserve the current cover but return the idle crossfade
              // destination. Pending/leased generations remain protected by
              // the component's ownership checks.
              id(album_art_background).release_unused_decode_capacity();
              ESP_LOGI("ui.memory", "Player idle decode capacity released psram=%uK/%uK",
                       (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                       (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
      - id: settings_application
        page: settings_page
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.execute: ui_clear_interaction_press
          - script.wait: ui_clear_interaction_press
          - script.execute: ui_cancel_accent_picker
          - script.stop: ui_refresh_tile_snapshots
          - lambda: 'lvgl_esphome_snapshot_set_status_icons_visible(true);'
          - lambda: 'id(home_weather_presenter).release_for_application();'
          - script.execute: ui_quiesce_player_direct_regions
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              // Settings borrows Gallery's idle contiguous JPEG destination.
              // Allocate it now, while the page transition has already
              // quiesced the direct renderers. It is kept alive for the whole
              // Settings session and returned on close.
              id(immich_photo_image).release(true, true);
              const size_t settings_snapshot_capacity =
                  lvgl_esphome_snapshot_scroll_required_bytes(id(settings_root));
              const bool pool_ready = id(immich_photo_image).reserve_decode_buffer_capacity(
                  settings_snapshot_capacity);
              size_t loan_capacity = 0;
              uint8_t *loan = id(immich_photo_image).loan_decode_buffer_capacity(
                  settings_snapshot_capacity, &loan_capacity);
              const bool attached = loan != nullptr &&
                  lvgl_esphome_snapshot_scroll_set_external_buffer(loan, loan_capacity);
              if (!attached && loan != nullptr)
                id(immich_photo_image).return_decode_buffer_capacity(loan, loan_capacity);
              ESP_LOGI("ui.memory", "Gallery pool loaned to Settings pool=%s attached=%s bytes=%u required=%u psram=%uK/%uK",
                       YESNO(pool_ready), YESNO(attached), (unsigned) loan_capacity,
                       (unsigned) settings_snapshot_capacity,
                       (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                       (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
        on_opened:
          - script.execute: ui_prepare_settings_page
          - script.wait: ui_prepare_settings_page
          # Create the resident list snapshot after the final control state is
          # applied. `refresh` only works after a snapshot already exists and
          # therefore left the first Settings open with a black/non-scrollable
          # surface.
          - lvgl.snapshot_scroll.prepare: settings_scroll_snapshot
          - globals.set:
              id: ui_active_app
              value: '2'
          - script.execute: ui_refresh_global_status_icons
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: 'lv_obj_move_foreground(id(app_close_gesture_zone));'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - script.execute: ui_quiesce_player_direct_regions
          # A colour change may still be waiting for the Settings application
          # to release its scroll snapshot.  The close compositor samples the
          # retained Home page immediately after this callback, so refresh the
          # current Home source now that the Settings snapshot is no longer
          # needed.  The full four-page rebuild is resumed after the close.
          - if:
              condition:
                lambda: 'return id(ui_accent_home_refresh_pending);'
              then:
                - script.stop: ui_refresh_accent_snapshots
                - lvgl.snapshot_scroll.release: settings_scroll_snapshot
                - lambda: |-
                    lv_obj_t *home = nullptr;
                    switch (id(ui_home_page)) {
                      case 2: home = id(controls_root_2); break;
                      case 3: home = id(controls_root_3); break;
                      case 4: home = id(controls_root_4); break;
                      default: home = id(controls_root_1); break;
                    }
                    auto *display = home == nullptr ? nullptr : lv_obj_get_display(home);
                    const int width = display == nullptr ? 0 : lv_display_get_horizontal_resolution(display);
                    const bool refreshed = home != nullptr && width > 0 &&
                        lvgl_esphome_snapshot_refresh_tile_page(home, width);
                    ESP_LOGI("snapshot.refresh", "Settings close Home source page=%d refreshed=%s",
                             id(ui_home_page), YESNO(refreshed));
        on_close_cancelled:
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
        on_closed:
          - script.execute: ui_cancel_accent_picker
          - lvgl.snapshot_scroll.release: settings_scroll_snapshot
          - lambda: |-
              size_t returned_capacity = 0;
              uint8_t *returned =
                  lvgl_esphome_snapshot_scroll_take_external_buffer(&returned_capacity);
              const bool gallery_buffer_ready = returned != nullptr &&
                  id(immich_photo_image).return_decode_buffer_capacity(returned, returned_capacity);
              // The shared buffer is needed only while Settings owns the
              // scroll surface. Do not leave its ~2 MB allocation parked as a
              // Gallery spare after the handoff; Gallery reserves it again on
              // the next open, when it is actually needed.
              id(immich_photo_image).release_unused_decode_capacity();
              ESP_LOGI("ui.memory", "Settings returned shared Gallery pool=%s bytes=%u psram=%uK/%uK",
                       YESNO(gallery_buffer_ready), (unsigned) returned_capacity,
                       (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                       (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          - globals.set:
              id: ui_active_app
              value: '0'
          - lambda: 'id(home_weather_presenter).resume_after_application(id(ui_page) == 1);'
          - script.execute: ui_refresh_global_status_icons
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          # Finish the deferred all-page rebuild after the close transition has
          # committed.  Its current-page source was refreshed above so the
          # animation itself already uses the new accent.
          - if:
              condition:
                lambda: 'return id(ui_accent_home_refresh_pending);'
              then:
                - script.execute: ui_refresh_accent_snapshots
      - id: voice_application
        page: controls_page
        widget: voice_assistant_overlay
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.execute: ui_clear_interaction_press
          - script.wait: ui_clear_interaction_press
          - script.stop: ui_refresh_tile_snapshots
          - lambda: 'lvgl_esphome_snapshot_set_status_icons_visible(false);'
          - script.stop: media_title_marquee_start_delayed
          - script.stop: media_title_marquee_reset_and_start
          - lambda: 'id(home_weather_presenter).release_for_application();'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              id(voice_assistant_stop_requested) = false;
              id(voice_assistant_realtime_idle_pending) = false;
              id(voice_assistant_terminal_close_pending) = false;
              id(ui_touch_click_block_until_ms) = millis() + 800;
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.layers", "regional compositor drain timed out before Voice handoff");
              }
              id(media_wavy_progress).set_direct_present(false);
              id(media_title_marquee).end(true);
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '3'
          - script.execute: ui_refresh_global_status_icons
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: |-
              lv_obj_move_foreground(id(app_close_gesture_zone));
              lv_obj_move_foreground(id(voice_assistant_overlay));
              if (id(perf_overlay_label) != nullptr && id(settings_perf_overlay_switch).state) {
                lv_obj_move_foreground(id(perf_overlay_label));
              }
              lvgl_esphome_direct_regions_pause(false, 0);
          - script.execute: voice_assistant_start_from_ui
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.close", "regional compositor drain timed out before Voice close");
              }
        on_close:
          - script.execute: voice_assistant_stop_from_ui
        on_close_cancelled:
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
        on_closed:
          - globals.set:
              id: ui_active_app
              value: '0'
          - lambda: 'id(home_weather_presenter).resume_after_application(id(ui_page) == 1);'
          - script.execute: ui_refresh_global_status_icons
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - script.execute: voice_assistant_restore_display_after_close
          - script.execute: voice_assistant_restore_previous_application
      - id: immich_application
        page: immich_page
        widget: immich_root
        transition_snapshot:
          open: black
          close: live
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.execute: ui_clear_interaction_press
          - script.wait: ui_clear_interaction_press
          - script.stop: ui_refresh_tile_snapshots
          - lambda: 'lvgl_esphome_snapshot_set_status_icons_visible(false);'
          - lambda: 'id(home_weather_presenter).release_for_application();'
          - lambda: 'id(immich_closing) = false;'
          - script.execute: ui_quiesce_player_direct_regions
          - script.wait: ui_quiesce_player_direct_regions
          # JPEG SOF determines the full-resolution source size. An 800x800
          # spare cannot hold it and fragments the only large free block.
          - lambda: 'id(immich_photo_image).release_unused_decode_capacity();'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
        on_before_reveal:
          - script.execute: ui_prepare_immich_page
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '4'
          - script.execute: ui_refresh_global_status_icons
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: |-
              lv_obj_update_layout(id(immich_root));
              lv_obj_move_foreground(id(app_close_gesture_zone));
          - delay: 20ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - script.execute: immich_opened
        on_prepare_close:
          - lambda: 'id(immich_closing) = true;'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.close", "regional compositor drain timed out before Immich close");
              }
              id(immich_slideshow).pause_for_snapshot();
        on_close:
          # The compositor has captured the closing frame, so the photo
          # presenter may now complete its DSI handoff before animation starts.
          - lambda: 'id(immich_slideshow).complete_snapshot_handoff();'
        on_close_cancelled:
          - lambda: |-
              id(immich_closing) = false;
              lvgl_esphome_direct_regions_pause(false, 0);
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
        on_closed:
          - script.execute: immich_closed
          - globals.set:
              id: ui_active_app
              value: '0'
          - lambda: 'id(home_weather_presenter).resume_after_application(id(ui_page) == 1);'
          - script.execute: ui_refresh_global_status_icons
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
      - id: camera_application
        page: camera_page
        widget: camera_root
        transition_snapshot:
          open: black
          close: live
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.execute: ui_clear_interaction_press
          - script.wait: ui_clear_interaction_press
          - script.stop: ui_refresh_tile_snapshots
          - lambda: 'lvgl_esphome_snapshot_set_status_icons_visible(false);'
          - lambda: 'id(home_weather_presenter).release_for_application();'
          - script.execute: ui_quiesce_player_direct_regions
          - script.wait: ui_quiesce_player_direct_regions
          - globals.set:
              id: global_volume_activation_suppressed
              value: 'true'
          - lvgl.widget.hide: global_volume_activation_surface
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
        on_before_reveal:
          - script.execute: ui_prepare_camera_page
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '5'
          - script.execute: ui_refresh_global_status_icons
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: 'lv_obj_move_foreground(id(app_close_gesture_zone));'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - script.execute: camera_opened
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.close", "regional compositor drain timed out before Camera close");
              }
          - lvgl_image_presenter.pause_for_snapshot: camera_stream_presenter
        on_close:
          - lvgl_image_presenter.complete_snapshot_handoff: camera_stream_presenter
          - network_camera.stop: camera_stream_image
        on_close_cancelled:
          - lvgl_image_presenter.resume: camera_stream_presenter
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
        on_closed:
          - script.execute: camera_closed
          - globals.set:
              id: ui_active_app
              value: '0'
          - lambda: 'id(home_weather_presenter).resume_after_application(id(ui_page) == 1);'
          - script.execute: ui_refresh_global_status_icons
          - globals.set:
              id: global_volume_activation_suppressed
              value: 'false'
          - lvgl.widget.show: global_volume_activation_surface
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
  snapshot_compositor:
    id: ui_snapshot_store
    backend: direct
    preload: false
    compression: none
    # Entry records are lightweight metadata. Full-screen pixel storage is
    # still allocated on demand and bounded by decoded_slots.
    max_entries: 5
    decoded_slots: 1
    settle_duration: 380ms
    application_transitions:
      open_duration: 500ms
      close_duration: 500ms
      start_size: 1%
      close_target_x: 50%
      close_target_y: 75%
    scroll_regions:
      - id: settings_scroll_snapshot
        application: settings_application
        widget: settings_root
        backend: direct
        # The application lifecycle performs one deterministic capture after
        # applying state. Automatic screen-load preload raced that capture and
        # transferred the same multi-megabyte bitmap twice.
        preload: false
        max_content_size: 8MB
        overscroll: 15%
        momentum_duration: 560ms
        bounce_duration: 320ms
        max_inertia_duration: 900ms
        # Capture on the first vertical pixel; a stationary touch is replayed as a tap.
        swipe_start_distance: 0
        axis_bias: 1
  default_font: roboto_14
  text_font: roboto_24
  top_layer:
    widgets:
      - label:
          id: perf_overlay_label
          text: "FPS --  CPU --%"
          align: BOTTOM_MID
          y: -24
          width: 520
          text_align: CENTER
          text_color: 0xF2F2F2
          bg_color: 0x303030
          bg_opa: 100%
          radius: 20
          pad_left: 10
          pad_right: 10
          text_font: roboto_16
          hidden: true
      # Bottom-edge system gesture catcher. It prevents widgets underneath from
      # receiving a press when the user starts the app-close swipe.
      - obj:
          id: app_close_gesture_zone
          x: 0
          y: 750
          width: 800
          height: 50
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
      - obj:
          id: ui_touch_blocker
          x: 0
          y: 0
          width: 800
          height: 800
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
      - obj:
          id: boot_overlay
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
          bg_opa: 100%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          widgets:
            - obj:
                id: boot_esphome_logo
                width: 240
                height: 305
                align: CENTER
                y: -64
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                widgets:
                  - image:
                      id: boot_esphome_house
                      x: 0
                      y: 0
                      width: 240
                      height: 240
                      src: boot_esphome_house_asset
                  - lottie:
                      id: boot_esphome_animation
                      file: "assets/animations/ESPHome_line.json"
                      x: 68
                      y: 72
                      width: 104
                      height: 148
                      bg_color: 0x000000
                      bg_opa: 0%
                      # The trace is fully contained by the blue house asset.
                      # Flattening it to that same color keeps boot on the
                      # direct XRGB/PPA path instead of waiting for a native
                      # LVGL canvas publication on every frame.
                      opaque_background: 0x18BCF2
                      border_width: 0
                      radius: 0
                      pad_all: 0
