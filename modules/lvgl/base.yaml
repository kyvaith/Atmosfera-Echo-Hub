# Static portions of the ESPHome boot mark stay outside Lottie. Only the
# animated white trace is rasterized for every frame.
image:
  - platform: file
    file: "assets/images/esphome_house.svg"
    id: boot_esphome_house_asset
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "assets/images/esphome_wordmark.svg"
    id: boot_esphome_wordmark_asset
    type: RGB
    transparency: alpha_channel

# LVGL renderer configuration.
# Page definitions are split into modules/lvgl/pages so the renderer settings stay easy to scan.
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  update_interval: 10ms
  # Keep LVGL on full/direct rendering. The partial framebuffer compositor was
  # faster in a few synthetic paths, but on this RGB888 MIPI DSI panel it caused
  # persistent horizontal artifacts with artwork and assistant screens.
  buffer_size: 100%
  draw_rounding: 32
  direct_mode: true
  full_refresh: true
  byte_order: little_endian
  bg_color: 0x000000
  fps_benchmark: true
  # We expose FPS/CPU through our own settings-controlled HUD; keep LVGL's
  # native sysmon disabled so it does not add another always-on overlay/timer.
  perf_monitor: false
  color_depth: 32
  use_ppa: true
  use_ppa_draw: true
  use_ppa_blend: true
  use_ppa_img: true
  profiler: false
  # Route Home gestures through the LVGL input driver. The direct compositor
  # keeps the current JPEG-backed previous/current/next window, while LVGL
  # owns tap cancellation and pressed-state dispatch.
  navigation:
    id: ui_navigation
    home:
      page: controls_page
      widgets:
        - controls_root_1
        - controls_root_2
        - controls_root_3
        - controls_root_4
      indicators:
        - page_indicator_1
        - page_indicator_2
        - page_indicator_3
        - page_indicator_4
    blockers:
      - boot_overlay
      - voice_assistant_overlay
      - global_volume_overlay
      - ui_touch_blocker
    swipe_start_distance: 10
    axis_bias: 8
    home_commit_threshold: 25%
    on_home_changed:
      - globals.set:
          id: ui_page
          value: !lambda 'return page;'
      - globals.set:
          id: ui_home_page
          value: !lambda 'return page;'
  snapshot_compositor:
    id: ui_snapshot_store
    backend: direct
    preload: false
    compression: none
    max_entries: 1
    decoded_slots: 1
    settle_duration: 380ms
  default_font: roboto_14
  text_font: roboto_24
  top_layer:
    widgets:
      - label:
          id: perf_overlay_label
          text: "FPS --  CPU --%"
          align: BOTTOM_MID
          y: -24
          width: 520
          text_align: CENTER
          text_color: 0xF2F2F2
          bg_color: 0x303030
          bg_opa: 100%
          radius: 20
          pad_left: 10
          pad_right: 10
          text_font: roboto_16
          hidden: true
      # Bottom-edge system gesture catcher. It prevents widgets underneath from
      # receiving a press when the user starts the app-close swipe.
      - obj:
          id: app_close_gesture_zone
          x: 0
          y: 750
          width: 800
          height: 50
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
      - obj:
          id: ui_touch_blocker
          x: 0
          y: 0
          width: 800
          height: 800
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
      - obj:
          id: boot_overlay
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
          bg_opa: 100%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          widgets:
            - obj:
                id: boot_esphome_logo
                width: 240
                height: 305
                align: CENTER
                y: -64
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                widgets:
                  - image:
                      id: boot_esphome_house
                      x: 0
                      y: 0
                      width: 240
                      height: 240
                      src: boot_esphome_house_asset
                  - lottie:
                      id: boot_esphome_animation
                      file: "assets/animations/ESPHome_line.json"
                      x: 68
                      y: 72
                      width: 104
                      height: 148
                      opaque_background: 0x18BCF2
                      loop: false
                      auto_start: false
                      hidden: true
                  - image:
                      id: boot_esphome_wordmark
                      x: 0
                      y: 264
                      width: 240
                      height: 41
                      src: boot_esphome_wordmark_asset
                      opa: 0%
            - label:
                text: "Atmosfera Echo Hub"
                align: CENTER
                y: 198
                width: 480
                text_align: CENTER
                text_color: 0xF2F2F2
                text_font: roboto_24
  on_idle:
    timeout: !lambda |-
      const float timeout_s = id(settings_display_timeout).state;
      if (timeout_s <= 0.0f) {
        return 0xFFFFFFFFUL;
      }
      return (uint32_t) (timeout_s * 1000.0f);
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_sequence_done);'
              - light.is_on: display_backlight
          then:
            - lambda: |-
                ESP_LOGW("backlight.diag", "idle off uptime=%lums",
                         (unsigned long) millis());
            - output.ledc.set_next_fade_duration:
                id: backlight_output
                duration: 3600ms
            - light.turn_off:
                id: display_backlight
                transition_length: 0ms
