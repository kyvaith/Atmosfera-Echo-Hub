# Static portions of the ESPHome boot mark stay outside Lottie. Only the
# animated white trace is rasterized for every frame.
image:
  - platform: file
    file: "assets/images/esphome_house.svg"
    id: boot_esphome_house_asset
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: "assets/images/esphome_wordmark.svg"
    id: boot_esphome_wordmark_asset
    type: RGB
    transparency: alpha_channel

# LVGL renderer configuration.
# Page definitions are split into modules/lvgl/pages so the renderer settings stay easy to scan.
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  update_interval: 10ms
  # Keep LVGL on full/direct rendering. The partial framebuffer compositor was
  # faster in a few synthetic paths, but on this RGB888 MIPI DSI panel it caused
  # persistent horizontal artifacts with artwork and assistant screens.
  buffer_size: 100%
  draw_rounding: 32
  direct_mode: true
  full_refresh: true
  byte_order: little_endian
  bg_color: 0x000000
  fps_benchmark: true
  # We expose FPS/CPU through our own settings-controlled HUD; keep LVGL's
  # native sysmon disabled so it does not add another always-on overlay/timer.
  perf_monitor: false
  color_depth: 32
  use_ppa: true
  use_ppa_draw: true
  use_ppa_blend: true
  use_ppa_img: true
  profiler: false
  # Route Home gestures through the LVGL input driver. The direct compositor
  # keeps the current JPEG-backed previous/current/next window, while LVGL
  # owns tap cancellation and pressed-state dispatch.
  navigation:
    id: ui_navigation
    home:
      page: controls_page
      widgets:
        - controls_root_1
        - controls_root_2
        - controls_root_3
        - controls_root_4
      indicators:
        - page_indicator_1
        - page_indicator_2
        - page_indicator_3
        - page_indicator_4
    blockers:
      - boot_overlay
      - voice_assistant_overlay
      - global_volume_overlay
      - ui_touch_blocker
    close_edge_size: 50
    close_commit_threshold: 10
    swipe_start_distance: 10
    axis_bias: 8
    home_commit_threshold: 25%
    on_home_changed:
      - globals.set:
          id: ui_page
          value: !lambda 'return page;'
      - globals.set:
          id: ui_home_page
          value: !lambda 'return page;'
    applications:
      - id: player_application
        page: music_page
        widget: wear_root
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.stop: ui_refresh_tile_snapshots
          - script.stop: volume_overlay_timeout
          - script.stop: open_speaker_group_panel
          - script.stop: update_speaker_group_panel
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
              id(media_speaker_panel_open) = false;
              id(global_volume_time_press_tracking) = false;
              id(global_volume_dragging) = false;
              id(global_volume_renderer).end();
              lv_anim_del(id(global_volume_overlay), nullptr);
              lv_anim_del(id(volume_overlay), nullptr);
              lv_obj_set_style_opa(id(global_volume_overlay), LV_OPA_COVER, 0);
              lv_obj_set_style_opa(id(volume_overlay), LV_OPA_COVER, 0);
              lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN);
              // The opening snapshot owns the display until on_before_reveal.
              id(media_wavy_progress).set_direct_present(false);
        on_before_reveal:
          # Prepare the live Player while the compositor still presents the
          # final snapshot frame, preventing a one-frame placeholder flash.
          - script.execute: ui_prepare_player_page
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '1'
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: 'lv_obj_move_foreground(id(app_close_gesture_zone));'
          - delay: 40ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - script.execute: media_update_main_control
          - script.execute: media_resume_artwork_after_player_open
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - script.stop: volume_overlay_timeout
          - script.stop: open_speaker_group_panel
          - script.stop: update_speaker_group_panel
          - lambda: |-
              id(media_speaker_panel_open) = false;
              id(global_volume_time_press_tracking) = false;
              id(global_volume_dragging) = false;
              id(global_volume_renderer).end();
              lv_anim_del(id(global_volume_overlay), nullptr);
              lv_anim_del(id(volume_overlay), nullptr);
              lv_obj_set_style_opa(id(global_volume_overlay), LV_OPA_COVER, 0);
              lv_obj_set_style_opa(id(volume_overlay), LV_OPA_COVER, 0);
              lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN);
          - script.execute: ui_quiesce_player_direct_regions
        on_close:
          - lambda: 'id(album_art_background).set_sendspin_paused(true);'
          - lvgl.widget.hide:
              - global_volume_overlay
              - volume_overlay
              - queue_panel
              - speaker_group_panel
        on_close_cancelled:
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - script.execute: media_update_main_control
          - script.execute: media_title_marquee_reset_and_start
        on_closed:
          - globals.set:
              id: ui_active_app
              value: '0'
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
      - id: settings_application
        page: settings_page
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.stop: ui_refresh_tile_snapshots
          - script.execute: ui_quiesce_player_direct_regions
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
        on_opened:
          - script.execute: ui_prepare_settings_page
          - globals.set:
              id: ui_active_app
              value: '2'
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: 'lv_obj_move_foreground(id(app_close_gesture_zone));'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - script.execute: ui_quiesce_player_direct_regions
        on_closed:
          - globals.set:
              id: ui_active_app
              value: '0'
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
      - id: voice_application
        page: controls_page
        widget: voice_assistant_overlay
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.stop: ui_refresh_tile_snapshots
          - script.stop: media_title_marquee_start_delayed
          - script.stop: media_title_marquee_reset_and_start
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              id(ui_touch_click_block_until_ms) = millis() + 800;
              id(media_wavy_progress).set_direct_present(false);
              id(media_title_marquee).end(true);
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.layers", "regional compositor drain timed out before Voice handoff");
              }
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '3'
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: |-
              lv_obj_move_foreground(id(app_close_gesture_zone));
              lv_obj_move_foreground(id(voice_assistant_overlay));
              if (id(perf_overlay_label) != nullptr && id(settings_perf_overlay_switch).state) {
                lv_obj_move_foreground(id(perf_overlay_label));
              }
          - script.execute: voice_assistant_start_from_ui
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.close", "regional compositor drain timed out before Voice close");
              }
        on_close:
          - script.execute: voice_assistant_stop_from_ui
        on_close_cancelled:
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
        on_closed:
          - globals.set:
              id: ui_active_app
              value: '0'
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
      - id: immich_application
        page: immich_page
        widget: immich_root
        close_gesture: true
        close_on_threshold: true
        on_prepare_open:
          - script.stop: ui_refresh_tile_snapshots
          - script.execute: ui_quiesce_player_direct_regions
          - script.wait: ui_quiesce_player_direct_regions
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
              id(ui_touch_click_block_until_ms) = millis() + 800;
        on_before_reveal:
          - script.execute: ui_prepare_immich_page
        on_opened:
          - globals.set:
              id: ui_active_app
              value: '4'
          - lvgl.widget.show: app_close_gesture_zone
          - lambda: |-
              lv_obj_update_layout(id(immich_root));
              lv_obj_move_foreground(id(app_close_gesture_zone));
          - delay: 20ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - script.execute: immich_opened
        on_prepare_close:
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'true'
          - lambda: |-
              if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                ESP_LOGW("ui.close", "regional compositor drain timed out before Immich close");
              }
              id(immich_ken_burns).pause_for_snapshot();
        on_close:
          # The compositor has captured the closing frame, so the photo
          # presenter may now complete its DSI handoff before animation starts.
          - lambda: 'id(immich_ken_burns).complete_snapshot_handoff();'
        on_close_cancelled:
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
        on_closed:
          - script.execute: immich_closed
          - globals.set:
              id: ui_active_app
              value: '0'
          - script.execute: voice_assistant_update_overlay
          - lvgl.widget.hide: app_close_gesture_zone
          - lvgl.widget.hide: ui_touch_blocker
          - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
          - delay: 100ms
          - globals.set:
              id: ui_snapshot_io_busy
              value: 'false'
  snapshot_compositor:
    id: ui_snapshot_store
    backend: direct
    preload: false
    compression: none
    # Entry records are lightweight metadata. Full-screen pixel storage is
    # still allocated on demand and bounded by decoded_slots.
    max_entries: 4
    decoded_slots: 1
    settle_duration: 380ms
    application_transitions:
      open_duration: 500ms
      close_duration: 500ms
      start_size: 1%
      close_target_x: 50%
      close_target_y: 75%
    scroll_regions:
      - id: settings_scroll_snapshot
        application: settings_application
        widget: settings_root
        backend: direct
        preload: true
        max_content_size: 8MB
        overscroll: 15%
        momentum_duration: 560ms
        bounce_duration: 320ms
        max_inertia_duration: 900ms
        swipe_start_distance: 2
        axis_bias: 6
  default_font: roboto_14
  text_font: roboto_24
  top_layer:
    widgets:
      - label:
          id: perf_overlay_label
          text: "FPS --  CPU --%"
          align: BOTTOM_MID
          y: -24
          width: 520
          text_align: CENTER
          text_color: 0xF2F2F2
          bg_color: 0x303030
          bg_opa: 100%
          radius: 20
          pad_left: 10
          pad_right: 10
          text_font: roboto_16
          hidden: true
      # Bottom-edge system gesture catcher. It prevents widgets underneath from
      # receiving a press when the user starts the app-close swipe.
      - obj:
          id: app_close_gesture_zone
          x: 0
          y: 750
          width: 800
          height: 50
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
      - obj:
          id: ui_touch_blocker
          x: 0
          y: 0
          width: 800
          height: 800
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
      - obj:
          id: boot_overlay
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
          bg_opa: 100%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          widgets:
            - obj:
                id: boot_esphome_logo
                width: 240
                height: 305
                align: CENTER
                y: -64
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                widgets:
                  - image:
                      id: boot_esphome_house
                      x: 0
                      y: 0
                      width: 240
                      height: 240
                      src: boot_esphome_house_asset
                  - lottie:
                      id: boot_esphome_animation
                      file: "assets/animations/ESPHome_line.json"
                      x: 68
                      y: 72
                      width: 104
                      height: 148
                      opaque_background: 0x18BCF2
                      loop: false
                      auto_start: false
                      hidden: true
                  - image:
                      id: boot_esphome_wordmark
                      x: 0
                      y: 264
                      width: 240
                      height: 41
                      src: boot_esphome_wordmark_asset
                      opa: 0%
            - label:
                text: "Atmosfera Echo Hub"
                align: CENTER
                y: 198
                width: 480
                text_align: CENTER
                text_color: 0xF2F2F2
                text_font: roboto_24
  on_idle:
    timeout: !lambda |-
      const float timeout_s = id(settings_display_timeout).state;
      if (timeout_s <= 0.0f) {
        return 0xFFFFFFFFUL;
      }
      return (uint32_t) (timeout_s * 1000.0f);
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(boot_sequence_done);'
              - light.is_on: display_backlight
          then:
            - lambda: |-
                ESP_LOGW("backlight.diag", "idle off uptime=%lums",
                         (unsigned long) millis());
            - output.ledc.set_next_fade_duration:
                id: backlight_output
                duration: 3600ms
            - light.turn_off:
                id: display_backlight
                transition_length: 0ms
