# Navigation state and screen-level actions.
# Tile pages, music view and settings view share this small state machine.
globals:
  - id: ui_page
    type: int
    restore_value: no
    initial_value: '1'
  # Application registry. Home/tile pages keep using ui_page=1..4; every
  # fullscreen program is tracked here so launch/close gestures stay generic.
  - id: ui_home_page
    type: int
    restore_value: no
    initial_value: '1'
  - id: ui_active_app
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_tile_snapshots_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ui_tile_snapshot_prepared_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_tile_snapshot_cached_first
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_tile_snapshot_cached_last
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_snapshot_io_busy
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ui_touch_click_block_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: app_close_tracking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: app_close_dragging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: app_close_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: app_close_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: app_close_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: app_close_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: app_close_last_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_tracking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tile_swipe_dragging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tile_swipe_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_next_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_next_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_commit_latched
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tile_swipe_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_last_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: tile_swipe_last_render_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_tracking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: settings_scroll_dragging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: settings_scroll_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_start_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_last_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_start_scroll_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_last_render_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_last_sample_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_last_sample_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: settings_scroll_velocity_px_s
    type: int
    restore_value: no
    initial_value: '0'
interval:
  - interval: 25ms
    then:
      - if:
          condition:
            lambda: 'return id(app_close_requested);'
          then:
            - globals.set:
                id: app_close_requested
                value: 'false'
            - script.execute: ui_close_app

script:
  - id: ui_quiesce_player_direct_regions
    mode: restart
    then:
      - script.stop: media_title_marquee_start_delayed
      - script.stop: media_title_marquee_reset_and_start
      - lambda: |-
          atmosfera_ui::media_wavy_arc_set_direct_present(false);
          atmosfera_ui::title_marquee_direct_end(true);
          if (!lvgl_esphome_direct_regions_pause(true, 150)) {
            ESP_LOGW("ui.layers", "regional compositor drain timed out before app handoff");
          }

  - id: ui_touch_block_for_drag
    mode: restart
    then:
      - lambda: |-
          id(ui_touch_click_block_until_ms) = millis() + 700;
          lv_obj_clear_flag(id(ui_touch_blocker), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(ui_touch_blocker));
          lv_indev_reset(nullptr, nullptr);

  - id: ui_release_touch_blocker
    mode: restart
    then:
      - lambda: |-
          id(ui_touch_click_block_until_ms) = millis() + 700;
          lv_indev_reset(nullptr, nullptr);
      - delay: 220ms
      - lambda: |-
          lv_indev_reset(nullptr, nullptr);
      - lvgl.widget.hide: ui_touch_blocker

  - id: ui_disable_settings_rows_for_drag
    mode: restart
    then:
      - lambda: |-
          auto clear_state_tree = [](lv_obj_t *obj) {
            if (obj == nullptr) return;
            lv_obj_clear_state(obj, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
            const uint32_t child_count = lv_obj_get_child_count(obj);
            for (uint32_t i = 0; i < child_count; i++) {
              lv_obj_t *child = lv_obj_get_child(obj, i);
              if (child != nullptr) {
                lv_obj_clear_state(child, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
              }
            }
          };
          lv_obj_t *rows[] = {
            id(settings_true_colour_button),
            id(settings_screen_tone_button),
            id(settings_perf_overlay_button),
            id(settings_system_logs_button),
            id(settings_perf_logs_button),
            id(settings_swipe_logs_button),
            id(settings_beta_firmware_button),
            id(settings_display_brightness_button),
            id(settings_display_timeout_button),
            id(settings_voice_mute_button),
            id(settings_wake_sound_button),
            id(settings_wake_sensitivity_button),
          };
          for (auto *row : rows) {
            if (row == nullptr) continue;
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICK_FOCUSABLE);
            clear_state_tree(row);
          }

  - id: ui_restore_settings_rows_after_drag
    mode: restart
    then:
      - delay: 20ms
      - lambda: |-
          auto clear_state_tree = [](lv_obj_t *obj) {
            if (obj == nullptr) return;
            lv_obj_clear_state(obj, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
            const uint32_t child_count = lv_obj_get_child_count(obj);
            for (uint32_t i = 0; i < child_count; i++) {
              lv_obj_t *child = lv_obj_get_child(obj, i);
              if (child != nullptr) {
                lv_obj_clear_state(child, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
              }
            }
          };
          lv_obj_t *rows[] = {
            id(settings_true_colour_button),
            id(settings_screen_tone_button),
            id(settings_perf_overlay_button),
            id(settings_system_logs_button),
            id(settings_perf_logs_button),
            id(settings_swipe_logs_button),
            id(settings_beta_firmware_button),
            id(settings_display_brightness_button),
            id(settings_display_timeout_button),
            id(settings_voice_mute_button),
            id(settings_wake_sound_button),
            id(settings_wake_sensitivity_button),
          };
          for (auto *row : rows) {
            if (row == nullptr) continue;
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICK_FOCUSABLE);
            clear_state_tree(row);
          }
          lv_indev_reset(nullptr, nullptr);
          for (auto *row : rows) {
            if (row == nullptr) continue;
            clear_state_tree(row);
          }

  - id: ui_prepare_settings_rows_for_touch
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *rows[] = {
            id(settings_true_colour_button),
            id(settings_screen_tone_button),
            id(settings_perf_overlay_button),
            id(settings_system_logs_button),
            id(settings_perf_logs_button),
            id(settings_swipe_logs_button),
            id(settings_beta_firmware_button),
            id(settings_display_brightness_button),
            id(settings_display_timeout_button),
            id(settings_voice_mute_button),
            id(settings_wake_sound_button),
            id(settings_wake_sensitivity_button),
          };
          for (auto *row : rows) {
            if (row == nullptr) continue;
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICK_FOCUSABLE);
            lv_obj_clear_state(row, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
          }
      - script.execute: ui_prepare_immediate_pressed_feedback

  - id: ui_prepare_immediate_pressed_feedback
    mode: single
    then:
      - lambda: |-
          static lv_style_t pressed_style;
          static bool initialized = false;
          if (!initialized) {
            lv_style_init(&pressed_style);
            lv_style_set_bg_opa(&pressed_style, 178);
            initialized = true;
          }
          lv_obj_t *buttons[] = {
            id(settings_true_colour_button), id(settings_screen_tone_button),
            id(settings_perf_overlay_button), id(settings_system_logs_button),
            id(settings_perf_logs_button), id(settings_swipe_logs_button),
            id(settings_beta_firmware_button), id(settings_display_brightness_button),
            id(settings_display_timeout_button), id(settings_voice_mute_button),
            id(settings_wake_sound_button), id(settings_wake_sensitivity_button),
            id(tile_light_button), id(tile_switch_button), id(tile_scene_button),
            id(tile_trigger_button), id(tile_climate_button), id(tile_cover_button),
            id(tile_garage_button), id(tile_lock_button), id(tile_alarm_button),
            id(tile_door_window_button), id(tile_presence_button), id(tile_sensor_button),
            id(tile_weather_button), id(tile_clock_button), id(tile_world_clock_button),
            id(tile_media_button), id(tile_subpage_button), id(tile_fan_button),
            id(tile_fan_speed_button), id(tile_webhook_button), id(tile_internal_button),
            id(tile_settings_button), id(tile_voice_button),
          };
          for (auto *button : buttons) {
            if (button != nullptr) {
              lv_obj_add_style(button, &pressed_style, LV_PART_MAIN | LV_STATE_PRESSED);
            }
          }

  - id: ui_disable_home_tiles_for_drag
    mode: restart
    then:
      - lambda: |-
          // Tile buttons are made permanently non-clickable once at boot and
          // taps are dispatched manually on release. Only the native slider
          // needs changing in the latency-sensitive drag path.
          lv_obj_remove_flag(id(light_brightness_slider), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_clear_state(id(light_brightness_slider),
                             static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));

  # Home tile taps are dispatched manually on touch release, just like the
  # settings rows. Keep LVGL from entering PRESSED while a horizontal gesture
  # is still undecided; the brightness slider remains native and interactive.
  - id: ui_prepare_home_tiles_for_touch
    mode: restart
    then:
      - lambda: |-
          auto clear_state_tree = [](lv_obj_t *obj) {
            if (obj == nullptr) return;
            lv_obj_clear_state(obj, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
            const uint32_t child_count = lv_obj_get_child_count(obj);
            for (uint32_t i = 0; i < child_count; i++) {
              lv_obj_t *child = lv_obj_get_child(obj, i);
              if (child != nullptr) {
                lv_obj_clear_state(child, static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
              }
            }
          };
          lv_obj_t *buttons[] = {
            id(tile_light_button), id(tile_switch_button), id(tile_scene_button),
            id(tile_trigger_button), id(tile_climate_button), id(tile_cover_button),
            id(tile_garage_button), id(tile_lock_button), id(tile_alarm_button),
            id(tile_door_window_button), id(tile_presence_button), id(tile_sensor_button),
            id(tile_weather_button), id(tile_clock_button), id(tile_world_clock_button),
            id(tile_media_button), id(tile_subpage_button), id(tile_fan_button),
            id(tile_fan_speed_button), id(tile_webhook_button), id(tile_internal_button),
            id(tile_settings_button), id(tile_voice_button),
          };
          for (auto *button : buttons) {
            if (button == nullptr) continue;
            lv_obj_remove_flag(button, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_remove_flag(button, LV_OBJ_FLAG_CLICK_FOCUSABLE);
            clear_state_tree(button);
          }

  - id: ui_restore_home_tiles_after_drag
    mode: restart
    then:
      - delay: 450ms
      - lambda: |-
          lv_obj_clear_state(id(light_brightness_slider),
                             static_cast<lv_state_t>(LV_STATE_PRESSED | LV_STATE_FOCUSED | LV_STATE_HOVERED));
          lv_obj_add_flag(id(light_brightness_slider), LV_OBJ_FLAG_CLICKABLE);

  - id: ui_update_page_indicator
    then:
      - lambda: |-
          lv_obj_t *dots[] = {
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          int page = id(ui_page);
          if (page < 1 || page > 4) page = 1;
          int x = 352;
          for (int i = 0; i < 4; i++) {
            const bool active = (i + 1) == page;
            const int w = active ? 30 : 10;
            lv_obj_set_x(dots[i], x);
            lv_obj_set_width(dots[i], w);
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(active ? 0xF2F2F2 : 0x5C5F5E), 0);
            x += w + 12;
          }
          lvgl_esphome_snapshot_swipe_set_page_indicator(page, 4);

  - id: ui_apply_tile_positions
    then:
      - lambda: |-
          int page = id(ui_page);
          if (page < 1 || page > 4) page = 1;
          lv_obj_t *roots[] = {
            id(controls_root_1),
            id(controls_root_2),
            id(controls_root_3),
            id(controls_root_4),
          };
          for (int i = 0; i < 4; i++) {
            if (roots[i] == nullptr) continue;
            lv_obj_clear_flag(roots[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(roots[i], LV_ALIGN_CENTER, (i + 1 - page) * 800, 0);
          }
      - script.execute: ui_update_page_indicator

  # The direct compositor already lands the committed pair at its exact final
  # coordinates. Repositioning all four LVGL roots before that handoff finishes
  # competes with the next gesture and causes the visible 2 -> 3 pause. Settle
  # the dormant roots only after a short idle window; another swipe restarts
  # this script, so it can never rearrange pages underneath an active frame.
  - id: ui_settle_tile_positions_after_swipe
    mode: restart
    then:
      - delay: 520ms
      - if:
          condition:
            lambda: |-
              return !id(tile_swipe_tracking) && !id(tile_swipe_dragging) &&
                     !lvgl_esphome_snapshot_is_active();
          then:
            - script.execute: ui_apply_tile_positions

  - id: ui_hide_home_content_for_boot
    then:
      - lambda: |-
          lv_obj_t *objects[] = {
            id(controls_root_1),
            id(controls_root_2),
            id(controls_root_3),
            id(controls_root_4),
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          for (auto *obj : objects) {
            if (obj != nullptr) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          }

  - id: ui_show_home_content_after_boot
    then:
      - lambda: |-
          lv_obj_t *indicators[] = {
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          for (auto *obj : indicators) {
            if (obj != nullptr) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          }
          // Snapshot preparation already leaves page 1 aligned and rendered
          // behind the opaque boot overlay. Re-applying all four 800x800 roots
          // here invalidated the screen a second time and starved DSI exactly
          // when the overlay was about to disappear.
          lvgl_esphome_snapshot_swipe_set_page_indicator(id(ui_page), 4);

  - id: ui_reset_tile_roots
    then:
      - script.execute: ui_apply_tile_positions

  - id: ui_set_tile_visibility_1
    then:
      - globals.set:
          id: ui_page
          value: '1'
      - script.execute: ui_apply_tile_positions

  - id: ui_set_tile_visibility_2
    then:
      - globals.set:
          id: ui_page
          value: '2'
      - script.execute: ui_apply_tile_positions

  - id: ui_set_tile_visibility_3
    then:
      - globals.set:
          id: ui_page
          value: '3'
      - script.execute: ui_apply_tile_positions

  - id: ui_set_tile_visibility_4
    then:
      - globals.set:
          id: ui_page
          value: '4'
      - script.execute: ui_apply_tile_positions

  - id: ui_build_tile_snapshots_now
    mode: single
    then:
      - globals.set:
          id: ui_snapshot_io_busy
          value: 'true'
      - globals.set:
          id: ui_tile_snapshots_ready
          value: 'false'
      - globals.set:
          id: ui_tile_snapshot_prepared_page
          value: '0'
      - globals.set:
          id: ui_tile_snapshot_cached_first
          value: '0'
      - globals.set:
          id: ui_tile_snapshot_cached_last
          value: '0'
      # Encode every page while the display is still dark, then keep all four
      # raw home pages. One extra 1.92 MB frame is cheaper than panoramas and
      # removes JPEG decode from uninterrupted multi-page swipe sequences.
      - script.execute: ui_set_tile_visibility_2
      - delay: 80ms
      - lambda: |-
          ESP_LOGW("boot.diag",
                   "tile snapshot cache: begin raw pages internal=%uK/%uK psram=%uK/%uK",
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          lv_obj_t *roots[] = {
            id(controls_root_1),
            id(controls_root_2),
            id(controls_root_3),
            id(controls_root_4),
          };
          lv_obj_t *dots[] = {
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          lvgl_esphome_snapshot_set_clock_font(id(roboto_34)->get_lv_font());
          lv_obj_add_flag(id(global_time_button), LV_OBJ_FLAG_HIDDEN);
          for (auto *dot : dots) {
            if (dot != nullptr) lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
          }
          auto apply_page = [&](int page) {
            id(ui_page) = page;
            for (int i = 0; i < 4; i++) {
              if (roots[i] == nullptr) continue;
              lv_obj_clear_flag(roots[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_align(roots[i], LV_ALIGN_CENTER, (i + 1 - page) * 800, 0);
            }
            int x = 352;
            for (int i = 0; i < 4; i++) {
              if (dots[i] == nullptr) continue;
              const bool active = (i + 1) == page;
              const int w = active ? 30 : 10;
              lv_obj_set_x(dots[i], x);
              lv_obj_set_width(dots[i], w);
              lv_obj_set_style_bg_color(dots[i], lv_color_hex(active ? 0xF2F2F2 : 0x5C5F5E), 0);
              x += w + 12;
            }
            lvgl_esphome_snapshot_swipe_set_page_indicator(page, 4);
            lv_obj_update_layout(lv_obj_get_parent(id(controls_root_1)));
          };
          // Application previews are captured only after the boot Lottie has
          // released its frame cache. Capturing them here produced valid JPEG
          // files from an unstable, memory-starved first render and caused the
          // first app opening after every reboot to show noise.
          const bool apps_prepared = false;
          // Home pages stay decoded for consecutive 60 FPS swipes. Encoding a
          // second JPEG copy here could not retain any page with the Lottie
          // cache resident (pages=0), but still consumed four full-screen
          // captures and four encoder passes during boot.
          const bool compressed_pages_prepared = false;
          // Application previews stay compressed until one app is selected.
          // A single shared full-resolution RGB888 surface is allocated after
          // Lottie releases its frame cache and reused by every transition.
          apply_page(1);
          // The 11 MB Lottie frame cache is still resident here. Decoding raw
          // Home pages now only fragments PSRAM and fails part-way through.
          // ui_finish_boot_tile_snapshot_cache builds all four after Lottie is
          // released, while the opaque boot overlay still covers the display.
          id(ui_tile_snapshots_ready) = false;
          id(ui_tile_snapshot_prepared_page) = 0;
          id(ui_tile_snapshot_cached_first) = 0;
          id(ui_tile_snapshot_cached_last) = 0;
          lv_obj_clear_flag(id(global_time_button), LV_OBJ_FLAG_HIDDEN);
          for (auto *dot : dots) {
            if (dot != nullptr) lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
          }
          ESP_LOGW("boot.diag",
                   "snapshot cache: done pages=%u apps=%u raw_range=%d-%d ready=%u internal=%uK/%uK psram=%uK/%uK",
                   (unsigned) compressed_pages_prepared, (unsigned) apps_prepared,
                   id(ui_tile_snapshot_cached_first), id(ui_tile_snapshot_cached_last), 0U,
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
      - script.execute: ui_set_tile_visibility_1
      - delay: 40ms
      - globals.set:
          id: ui_snapshot_io_busy
          value: 'false'

  - id: ui_refresh_tile_snapshots
    mode: restart
    then:
      # The four home pages normally remain decoded. The delayed repair path is
      # retained only for an allocation failure or explicit cache invalidation.
      - delay: 450ms
      - lambda: |-
          if (id(ui_active_app) != 0 || id(ui_page) < 1 || id(ui_page) > 4) return;
          const int required_first = 1;
          const int required_last = 4;
          if (id(ui_tile_snapshots_ready) &&
              id(ui_tile_snapshot_cached_first) <= required_first &&
              id(ui_tile_snapshot_cached_last) >= required_last) {
            return;
          }
          if (id(ui_snapshot_io_busy)) {
            id(ui_refresh_tile_snapshots).execute();
            return;
          }
          if (lvgl_esphome_snapshot_is_active()) {
            id(ui_tile_snapshots_ready) = false;
            id(ui_tile_snapshot_prepared_page) = 0;
            id(ui_tile_snapshot_cached_first) = 0;
            id(ui_tile_snapshot_cached_last) = 0;
            id(ui_refresh_tile_snapshots).execute();
            return;
          }
          id(ui_snapshot_io_busy) = true;
          static uint32_t boot_snapshot_diag_budget = 4;
          const bool log_boot_snapshot = boot_snapshot_diag_budget > 0;
          if (log_boot_snapshot) {
            boot_snapshot_diag_budget--;
            ESP_LOGW("boot.diag",
                     "tile snapshot window refresh: begin page=%d internal=%uK/%uK psram=%uK/%uK",
                     id(ui_page),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          }
          const bool prepared = lvgl_esphome_snapshot_cache_tile_window(
              id(controls_root_1), id(controls_root_2), id(controls_root_3), id(controls_root_4), id(ui_page), 800);
          id(ui_tile_snapshots_ready) = prepared;
          id(ui_tile_snapshot_prepared_page) = prepared ? id(ui_page) : 0;
          id(ui_tile_snapshot_cached_first) = prepared ? required_first : 0;
          id(ui_tile_snapshot_cached_last) = prepared ? required_last : 0;
          if (log_boot_snapshot || !prepared) {
            ESP_LOGW("boot.diag",
                     "tile snapshot window refresh: done page=%d range=%d-%d prepared=%u internal=%uK/%uK psram=%uK/%uK",
                     id(ui_page), id(ui_tile_snapshot_cached_first), id(ui_tile_snapshot_cached_last),
                     (unsigned) prepared,
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          }
          id(ui_snapshot_io_busy) = false;

  - id: ui_finish_boot_tile_snapshot_cache
    mode: single
    then:
      - lambda: |-
          if (id(ui_snapshot_io_busy)) return;
          id(ui_snapshot_io_busy) = true;
          ESP_LOGW("boot.diag",
                   "post-Lottie app snapshots: begin internal=%uK/%uK psram=%uK/%uK",
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          id(album_art_background).set_sendspin_paused(true);
          atmosfera_ui::media_wavy_arc_set_background(
              id(album_art_placeholder).get_lv_image_dsc(), false);
          atmosfera_ui::media_wavy_arc_init(id(media_main_progress_arc));
          atmosfera_ui::media_wavy_arc_set_value(id(last_media_progress_percent));
          lv_obj_update_layout(lv_screen_active());
          bool apps_prepared = true;
          apps_prepared = lvgl_esphome_snapshot_cache_compressed_page(id(wear_root)) && apps_prepared;
          apps_prepared = lvgl_esphome_snapshot_cache_compressed_page(id(settings_root)) && apps_prepared;
          apps_prepared = lvgl_esphome_snapshot_cache_compressed_page(id(voice_assistant_overlay)) && apps_prepared;
          apps_prepared = lvgl_esphome_snapshot_cache_compressed_page(id(immich_root)) && apps_prepared;
          esphome::esp32_jpeg::release_preallocated_encoder();
          const bool prepared = lvgl_esphome_snapshot_cache_tile_window(
              id(controls_root_1), id(controls_root_2), id(controls_root_3), id(controls_root_4), 1, 800);
          const bool app_work_buffer = lvgl_esphome_snapshot_app_reserve_work_buffer(id(wear_root));
          id(ui_tile_snapshots_ready) = prepared;
          id(ui_tile_snapshot_prepared_page) = prepared ? 1 : 0;
          id(ui_tile_snapshot_cached_first) = prepared ? 1 : 0;
          id(ui_tile_snapshot_cached_last) = prepared ? 4 : 0;
          id(ui_snapshot_io_busy) = false;
          ESP_LOGW("boot.diag",
                   "post-Lottie caches apps=%u app_work=%u home=%u range=%d-%d psram=%uK/%uK",
                   (unsigned) apps_prepared, (unsigned) app_work_buffer, (unsigned) prepared,
                   id(ui_tile_snapshot_cached_first), id(ui_tile_snapshot_cached_last),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));

  - id: ui_show_home_page
    mode: restart
    then:
      - lambda: |-
          int page = id(ui_home_page);
          if (page < 1 || page > 4) page = 1;
          id(ui_page) = page;
          lv_obj_t *roots[] = {
            id(controls_root_1),
            id(controls_root_2),
            id(controls_root_3),
            id(controls_root_4),
          };
          for (int i = 0; i < 4; i++) {
            if (roots[i] == nullptr) continue;
            lv_obj_clear_flag(roots[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(roots[i], LV_ALIGN_CENTER, (i + 1 - page) * 800, 0);
          }
          lv_obj_update_layout(lv_obj_get_parent(id(controls_root_1)));
      - script.execute: ui_update_page_indicator
      - lvgl.page.show:
          id: controls_page
          animation: NONE
          time: 50ms

  - id: ui_open_player_app
    # Opening is a transaction: interrupting it after ui_snapshot_io_busy is
    # set strands the UI in a permanently busy state. Repeated media-state
    # callbacks and double taps must be ignored until the handoff completes.
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 0 &&
                     !id(ui_snapshot_io_busy) &&
                     (int32_t) (millis() - id(ui_touch_click_block_until_ms)) >= 0;
          then:
            - script.stop: ui_refresh_tile_snapshots
            - script.stop: volume_overlay_timeout
            - script.stop: open_speaker_group_panel
            - script.stop: update_speaker_group_panel
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'true'
            - lambda: |-
                if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
                id(ui_touch_click_block_until_ms) = millis() + 800;
                id(media_speaker_panel_open) = false;
                id(global_volume_time_press_tracking) = false;
                id(global_volume_dragging) = false;
                atmosfera_ui::volume_overlay_direct_end();
                lv_anim_del(id(global_volume_overlay), nullptr);
                lv_anim_del(id(volume_overlay), nullptr);
                lv_obj_set_style_opa(id(global_volume_overlay), LV_OPA_COVER, 0);
                lv_obj_set_style_opa(id(volume_overlay), LV_OPA_COVER, 0);
                lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN);
                // The cached Player snapshot already contains the complete
                // control. Do not touch its live renderer until the opening
                // compositor has handed the full screen back to LVGL; doing
                // so exposed the placeholder/ARGB image as a square during
                // the transition.
                atmosfera_ui::media_wavy_arc_set_direct_present(false);
            - lambda: |-
                lv_obj_t *home = id(controls_root_1);
                if (id(ui_home_page) == 2) home = id(controls_root_2);
                else if (id(ui_home_page) == 3) home = id(controls_root_3);
                else if (id(ui_home_page) == 4) home = id(controls_root_4);
                lvgl_esphome_snapshot_app_open(id(wear_root), home, 800, 500);
            - wait_until:
                condition:
                  lambda: 'return !lvgl_esphome_snapshot_is_active();'
                timeout: 1500ms
            - script.execute: ui_prepare_player_page
            - lvgl.page.show:
                id: music_page
                animation: NONE
                time: 50ms
            - lambda: |-
                lvgl_esphome_snapshot_app_release_open_hold();
                // The decoded opening frame is no longer visible once the
                // live Player page owns the display. Reclaim its full-screen
                // workspace before artwork decoding starts.
                lvgl_esphome_snapshot_app_release_work_buffer();
            - lambda: |-
                id(ui_active_app) = 1;
                lv_obj_clear_flag(id(app_close_gesture_zone), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(app_close_gesture_zone));
            - delay: 40ms
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'false'
            - script.execute: media_update_main_control
            - script.execute: media_resume_artwork_after_player_open

  - id: ui_open_settings_app
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 0 &&
                     !id(ui_snapshot_io_busy) &&
                     (int32_t) (millis() - id(ui_touch_click_block_until_ms)) >= 0;
          then:
            - script.stop: ui_refresh_tile_snapshots
            - script.execute: ui_quiesce_player_direct_regions
            - script.wait: ui_quiesce_player_direct_regions
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'true'
            - lambda: |-
                if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
                id(ui_touch_click_block_until_ms) = millis() + 800;
            - lambda: |-
                lv_obj_t *home = id(controls_root_1);
                if (id(ui_home_page) == 2) home = id(controls_root_2);
                else if (id(ui_home_page) == 3) home = id(controls_root_3);
                else if (id(ui_home_page) == 4) home = id(controls_root_4);
                lvgl_esphome_snapshot_app_open(id(settings_root), home, 800, 500);
            - wait_until:
                condition:
                  lambda: 'return !lvgl_esphome_snapshot_is_active();'
                timeout: 750ms
            - script.execute: ui_prepare_settings_page
            - lvgl.page.show:
                id: settings_page
                animation: NONE
                time: 50ms
            - lambda: |-
                id(ui_active_app) = 2;
                lv_obj_clear_flag(id(app_close_gesture_zone), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(app_close_gesture_zone));
                // The opening frame is now owned by the live Settings page.
                // Reclaim its 800x800 work surface before allocating the taller
                // scroll snapshot so both allocations never coexist in PSRAM.
                lvgl_esphome_snapshot_app_release_open_hold();
                lvgl_esphome_snapshot_app_release_work_buffer();
            - lambda: |-
                const bool prepared = lvgl_esphome_snapshot_scroll_prepare(id(settings_root), 800, 800);
                ESP_LOGW("settings.snapshot", "initial bitmap prepare=%s psram_free=%uK largest=%uK",
                         prepared ? "ok" : "failed",
                         (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                         (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'false'
            - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'

  - id: ui_open_voice_app
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 0 &&
                     !id(ui_snapshot_io_busy) &&
                     (int32_t) (millis() - id(ui_touch_click_block_until_ms)) >= 0;
          then:
            - script.stop: ui_refresh_tile_snapshots
            - script.execute: ui_quiesce_player_direct_regions
            - script.wait: ui_quiesce_player_direct_regions
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'true'
            - lambda: |-
                if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
                id(ui_touch_click_block_until_ms) = millis() + 800;
                lv_obj_t *home = id(controls_root_1);
                if (id(ui_home_page) == 2) home = id(controls_root_2);
                else if (id(ui_home_page) == 3) home = id(controls_root_3);
                else if (id(ui_home_page) == 4) home = id(controls_root_4);
                lvgl_esphome_snapshot_app_open(id(voice_assistant_overlay), home, 800, 500);
            - wait_until:
                condition:
                  lambda: 'return !lvgl_esphome_snapshot_is_active();'
                timeout: 750ms
            - lambda: |-
                id(ui_active_app) = 3;
                lv_obj_clear_flag(id(voice_assistant_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_update_layout(id(voice_assistant_overlay));
                lv_obj_clear_flag(id(app_close_gesture_zone), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(app_close_gesture_zone));
                lv_obj_move_foreground(id(voice_assistant_overlay));
                if (id(perf_overlay_label) != nullptr && id(settings_perf_overlay_switch).state) {
                  lv_obj_move_foreground(id(perf_overlay_label));
                }
                lvgl_esphome_snapshot_app_release_open_hold();
                lvgl_esphome_snapshot_app_release_work_buffer();
            - if:
                condition:
                  switch.is_off: voice_assistant_mute_switch
                then:
                  - if:
                      condition:
                        lambda: 'return id(va)->is_connected();'
                      then:
                        - if:
                            condition:
                              media_player.is_playing: local_music_player
                            then:
                              - globals.set:
                                  id: voice_assistant_paused_media
                                  value: 'true'
                              - media_player.pause: local_music_player
                              - delay: 300ms
                            else:
                              - globals.set:
                                  id: voice_assistant_paused_media
                                  value: 'false'
                        - lambda: |-
                            id(voice_assistant_phase) = ${voice_assist_waiting_phase_id};
                            id(voice_assistant_tts_active) = false;
                            id(voice_assistant_request_text).publish_state("");
                            id(voice_assistant_response_text).publish_state("");
                        - script.execute: display_wake
                        - script.execute: voice_assistant_update_overlay
                        - micro_wake_word.stop:
                        - switch.turn_on: voice_audio_processing_switch
                        - script.execute: ui_play_va_listening_sound
                        - script.wait: ui_play_va_listening_sound
                        - if:
                            condition:
                              switch.is_on: voice_assistant_wake_sound_switch
                            then:
                              - delay: !lambda 'return id(va)->get_wake_open_delay_ms();'
                            else:
                              - delay: 250ms
                        - lambda: 'id(va)->start_session();'
                      else:
                        - lambda: |-
                            id(voice_assistant_phase) = ${voice_assist_error_phase_id};
                            id(voice_assistant_request_text).publish_state("");
                            id(voice_assistant_response_text).publish_state("Realtime backend unavailable");
                        - script.execute: display_wake
                        - script.execute: voice_assistant_update_overlay
                else:
                  - lambda: |-
                      id(voice_assistant_phase) = ${voice_assist_error_phase_id};
                      id(voice_assistant_request_text).publish_state("");
                      id(voice_assistant_response_text).publish_state("Microphone muted");
                  - script.execute: display_wake
                  - script.execute: voice_assistant_update_overlay
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'false'
            - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'

  - id: ui_open_immich_app
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_app) == 0 &&
                     !id(ui_snapshot_io_busy) &&
                     (int32_t) (millis() - id(ui_touch_click_block_until_ms)) >= 0;
          then:
            - script.stop: ui_refresh_tile_snapshots
            - script.execute: ui_quiesce_player_direct_regions
            - script.wait: ui_quiesce_player_direct_regions
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'true'
            - lambda: |-
                if (id(ui_page) >= 1 && id(ui_page) <= 4) id(ui_home_page) = id(ui_page);
                id(ui_touch_click_block_until_ms) = millis() + 800;
                lv_obj_t *home = id(controls_root_1);
                if (id(ui_home_page) == 2) home = id(controls_root_2);
                else if (id(ui_home_page) == 3) home = id(controls_root_3);
                else if (id(ui_home_page) == 4) home = id(controls_root_4);
                lvgl_esphome_snapshot_app_open(id(immich_root), home, 800, 500);
            - wait_until:
                condition:
                  lambda: 'return !lvgl_esphome_snapshot_is_active();'
                timeout: 750ms
            - script.execute: ui_prepare_immich_page
            - lvgl.page.show:
                id: immich_page
                animation: NONE
                time: 50ms
            - lambda: |-
                id(ui_active_app) = 4;
                lv_obj_clear_flag(id(immich_root), LV_OBJ_FLAG_HIDDEN);
                lv_obj_update_layout(id(immich_root));
                lv_obj_clear_flag(id(app_close_gesture_zone), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(app_close_gesture_zone));
                lvgl_esphome_snapshot_app_release_open_hold();
                // Leave one contiguous full-screen block available for the
                // gallery transition frame and the next hardware JPEG output.
                lvgl_esphome_snapshot_app_release_work_buffer();
            - delay: 20ms
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'false'
            - lambda: 'lvgl_esphome_direct_regions_pause(false, 0);'
            - script.execute: immich_opened

  - id: ui_close_app
    # The close transaction owns the direct compositor and busy flag until the
    # final home frame is restored. A second gesture must not restart it.
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(ui_active_app) != 0;'
          then:
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'true'
            - if:
                condition:
                  lambda: 'return id(ui_active_app) == 1;'
                then:
                  - script.stop: volume_overlay_timeout
                  - script.stop: open_speaker_group_panel
                  - script.stop: update_speaker_group_panel
                  - lambda: |-
                      id(media_speaker_panel_open) = false;
                      id(global_volume_time_press_tracking) = false;
                      id(global_volume_dragging) = false;
                      atmosfera_ui::volume_overlay_direct_end();
                      lv_anim_del(id(global_volume_overlay), nullptr);
                      lv_anim_del(id(volume_overlay), nullptr);
                      lv_obj_set_style_opa(id(global_volume_overlay), LV_OPA_COVER, 0);
                      lv_obj_set_style_opa(id(volume_overlay), LV_OPA_COVER, 0);
                      lv_obj_add_flag(id(global_volume_overlay), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(volume_overlay), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(queue_panel), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(speaker_group_panel), LV_OBJ_FLAG_HIDDEN);
            - lambda: |-
                // Freeze every direct-region producer before capturing the
                // application. pause(true) rejects new work first and then
                // drains the already queued PPA requests, so no stale wave or
                // marquee region can overwrite the closing snapshot.
                if (!lvgl_esphome_direct_regions_pause(true, 150)) {
                  ESP_LOGW("ui.close", "regional compositor drain timed out before app close");
                }
                lv_obj_t *app = nullptr;
                if (id(ui_active_app) == 1) {
                  atmosfera_ui::media_wavy_arc_set_direct_present(false);
                  atmosfera_ui::title_marquee_direct_end(true);
                  app = id(wear_root);
                }
                else if (id(ui_active_app) == 2) {
                  lvgl_esphome_snapshot_scroll_end();
                  app = id(settings_root);
                }
                else if (id(ui_active_app) == 3) app = id(voice_assistant_overlay);
                else if (id(ui_active_app) == 4) {
                  id(immich_ken_burns).pause_for_snapshot();
                  app = id(immich_root);
                }
                lv_obj_t *home = id(controls_root_1);
                if (id(ui_home_page) == 2) home = id(controls_root_2);
                else if (id(ui_home_page) == 3) home = id(controls_root_3);
                else if (id(ui_home_page) == 4) home = id(controls_root_4);
                if (app != nullptr) {
                  lvgl_esphome_snapshot_app_prepare_close(app);
                  if (id(ui_active_app) == 4)
                    id(immich_ken_burns).complete_snapshot_handoff();
                  lvgl_esphome_snapshot_app_close(app, home, 800, 400, 600, 500);
                }
            - if:
                condition:
                  lambda: 'return id(ui_active_app) == 1;'
                then:
                  - lambda: |-
                      id(album_art_background).set_sendspin_paused(true);
                  - lvgl.widget.hide:
                      - global_volume_overlay
                      - volume_overlay
                      - queue_panel
                      - speaker_group_panel
            - if:
                condition:
                  lambda: 'return id(ui_active_app) == 3;'
                then:
                  - lambda: 'id(va)->end_session();'
                  - speaker.stop: assistant_speaker
                  - switch.turn_off: timer_ringing
                  - switch.turn_off: voice_audio_processing_switch
                  - lambda: 'id(voice_assistant_phase) = ${voice_assist_idle_phase_id};'
                  - if:
                      condition:
                        and:
                        - switch.is_off: voice_assistant_mute_switch
                        - lambda: 'return id(va)->is_connected();'
                      then:
                        - micro_wake_word.start:
                        - script.execute: voice_assistant_apply_idle_wake_word
            - wait_until:
                condition:
                  lambda: 'return !lvgl_esphome_snapshot_is_active();'
                timeout: 750ms
            # Keep the live LVGL tree untouched while the direct compositor
            # owns the display. Repositioning the home roots underneath the
            # close animation caused an extra redraw and stale edge pixels.
            - script.execute: ui_show_home_page
            - script.wait: ui_show_home_page
            - lambda: |-
                // Release the compositor only after the live Home page has
                // replaced the closing app underneath the final frame.
                lvgl_esphome_snapshot_app_release_open_hold();
                lvgl_esphome_direct_regions_pause(false, 0);
            - if:
                condition:
                  lambda: 'return id(ui_active_app) == 4;'
                then:
                  - script.execute: immich_closed
            - globals.set:
                id: ui_active_app
                value: '0'
            - script.execute: voice_assistant_update_overlay
            - lvgl.widget.hide: app_close_gesture_zone
            - lvgl.widget.hide: ui_touch_blocker
            - delay: 100ms
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'false'

  - id: ui_show_tiles_1
    then:
      - lvgl.widget.hide: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '1'
      - script.execute: ui_set_tile_visibility_1
      - script.execute: ui_refresh_tile_snapshots
  - id: ui_show_tiles_2
    then:
      - lvgl.widget.hide: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '2'
      - script.execute: ui_set_tile_visibility_2
      - script.execute: ui_refresh_tile_snapshots
  - id: ui_show_tiles_3
    then:
      - lvgl.widget.hide: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '3'
      - script.execute: ui_set_tile_visibility_3
      - script.execute: ui_refresh_tile_snapshots
  - id: ui_show_tiles_4
    then:
      - lvgl.widget.hide: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '4'
      - script.execute: ui_set_tile_visibility_4
      - script.execute: ui_refresh_tile_snapshots
  - id: ui_prepare_player_page
    then:
      - lvgl.widget.show: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - lambda: |-
          id(album_art_background).set_sendspin_paused(false);
          atmosfera_ui::media_wavy_arc_init(id(media_main_progress_arc));
          atmosfera_ui::media_wavy_arc_set_value(id(last_media_progress_percent));
      - script.execute: media_title_marquee_reset_and_start
      - if:
          condition:
            lambda: 'return lv_obj_has_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute: media_show_lottie_visual
          else:
            - script.execute: media_hide_lottie_visual
      - script.execute: media_resume_deferred_artwork
      - script.execute: refresh_progress_bar_from_state

  - id: ui_prepare_settings_page
    then:
      - lvgl.widget.update:
          id: settings_root
          y: 0
      - script.execute: ui_prepare_settings_rows_for_touch
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '5'
      - script.execute: ui_apply_settings_state

  - id: ui_prepare_immich_page
    then:
      - lvgl.widget.show: immich_root
      - lvgl.widget.update:
          id: immich_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '6'
      - lambda: |-
          lv_label_set_text(id(immich_play_pause_icon),
                            id(immich_slideshow_enabled).state ? "\U0000e034" : "\U0000e037");
          if (id(immich_image_loaded)) {
            id(immich_apply_photo).execute();
          }

  - id: ui_show_settings
    then:
      - script.execute: ui_prepare_settings_page
      - lvgl.page.show:
          id: settings_page
          animation: MOVE_BOTTOM
          time: 220ms
  - id: ui_apply_diagnostics_logging_state
    then:
      - lambda: |-
          const bool force_perf_logs = false;
          lvgl_esphome_set_perf_logging_enabled(force_perf_logs || id(settings_perf_logs_switch).state);
          lvgl_esphome_set_swipe_logging_enabled(id(settings_swipe_logs_switch).state);

  - id: ui_update_true_colour_state
    then:
      - lvgl.label.update:
          id: settings_true_colour_value
          text: "RGB888"
          text_color: 0xC3EDCF
      - lvgl.label.update:
          id: settings_true_colour_note
          text: "LVGL ARGB8888 / DSI 24-bit"

  - id: ui_update_screen_tone_state
    then:
      # Screen Tone currently needs an alpha overlay, which is too expensive on this display path.
      - lvgl.label.update:
          id: settings_screen_tone_value
          text: "OFF"
          text_color: 0xC4C7C5

  - id: ui_update_perf_overlay_state
    then:
      - if:
          condition:
            switch.is_on: settings_perf_overlay_switch
          then:
            - lvgl.label.update:
                id: settings_perf_overlay_value
                text: "ON"
                text_color: 0xC3EDCF
            - lvgl.widget.show: perf_overlay_label
            - lambda: |-
                if (id(perf_overlay_label) != nullptr) {
                  lv_obj_move_foreground(id(perf_overlay_label));
                }
          else:
            - lvgl.label.update:
                id: settings_perf_overlay_value
                text: "OFF"
                text_color: 0xC4C7C5
            - lvgl.widget.hide: perf_overlay_label

  - id: ui_update_system_logs_state
    then:
      - if:
          condition:
            switch.is_on: settings_system_logs_switch
          then:
            - lvgl.label.update:
                id: settings_system_logs_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_system_logs_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_update_perf_logs_state
    then:
      - script.execute: ui_apply_diagnostics_logging_state
      - if:
          condition:
            switch.is_on: settings_perf_logs_switch
          then:
            - lvgl.label.update:
                id: settings_perf_logs_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_perf_logs_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_update_swipe_logs_state
    then:
      - script.execute: ui_apply_diagnostics_logging_state
      - if:
          condition:
            switch.is_on: settings_swipe_logs_switch
          then:
            - lvgl.label.update:
                id: settings_swipe_logs_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_swipe_logs_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_update_beta_firmware_state
    then:
      - if:
          condition:
            switch.is_on: settings_beta_firmware_switch
          then:
            - lvgl.label.update:
                id: settings_beta_firmware_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_beta_firmware_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_update_voice_mute_state
    then:
      - if:
          condition:
            switch.is_on: voice_assistant_mute_switch
          then:
            - lvgl.label.update:
                id: settings_voice_mute_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_voice_mute_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_update_wake_sound_state
    then:
      - if:
          condition:
            switch.is_on: voice_assistant_wake_sound_switch
          then:
            - lvgl.label.update:
                id: settings_wake_sound_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_wake_sound_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_update_display_brightness_state
    then:
      - lvgl.label.update:
          id: settings_display_brightness_value
          text:
            format: "%.0f%%"
            args: [id(settings_display_brightness).state]

  - id: ui_update_display_timeout_state
    then:
      - if:
          condition:
            lambda: 'return id(settings_display_timeout).state <= 0.5f;'
          then:
            - lvgl.label.update:
                id: settings_display_timeout_value
                text: "Never"
          else:
            - lvgl.label.update:
                id: settings_display_timeout_value
                text:
                  format: "%.0fs"
                  args: [id(settings_display_timeout).state]

  - id: ui_update_wake_sensitivity_state
    then:
      - if:
          condition:
            select.is:
              id: mww_sensitivity_select
              options: ["Slightly sensitive"]
          then:
            - lvgl.label.update:
                id: settings_wake_sensitivity_value
                text: "Slightly"
      - if:
          condition:
            select.is:
              id: mww_sensitivity_select
              options: ["Moderately sensitive"]
          then:
            - lvgl.label.update:
                id: settings_wake_sensitivity_value
                text: "Moderate"
      - if:
          condition:
            select.is:
              id: mww_sensitivity_select
              options: ["Very sensitive"]
          then:
            - lvgl.label.update:
                id: settings_wake_sensitivity_value
                text: "Very"

  - id: ui_update_immich_fade_state
    then:
      - if:
          condition:
            switch.is_on: immich_fade_through_black
          then:
            - lvgl.label.update:
                id: settings_immich_fade_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_immich_fade_value
                text: "OFF"
                text_color: 0xC4C7C5

  - id: ui_apply_settings_state
    then:
      - script.execute: ui_apply_diagnostics_logging_state
      - script.wait: ui_apply_diagnostics_logging_state
      - script.execute: ui_update_true_colour_state
      - script.wait: ui_update_true_colour_state
      - script.execute: ui_update_screen_tone_state
      - script.wait: ui_update_screen_tone_state
      - script.execute: ui_update_perf_overlay_state
      - script.wait: ui_update_perf_overlay_state
      - script.execute: ui_update_system_logs_state
      - script.wait: ui_update_system_logs_state
      - script.execute: ui_update_perf_logs_state
      - script.wait: ui_update_perf_logs_state
      - script.execute: ui_update_swipe_logs_state
      - script.wait: ui_update_swipe_logs_state
      - script.execute: ui_update_beta_firmware_state
      - script.wait: ui_update_beta_firmware_state
      - script.execute: ui_update_display_brightness_state
      - script.wait: ui_update_display_brightness_state
      - script.execute: ui_update_display_timeout_state
      - script.wait: ui_update_display_timeout_state
      - script.execute: ui_update_voice_mute_state
      - script.wait: ui_update_voice_mute_state
      - script.execute: ui_update_wake_sound_state
      - script.wait: ui_update_wake_sound_state
      - script.execute: ui_update_wake_sensitivity_state
      - script.wait: ui_update_wake_sensitivity_state
      - script.execute: ui_update_immich_fade_state
      - script.wait: ui_update_immich_fade_state
