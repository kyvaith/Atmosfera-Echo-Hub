# Navigation state and screen-level actions.
# Tile pages, music view and settings view share this small state machine.
globals:
  - id: ui_page
    type: int
    restore_value: no
    initial_value: '1'
  # Application registry. Home/tile pages keep using ui_page=1..4; every
  # fullscreen program is tracked here so launch/close gestures stay generic.
  - id: ui_home_page
    type: int
    restore_value: no
    initial_value: '1'
  - id: ui_active_app
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_tile_snapshots_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ui_tile_snapshot_prepared_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_tile_snapshot_cached_first
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_tile_snapshot_cached_last
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_snapshot_io_busy
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ui_touch_click_block_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ui_touch_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ui_manual_pressed_obj
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'

script:
  - id: ui_quiesce_player_direct_regions
    mode: restart
    then:
      - script.stop: media_title_marquee_start_delayed
      - script.stop: media_title_marquee_reset_and_start
      - lambda: |-
          if (!lvgl_esphome_direct_regions_pause(true, 150)) {
            ESP_LOGW("ui.layers", "regional compositor drain timed out before app handoff");
          }
          id(media_wavy_progress).set_direct_present(false);
          id(media_title_marquee).end(true);

  - id: ui_touch_block_for_drag
    mode: restart
    then:
      - lambda: |-
          id(ui_touch_click_block_until_ms) = millis() + 700;
          lv_obj_clear_flag(id(ui_touch_blocker), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(ui_touch_blocker));
          lv_indev_reset(nullptr, nullptr);

  - id: ui_release_touch_blocker
    mode: restart
    then:
      - lambda: |-
          id(ui_touch_click_block_until_ms) = millis() + 700;
          lv_indev_reset(nullptr, nullptr);
      - delay: 220ms
      - lambda: |-
          lv_indev_reset(nullptr, nullptr);
      - lvgl.widget.hide: ui_touch_blocker

  - id: ui_update_page_indicator
    then:
      - lambda: |-
          lv_obj_t *dots[] = {
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          int page = id(ui_page);
          if (page < 1 || page > 4) page = 1;
          for (int i = 0; i < 4; i++) {
            const bool active = (i + 1) == page;
            if (active)
              lv_obj_add_state(dots[i], LV_STATE_CHECKED);
            else
              lv_obj_remove_state(dots[i], LV_STATE_CHECKED);
          }
          lv_obj_update_layout(id(page_indicator_row));
          lvgl_esphome_snapshot_swipe_set_page_indicator(page, 4);

  - id: ui_apply_tile_positions
    then:
      - lambda: |-
          int page = id(ui_page);
          if (page < 1 || page > 4) page = 1;
          lv_obj_t *roots[] = {
            id(controls_root_1),
            id(controls_root_2),
            id(controls_root_3),
            id(controls_root_4),
          };
          const int page_count = sizeof(roots) / sizeof(roots[0]);
          auto *display = lv_obj_get_display(roots[0]);
          const int page_width = display != nullptr
                                     ? lv_display_get_horizontal_resolution(display)
                                     : lv_obj_get_width(lv_screen_active());
          for (int i = 0; i < page_count; i++) {
            if (roots[i] == nullptr) continue;
            lv_obj_align(roots[i], LV_ALIGN_CENTER, (i + 1 - page) * page_width, 0);
            if (i + 1 == page)
              lv_obj_clear_flag(roots[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(roots[i], LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: ui_update_page_indicator

  - id: ui_show_home_content_after_boot
    then:
      - lambda: |-
          lv_obj_t *indicators[] = {
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          for (auto *obj : indicators) {
            if (obj != nullptr) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          }
          // Snapshot preparation already leaves page 1 aligned and rendered
          // behind the opaque boot overlay. Re-applying all four 800x800 roots
          // here invalidated the screen a second time and starved DSI exactly
          // when the overlay was about to disappear.
          lvgl_esphome_snapshot_swipe_set_page_indicator(id(ui_page), 4);

  - id: ui_set_tile_visibility_1
    then:
      - globals.set:
          id: ui_page
          value: '1'
      - script.execute: ui_apply_tile_positions

  - id: ui_set_tile_visibility_2
    then:
      - globals.set:
          id: ui_page
          value: '2'
      - script.execute: ui_apply_tile_positions

  - id: ui_set_tile_visibility_4
    then:
      - globals.set:
          id: ui_page
          value: '4'
      - script.execute: ui_apply_tile_positions

  - id: ui_build_tile_snapshots_now
    mode: single
    then:
      - globals.set:
          id: ui_snapshot_io_busy
          value: 'true'
      - globals.set:
          id: ui_tile_snapshots_ready
          value: 'false'
      - globals.set:
          id: ui_tile_snapshot_prepared_page
          value: '0'
      - globals.set:
          id: ui_tile_snapshot_cached_first
          value: '0'
      - globals.set:
          id: ui_tile_snapshot_cached_last
          value: '0'
      # Arrange the live roots while the display is still covered. The final
      # post-Lottie stage encodes every page and fills three reusable raw slots.
      - script.execute: ui_set_tile_visibility_2
      - delay: 80ms
      - lambda: |-
          ESP_LOGW("boot.diag",
                   "tile snapshot cache: begin raw pages internal=%uK/%uK psram=%uK/%uK",
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          lv_obj_t *roots[] = {
            id(controls_root_1),
            id(controls_root_2),
            id(controls_root_3),
            id(controls_root_4),
          };
          lv_obj_t *dots[] = {
            id(page_indicator_1),
            id(page_indicator_2),
            id(page_indicator_3),
            id(page_indicator_4),
          };
          lvgl_esphome_snapshot_set_clock_font(id(roboto_34)->get_lv_font());
          lv_obj_add_flag(id(global_time_button), LV_OBJ_FLAG_HIDDEN);
          for (auto *dot : dots) {
            if (dot != nullptr) lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
          }
          const int page_count = sizeof(roots) / sizeof(roots[0]);
          auto *display = lv_obj_get_display(roots[0]);
          const int page_width = display != nullptr
                                     ? lv_display_get_horizontal_resolution(display)
                                     : lv_obj_get_width(lv_screen_active());
          auto apply_page = [&](int page) {
            id(ui_page) = page;
            for (int i = 0; i < page_count; i++) {
              if (roots[i] == nullptr) continue;
              lv_obj_clear_flag(roots[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_align(roots[i], LV_ALIGN_CENTER, (i + 1 - page) * page_width, 0);
            }
            for (int i = 0; i < page_count; i++) {
              if (dots[i] == nullptr) continue;
              const bool active = (i + 1) == page;
              if (active)
                lv_obj_add_state(dots[i], LV_STATE_CHECKED);
              else
                lv_obj_remove_state(dots[i], LV_STATE_CHECKED);
            }
            lv_obj_update_layout(id(page_indicator_row));
            lvgl_esphome_snapshot_swipe_set_page_indicator(page, 4);
            lv_obj_update_layout(lv_obj_get_parent(id(controls_root_1)));
          };
          // Application previews are captured only after the boot Lottie has
          // released its frame cache. Capturing them here produced valid JPEG
          // files from an unstable, memory-starved first render and caused the
          // first app opening after every reboot to show noise.
          const bool apps_prepared = false;
          // Lottie still owns its frame cache here, so page compression is
          // deliberately deferred until that memory has been released.
          const bool compressed_pages_prepared = false;
          // Application previews stay compressed until one app is selected.
          // A single shared full-resolution RGB888 surface is allocated after
          // Lottie releases its frame cache and reused by every transition.
          apply_page(1);
          // The 11 MB Lottie frame cache is still resident here. Decoding raw
          // Home pages now only fragments PSRAM and fails part-way through.
          // ui_finish_boot_tile_snapshot_cache builds the JPEG backing store
          // and the three-slot working set under the opaque boot overlay.
          id(ui_tile_snapshots_ready) = false;
          id(ui_tile_snapshot_prepared_page) = 0;
          id(ui_tile_snapshot_cached_first) = 0;
          id(ui_tile_snapshot_cached_last) = 0;
          lv_obj_clear_flag(id(global_time_button), LV_OBJ_FLAG_HIDDEN);
          for (auto *dot : dots) {
            if (dot != nullptr) lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
          }
          ESP_LOGW("boot.diag",
                   "snapshot cache: done pages=%u apps=%u raw_range=%d-%d ready=%u internal=%uK/%uK psram=%uK/%uK",
                   (unsigned) compressed_pages_prepared, (unsigned) apps_prepared,
                   id(ui_tile_snapshot_cached_first), id(ui_tile_snapshot_cached_last), 0U,
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
      - script.execute: ui_set_tile_visibility_1
      - delay: 40ms
      - globals.set:
          id: ui_snapshot_io_busy
          value: 'false'

  - id: ui_refresh_tile_snapshots
    mode: restart
    then:
      # Keep only previous/current/next decoded. Retry just after a compositor
      # frame instead of allocating a fourth raw page during a fast gesture.
      - delay: 24ms
      - lambda: |-
          if (id(ui_active_app) != 0 || id(ui_page) < 1 || id(ui_page) > 4) return;
          lv_obj_t *pages[] = {
            id(controls_root_1), id(controls_root_2),
            id(controls_root_3), id(controls_root_4),
          };
          constexpr int page_count = sizeof(pages) / sizeof(pages[0]);
          constexpr int window_count = 3;
          int required_first = id(ui_page) - 1;
          if (required_first < 1) required_first = 1;
          if (required_first > page_count - window_count + 1)
            required_first = page_count - window_count + 1;
          const int required_last = required_first + window_count - 1;
          if (id(ui_tile_snapshots_ready) &&
              id(ui_tile_snapshot_cached_first) <= required_first &&
              id(ui_tile_snapshot_cached_last) >= required_last) {
            return;
          }
          if (id(ui_snapshot_io_busy)) {
            id(ui_refresh_tile_snapshots).execute();
            return;
          }
          if (lvgl_esphome_snapshot_is_active()) {
            id(ui_refresh_tile_snapshots).execute();
            return;
          }
          id(ui_snapshot_io_busy) = true;
          static uint32_t boot_snapshot_diag_budget = 4;
          const bool log_boot_snapshot = boot_snapshot_diag_budget > 0;
          if (log_boot_snapshot) {
            boot_snapshot_diag_budget--;
            ESP_LOGW("boot.diag",
                     "tile snapshot window refresh: begin page=%d internal=%uK/%uK psram=%uK/%uK",
                     id(ui_page),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          }
          auto *display = lv_obj_get_display(pages[0]);
          const int page_width = display != nullptr
                                     ? lv_display_get_horizontal_resolution(display)
                                     : lv_obj_get_width(lv_screen_active());
          const bool prepared =
              lvgl_esphome_snapshot_cache_tile_window(pages, page_count, id(ui_page), page_width);
          id(ui_tile_snapshots_ready) = prepared;
          id(ui_tile_snapshot_prepared_page) = prepared ? id(ui_page) : 0;
          id(ui_tile_snapshot_cached_first) = prepared ? required_first : 0;
          id(ui_tile_snapshot_cached_last) = prepared ? required_last : 0;
          if (log_boot_snapshot || !prepared) {
            ESP_LOGW("boot.diag",
                     "tile snapshot window refresh: done page=%d range=%d-%d prepared=%u internal=%uK/%uK psram=%uK/%uK",
                     id(ui_page), id(ui_tile_snapshot_cached_first), id(ui_tile_snapshot_cached_last),
                     (unsigned) prepared,
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
          }
          id(ui_snapshot_io_busy) = false;

  # A control changed on the live Home page. Refresh its current raw slot in
  # place. The compressed copy is updated only when that slot is recycled.
  - id: ui_refresh_current_tile_snapshot
    mode: restart
    then:
      - delay: 180ms
      - lambda: |-
          if (id(ui_active_app) != 0 || id(ui_snapshot_io_busy) ||
              id(ui_touch_active) || id(ui_manual_pressed_obj) != nullptr ||
              lvgl_esphome_snapshot_is_active()) {
            id(ui_refresh_current_tile_snapshot).execute();
            return;
          }
          lv_obj_t *page = id(controls_root_1);
          if (id(ui_page) == 2) page = id(controls_root_2);
          else if (id(ui_page) == 3) page = id(controls_root_3);
          else if (id(ui_page) == 4) page = id(controls_root_4);
          id(ui_snapshot_io_busy) = true;
          auto *display = lv_obj_get_display(page);
          const int page_width = display != nullptr
                                     ? lv_display_get_horizontal_resolution(display)
                                     : lv_obj_get_width(lv_screen_active());
          const bool refreshed = lvgl_esphome_snapshot_refresh_tile_page(page, page_width);
          id(ui_snapshot_io_busy) = false;
          if (!refreshed && id(settings_swipe_logs_switch).state) {
            ESP_LOGW("snapshot.refresh", "Home page %d refresh deferred", id(ui_page));
          }

  # Settings keeps one decoded list surface for its entire lifetime. Refresh
  # that allocation in place after a value changes, so the next drag cannot
  # reveal stale controls or require another multi-megabyte PSRAM allocation.
  - id: ui_refresh_settings_snapshot
    mode: restart
    then:
      - delay: 180ms
      - if:
          condition:
            lambda: 'return id(ui_active_app) == 2;'
          then:
            - if:
                condition:
                  lambda: |-
                    return id(ui_snapshot_io_busy) || id(ui_touch_active) ||
                           id(ui_manual_pressed_obj) != nullptr ||
                           lvgl_esphome_snapshot_is_active();
                then:
                  - script.execute: ui_refresh_settings_snapshot
                else:
                  - globals.set:
                      id: ui_snapshot_io_busy
                      value: 'true'
                  - lvgl.snapshot_scroll.refresh: settings_scroll_snapshot
                  - globals.set:
                      id: ui_snapshot_io_busy
                      value: 'false'

  - id: ui_finish_boot_tile_snapshot_cache
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(ui_snapshot_io_busy);
          then:
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'true'
            - lambda: |-
                ESP_LOGW("boot.diag",
                         "post-Lottie app snapshots: begin internal=%uK/%uK psram=%uK/%uK",
                         (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                         (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                         (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                         (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
                id(album_art_background).set_sendspin_paused(true);
                id(media_wavy_progress).set_background(
                    id(album_art_placeholder).get_lv_image_dsc(), false);
                id(media_wavy_progress).initialize();
                id(media_wavy_progress).set_value(id(last_media_progress_percent));
                lv_obj_update_layout(lv_screen_active());
            - lvgl.navigation.prepare_applications: ui_navigation
            - lvgl.navigation.refresh: ui_navigation
            - lambda: |-
                const bool prepared = id(ui_navigation).is_home_snapshot_prepared();
                const bool app_work_buffer = lvgl_esphome_snapshot_app_reserve_work_buffer(id(wear_root));
                id(ui_tile_snapshots_ready) = prepared;
                id(ui_tile_snapshot_prepared_page) = prepared ? 1 : 0;
                id(ui_tile_snapshot_cached_first) = prepared ? 1 : 0;
                id(ui_tile_snapshot_cached_last) = prepared ? 3 : 0;
                ESP_LOGW("boot.diag",
                         "post-Lottie caches app_work=%u home=%u range=%d-%d psram=%uK/%uK",
                         (unsigned) app_work_buffer, (unsigned) prepared,
                         id(ui_tile_snapshot_cached_first), id(ui_tile_snapshot_cached_last),
                         (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                         (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
            - globals.set:
                id: ui_snapshot_io_busy
                value: 'false'

  - id: ui_show_tiles_4
    then:
      - lvgl.widget.hide: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '4'
      - script.execute: ui_set_tile_visibility_4
      - script.execute: ui_refresh_tile_snapshots
  - id: ui_prepare_player_page
    then:
      - lvgl.widget.show: wear_root
      - lvgl.widget.update:
          id: wear_root
          y: 0
      - lambda: |-
          id(album_art_background).set_sendspin_paused(false);
          id(media_wavy_progress).initialize();
          id(media_wavy_progress).set_value(id(last_media_progress_percent));
      - script.execute: media_title_marquee_reset_and_start
      - if:
          condition:
            lambda: 'return lv_obj_has_flag(id(album_art_background_widget), LV_OBJ_FLAG_HIDDEN);'
          then:
            - script.execute: media_show_lottie_visual
          else:
            - script.execute: media_hide_lottie_visual
      - script.execute: media_resume_deferred_artwork
      - script.execute: refresh_progress_bar_from_state

  - id: ui_prepare_settings_page
    then:
      - lvgl.widget.update:
          id: settings_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '5'
      - script.execute: ui_apply_settings_state

  - id: ui_prepare_immich_page
    then:
      - lvgl.widget.show: immich_root
      - lvgl.widget.update:
          id: immich_root
          y: 0
      - script.execute: media_hide_lottie_visual
      - globals.set:
          id: ui_page
          value: '6'
      - lambda: |-
          lv_label_set_text(id(immich_play_pause_icon),
                            id(immich_slideshow_enabled).state ? "\U0000e034" : "\U0000e037");
          if (id(immich_image_loaded)) {
            id(immich_apply_photo).execute();
          }

  - id: ui_apply_diagnostics_logging_state
    then:
      - lambda: |-
          const bool force_perf_logs = false;
          lvgl_esphome_set_perf_logging_enabled(force_perf_logs || id(settings_perf_logs_switch).state);
          lvgl_esphome_set_swipe_logging_enabled(id(settings_swipe_logs_switch).state);

  - id: ui_update_true_colour_state
    then:
      - lvgl.label.update:
          id: settings_true_colour_value
          text: "RGB888"
          text_color: 0xC3EDCF
      - lvgl.label.update:
          id: settings_true_colour_note
          text: "LVGL ARGB8888 / DSI 24-bit"
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_screen_tone_state
    then:
      # Screen Tone currently needs an alpha overlay, which is too expensive on this display path.
      - lvgl.label.update:
          id: settings_screen_tone_value
          text: "OFF"
          text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_perf_overlay_state
    then:
      - if:
          condition:
            switch.is_on: settings_perf_overlay_switch
          then:
            - lvgl.label.update:
                id: settings_perf_overlay_value
                text: "ON"
                text_color: 0xC3EDCF
            - lvgl.widget.show: perf_overlay_label
            - lambda: |-
                if (id(perf_overlay_label) != nullptr) {
                  lv_obj_move_foreground(id(perf_overlay_label));
                }
          else:
            - lvgl.label.update:
                id: settings_perf_overlay_value
                text: "OFF"
                text_color: 0xC4C7C5
            - lvgl.widget.hide: perf_overlay_label
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_system_logs_state
    then:
      - if:
          condition:
            switch.is_on: settings_system_logs_switch
          then:
            - lvgl.label.update:
                id: settings_system_logs_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_system_logs_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_perf_logs_state
    then:
      - script.execute: ui_apply_diagnostics_logging_state
      - if:
          condition:
            switch.is_on: settings_perf_logs_switch
          then:
            - lvgl.label.update:
                id: settings_perf_logs_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_perf_logs_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_swipe_logs_state
    then:
      - script.execute: ui_apply_diagnostics_logging_state
      - if:
          condition:
            switch.is_on: settings_swipe_logs_switch
          then:
            - lvgl.label.update:
                id: settings_swipe_logs_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_swipe_logs_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_beta_firmware_state
    then:
      - if:
          condition:
            switch.is_on: settings_beta_firmware_switch
          then:
            - lvgl.label.update:
                id: settings_beta_firmware_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_beta_firmware_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_voice_mute_state
    then:
      - if:
          condition:
            switch.is_on: voice_assistant_mute_switch
          then:
            - lvgl.label.update:
                id: settings_voice_mute_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_voice_mute_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_wake_sound_state
    then:
      - if:
          condition:
            switch.is_on: voice_assistant_wake_sound_switch
          then:
            - lvgl.label.update:
                id: settings_wake_sound_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_wake_sound_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_display_brightness_state
    then:
      - lvgl.label.update:
          id: settings_display_brightness_value
          text:
            format: "%.0f%%"
            args: [id(settings_display_brightness).state]
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_display_timeout_state
    then:
      - if:
          condition:
            lambda: 'return id(settings_display_timeout).state <= 0.5f;'
          then:
            - lvgl.label.update:
                id: settings_display_timeout_value
                text: "Never"
          else:
            - lvgl.label.update:
                id: settings_display_timeout_value
                text:
                  format: "%.0fs"
                  args: [id(settings_display_timeout).state]
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_wake_sensitivity_state
    then:
      - if:
          condition:
            select.is:
              id: mww_sensitivity_select
              options: ["Slightly sensitive"]
          then:
            - lvgl.label.update:
                id: settings_wake_sensitivity_value
                text: "Slightly"
      - if:
          condition:
            select.is:
              id: mww_sensitivity_select
              options: ["Moderately sensitive"]
          then:
            - lvgl.label.update:
                id: settings_wake_sensitivity_value
                text: "Moderate"
      - if:
          condition:
            select.is:
              id: mww_sensitivity_select
              options: ["Very sensitive"]
          then:
            - lvgl.label.update:
                id: settings_wake_sensitivity_value
                text: "Very"
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_update_immich_fade_state
    then:
      - if:
          condition:
            switch.is_on: immich_fade_through_black
          then:
            - lvgl.label.update:
                id: settings_immich_fade_value
                text: "ON"
                text_color: 0xC3EDCF
          else:
            - lvgl.label.update:
                id: settings_immich_fade_value
                text: "OFF"
                text_color: 0xC4C7C5
      - script.execute: ui_refresh_settings_snapshot

  - id: ui_apply_settings_state
    then:
      - script.execute: ui_apply_diagnostics_logging_state
      - script.wait: ui_apply_diagnostics_logging_state
      - script.execute: ui_update_true_colour_state
      - script.wait: ui_update_true_colour_state
      - script.execute: ui_update_screen_tone_state
      - script.wait: ui_update_screen_tone_state
      - script.execute: ui_update_perf_overlay_state
      - script.wait: ui_update_perf_overlay_state
      - script.execute: ui_update_system_logs_state
      - script.wait: ui_update_system_logs_state
      - script.execute: ui_update_perf_logs_state
      - script.wait: ui_update_perf_logs_state
      - script.execute: ui_update_swipe_logs_state
      - script.wait: ui_update_swipe_logs_state
      - script.execute: ui_update_beta_firmware_state
      - script.wait: ui_update_beta_firmware_state
      - script.execute: ui_update_display_brightness_state
      - script.wait: ui_update_display_brightness_state
      - script.execute: ui_update_display_timeout_state
      - script.wait: ui_update_display_timeout_state
      - script.execute: ui_update_voice_mute_state
      - script.wait: ui_update_voice_mute_state
      - script.execute: ui_update_wake_sound_state
      - script.wait: ui_update_wake_sound_state
      - script.execute: ui_update_wake_sensitivity_state
      - script.wait: ui_update_wake_sensitivity_state
      - script.execute: ui_update_immich_fade_state
      - script.wait: ui_update_immich_fade_state
