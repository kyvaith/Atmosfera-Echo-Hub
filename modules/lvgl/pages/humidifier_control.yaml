      id: humidifier_control_kind
      x: 200
      y: 68
      width: 400
      height: 28
      text: !lambda 'return std::string(id(ui_i18n).translate("humidifier_control.humidity"));'
      text_font: roboto_20
      text_color: 0xC4C7C5
      text_align: CENTER
      long_mode: DOT
      clickable: false
