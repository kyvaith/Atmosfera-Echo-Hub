# One fixed humidity view in the shared entity-control application.
# The native owner handles target preview, release, mode and power commands.
id: humidifier_control_root
x: 0
y: 0
width: 800
height: 800
bg_color: 0x000000
bg_opa: COVER
border_width: 0
pad_all: 0
radius: 0
hidden: true
clickable: false
scrollable: false
widgets:
