      type: FLEX
      flex_flow: ROW
      flex_align_main: CENTER
      flex_align_cross: CENTER
      flex_align_track: CENTER
      pad_column: 20
      pad_row: 12
    widgets:
    - button:
        id: climate_detail_mode
        width: 244
        flex_grow: 1
        height: 56
        radius: 28
        bg_color: '0x1D2833'
        bg_opa: COVER
        border_width: 0
        pad_all: 0
        shadow_width: 0
        scrollable: false
        hidden: true
        pressed:
          bg_opa: 80%
        disabled:
          text_opa: 80%
        widgets:
        - label:
            id: climate_detail_mode_label
            width: 85%
            text: ''
            text_font: roboto_20
            text_color: '0xF2F2F2'
            text_align: CENTER
            long_mode: DOT
            clickable: false
            align: CENTER
    - button:
        id: climate_detail_parameters
        width: 244
        flex_grow: 1
        height: 56
        radius: 28
        bg_color: '0x1D2833'
        bg_opa: COVER
        border_width: 0
        pad_all: 0
        shadow_width: 0
        scrollable: false
        hidden: true
        pressed:
          bg_opa: 80%
        disabled:
          text_opa: 80%
        widgets:
        - label:
            id: climate_detail_parameters_label
            width: 85%
            text: !lambda 'return std::string(id(ui_i18n).translate("detail_control.parameters"));'
            text_font: roboto_20
            text_color: '0xF2F2F2'
            text_align: CENTER
            long_mode: DOT
            clickable: false
            align: CENTER
    - button:
        id: climate_detail_range
