# Explicit detail profile in shared App6. Native owner controls visibility and input.
# One pooled numeric/choice view; static SVG, no new worker or full-screen buffer.
id: climate_detail_root
x: 0
y: 0
width: 800
height: 800
bg_opa: COVER
border_width: 0
pad_all: 0
radius: 0
clickable: false
scrollable: false
bg_color: '0x000000'
hidden: true
widgets:
- obj:
    id: climate_detail_dial
    x: 70
    y: 66
    width: 660
    height: 656
    bg_opa: 0%
    border_width: 0
    pad_all: 0
    scrollable: false
    clickable: false
    hidden: false
    widgets:
    - label:
        id: climate_detail_title
        align: TOP_MID
        width: 500
        height: 32
        text: ''
        text_align: CENTER
        text_font: roboto_24
        text_color: 12896197
        long_mode: DOT
    - arc:
        id: climate_detail_arc
        align: TOP_MID
        y: 44
        width: 600
        height: 600
        min_value: 0
        max_value: 1000
        value: 0
        start_angle: 135
        end_angle: 45
        adjustable: false
        arc_color: 462872
        arc_width: 28
        arc_rounded: true
        bg_opa: 0%
        indicator:
          arc_color: 13886461
          arc_width: 28
          arc_rounded: true
        knob:
          bg_opa: 0%
          border_width: 0
          width: 0
          height: 0
    - label:
        id: climate_detail_activity
        align: TOP_MID
        y: 203
        width: 270
        height: 34
        text: ''
        text_align: CENTER
        text_font: roboto_24
        text_color: 13886461
        long_mode: CLIP
    - label:
        id: climate_detail_target
        align: TOP_MID
        y: 259
        width: 440
        height: 82
        text: ''
        text_align: CENTER
        text_font: wear_title_53
        text_color: 16119802
        long_mode: CLIP
    - label:
        id: climate_detail_current
        align: TOP_MID
        y: 348
        width: 420
        height: 38
        text: ''
        text_align: CENTER
        text_font: roboto_24
        text_color: 12896197
        long_mode: CLIP
    - label:
        id: climate_detail_limits
        align: TOP_MID
        y: 424
        width: 440
        height: 34
        text: ''
        text_align: CENTER
        text_font: roboto_18
        text_color: 12896197
        long_mode: CLIP
    - button:
        id: climate_detail_minus
        x: 236
        y: 488
        width: 76
        height: 76
        radius: 38
        bg_color: 462872
        border_color: 13886461
        border_width: 2
        shadow_width: 0
        pad_all: 0
        scrollable: false
        disabled:
          text_opa: 80%
        widgets:
        - label:
            align: CENTER
            text: '-'
            text_color: 13886461
            text_font: roboto_30
    - button:
        id: climate_detail_plus
        x: 348
        y: 488
        width: 76
        height: 76
        radius: 38
        bg_color: 462872
        border_color: 13886461
        border_width: 2
        shadow_width: 0
        pad_all: 0
        scrollable: false
        disabled:
          text_opa: 80%
        widgets:
        - label:
            align: CENTER
            text: +
            text_color: 13886461
            text_font: roboto_30
    - obj:
        id: climate_detail_knob
        width: 46
        height: 46
        radius: 23
        bg_color: 13886461
        border_width: 4
        border_color: 16119802
        pad_all: 0
        scrollable: false
        clickable: false
        hidden: true
        disabled:
          opa: 65%
- label:
    id: climate_detail_state
    x: 200
    y: 207
    width: 400
    height: 30
    text: ''
    text_font: roboto_20
    text_color: '0xC4C7C5'
    text_align: CENTER
    long_mode: DOT
    clickable: false
- obj:
