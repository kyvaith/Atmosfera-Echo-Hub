# Global Wear OS status overlay.
# It sits on top_layer after app overlays, so the volume activation surface and
# transient system overlays stay consistent on home and application screens.

globals:
  - id: global_volume_time_press_tracking
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: global_volume_dragging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: global_volume_time_press_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: global_volume_time_press_start_x
    type: int
    restore_value: no
    initial_value: '400'
  - id: global_volume_time_press_start_y
    type: int
    restore_value: no
    initial_value: '36'
  - id: global_volume_drag_start_pct
    type: int
    restore_value: no
    initial_value: '50'
  - id: global_volume_knob_pct
    type: int
    restore_value: no
    initial_value: '50'
  - id: global_volume_pct
    type: int
    restore_value: no
    initial_value: '50'
  - id: global_volume_last_sent_pct
    type: int
    restore_value: no
    initial_value: '-1'
  - id: global_volume_last_send_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: global_volume_send_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: global_volume_activation_suppressed
    type: bool
    restore_value: no
    initial_value: 'false'

lvgl:
  top_layer:
    widgets:
      # One fixed chrome owner prevents weather/app roots from changing the
      # relative order of the two status glyphs independently.
      - obj:
          id: global_status_chrome
          x: 0
          y: 0
          width: ${display_width}
          height: ${display_height}
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          hidden: false
          widgets:
            - label:
                id: global_status_volume_icon
                text: "\uE050"
                x: ${home_volume_icon_x}
                y: ${home_status_icon_y}
                width: 48
                height: 52
                text_align: CENTER
                text_color: 0xFFFFFF
                text_font: material_symbols_44
                hidden: false
            - label:
                id: global_status_wifi_icon
                text: "\uE648"
                x: ${home_wifi_icon_x}
                y: ${home_wifi_icon_y}
                width: 58
                height: 60
                text_align: CENTER
                text_color: 0xFFFFFF
                text_font: material_symbols_58
                hidden: false

      - button:
          id: global_volume_activation_surface
          width: 180
          height: 52
          align: TOP_MID
          x: 0
          y: 10
          bg_opa: 0%
          border_width: 0
          outline_width: 0
          shadow_width: 0
          radius: 26
          pad_all: 0
          scrollable: false
          clickable: false
          hidden: false
          # Compatibility anchor for the direct volume renderer. It is
          # deliberately non-rendering; the visible status area belongs to
          # the M3 Home snapshot, never to this legacy overlay.
          widgets:
            - label:
                id: global_volume_activation_anchor
                text: ""
                x: -2
                y: -2
                width: 1
                height: 1
                hidden: true
                text_opa: 0%
                text_font: roboto_34

      - obj:
          id: global_volume_overlay
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
          bg_opa: 72%
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          widgets:
            - arc:
                id: global_volume_arc
                x: 35
                y: 35
                width: 730
                height: 730
                min_value: 0
                max_value: 100
                value: 50
                start_angle: 180
                end_angle: 360
                adjustable: false
                arc_color: 0x382949
                arc_width: 15
                arc_rounded: true
                bg_opa: 0%
                indicator:
                  arc_color: 0xF5EEFB
                  arc_width: 15
                  arc_rounded: true
                knob:
                  bg_opa: 0%
                  border_width: 0
                  width: 0
                  height: 0
            - obj:
                id: global_volume_knob
                x: 372
                y: 15
                width: 56
                height: 56
                radius: 28
                bg_color: 0xFFFFFF
                bg_opa: 100%
                border_width: 0
                shadow_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
            - obj:
                id: global_volume_value_scrim
                align: CENTER
                width: 800
                height: 800
                radius: 0
                bg_color: 0x000000
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
                widgets:
                  - label:
                      id: global_volume_pct_label
                      text: "50%"
                      align: CENTER
                      text_color: 0xF5EEFB
                      text_font: roboto_volume_112

      # One top banner and one fixed notification-center tree. C++ owns gestures
      # and the temporary shared scene background, released at final close.
      - obj:
          id: material_notification_root
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
          bg_opa: 0%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          widgets:
            - obj:
                id: material_notification_panel
                width: 600
                height: 264
                align: TOP_MID
                x: 0
                y: 96
                bg_color: 0x332E3C
                bg_opa: 100%
                border_width: 0
                outline_width: 0
                shadow_width: 0
                radius: 48
                pad_all: 0
                scrollable: false
                clickable: false
                widgets:
                  - label:
                      id: material_notification_icon
                      text: "\uE7F4"
                      x: 32
                      y: 24
                      width: 60
                      height: 60
                      text_color: 0xE9DDFF
                      text_font: material_symbols_36
                  - label:
                      id: material_notification_title
                      text: "Notification"
                      x: 92
                      y: 22
                      width: 476
                      height: 52
                      long_mode: DOT
                      text_color: 0xF5EEFB
                      text_font: roboto_30
                  - label:
                      id: material_notification_message
                      text: ""
                      x: 32
                      y: 88
                      width: 536
                      height: 150
                      long_mode: WRAP
                      text_color: 0xD9D2E0
                      text_font: roboto_24

      - obj:
          id: notification_center_root
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
