# Full-screen conversational surface. Runtime presentation and waveform
# rendering are owned by lvgl_material; this file contains only composition.
lvgl:
  top_layer:
    widgets:
      - obj:
          id: voice_assistant_overlay
          x: 0
          y: 0
          width: 800
          height: 800
          bg_color: 0x000000
          bg_opa: 100%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          clickable: true
          hidden: true
          widgets:
            - obj:
                id: voice_assistant_bottom_gradient
                x: 0
                y: 500
                width: 800
                height: 300
                bg_color: 0x000000
                bg_grad_color: 0x2D2136
                bg_grad_dir: VER
                bg_opa: 100%
                border_width: 0
                radius: 0
                pad_all: 0
                scrollable: false
                clickable: false

            - label:
                id: voice_assistant_status_label
                text: "Assistant"
                align: TOP_MID
                y: 28
                width: 520
                text_align: CENTER
                text_color: 0xA8A8AE
                text_font: roboto_20

            - obj:
                id: voice_assistant_transcript_panel
                x: 60
                y: 116
                width: 680
                height: 360
                bg_opa: 0%
                border_width: 0
                radius: 0
                pad_all: 0
                scrollable: false
                clickable: false
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_row: 22
                widgets:
                  - label:
                      id: voice_assistant_you_label
                      text: ""
                      width: 680
                      text_align: CENTER
                      text_color: 0x85858D
                      text_font: roboto_30
                      long_mode: WRAP
                  - label:
                      id: voice_assistant_response_label
                      text: ""
                      width: 680
                      text_align: CENTER
                      text_color: 0xFFFFFF
                      text_font: roboto_36
                      long_mode: WRAP

            - obj:
                id: voice_assistant_waveform
                x: 70
                y: 525
                width: 660
                height: 190
                bg_opa: 0%
                border_width: 0
                radius: 0
                pad_all: 0
                scrollable: false
                clickable: false
