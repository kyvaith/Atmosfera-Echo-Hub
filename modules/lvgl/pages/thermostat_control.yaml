id: thermostat_control_root
x: 70
y: 66
width: 660
height: 656
bg_opa: 0%
border_width: 0
pad_all: 0
scrollable: false
clickable: false
hidden: true
widgets:
  - label:
      id: thermostat_control_title
      align: TOP_MID
      width: 500
      height: 32
      text: ""
      text_align: CENTER
      text_font: roboto_24
      text_color: 0xC4C7C5
      long_mode: DOT
  - arc:
      id: thermostat_control_arc
      align: TOP_MID
      y: 44
      width: 600
      height: 600
      min_value: 0
      max_value: 1000
      value: 0
      start_angle: 135
      end_angle: 45
      adjustable: false
      arc_color: 0x071018
      arc_width: 28
      arc_rounded: true
      bg_opa: 0%
      indicator:
        arc_color: 0xD3E3FD
        arc_width: 28
        arc_rounded: true
      knob:
        bg_opa: 0%
        border_width: 0
        width: 0
        height: 0
  - label:
      id: thermostat_control_activity
      align: TOP_MID
      y: 203
      width: 270
      height: 34
      text: ""
      text_align: CENTER
      text_font: roboto_24
      text_color: 0xD3E3FD
      long_mode: CLIP
  - label:
      id: thermostat_control_target
      align: TOP_MID
      y: 259
      width: 440
      height: 82
      text: ""
      text_align: CENTER
      text_font: wear_title_53
      text_color: 0xF5F7FA
      long_mode: CLIP
  - label:
      id: thermostat_control_current
      align: TOP_MID
      y: 348
      width: 420
      height: 38
      text: ""
      text_align: CENTER
      text_font: roboto_24
      text_color: 0xC4C7C5
      long_mode: CLIP
  - label:
      id: thermostat_control_limits
      align: TOP_MID
      y: 424
      width: 282
      height: 34
      text: ""
      text_align: CENTER
      text_font: roboto_18
      text_color: 0xC4C7C5
      long_mode: CLIP
  - button:
      id: thermostat_control_minus
      x: 236
      y: 488
      width: 76
      height: 76
      radius: 38
      bg_color: 0x071018
      border_color: 0xD3E3FD
      border_width: 2
      shadow_width: 0
      pad_all: 0
      scrollable: false
      disabled:
        opa: 40%
      widgets:
        - label:
            align: CENTER
            text: "-"
            text_color: 0xD3E3FD
            text_font: roboto_30
  - button:
      id: thermostat_control_plus
      x: 348
      y: 488
      width: 76
      height: 76
      radius: 38
      bg_color: 0x071018
      border_color: 0xD3E3FD
      border_width: 2
      shadow_width: 0
      pad_all: 0
