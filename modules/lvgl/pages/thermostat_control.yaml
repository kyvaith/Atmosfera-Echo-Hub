      id: thermostat_control_knob
      width: 46
      height: 46
      radius: 23
      bg_color: 0xD3E3FD
      border_width: 4
      border_color: 0xF5F7FA
      pad_all: 0
      scrollable: false
      clickable: false
      hidden: true
      disabled:
        opa: 65%
