# Dedicated shared App6 view. Native owner controls state, gestures and visibility.
# Static SVG only; no new task, image cache or full-screen buffer.
id: remote_control_root
x: 0
y: 0
width: 800
height: 800
bg_opa: COVER
border_width: 0
pad_all: 0
radius: 0
clickable: false
scrollable: false
bg_color: '0x000000'
hidden: true
