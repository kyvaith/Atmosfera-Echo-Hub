            condition:
              lambda: 'return id(selected_light_control).prepare_entity_bind_response(payload.empty() ? std::string_view{} : std::string_view(payload.c_str(), payload.size()));'
            then:
              - api.respond:
                  data: !lambda 'id(selected_light_control).populate_entity_bind_response(root);'
            else:
              - api.respond:
                  success: false
                  error_message: "Entity control bind refused"
    - action: entity_control_update
