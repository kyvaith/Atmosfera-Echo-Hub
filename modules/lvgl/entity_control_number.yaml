# Explicit generic/Number product profile. The legacy package remains separate.
# Reuses app6, its widgets, captured lifecycle and existing Scalar for Light.
# Product admission remains the existing explicit root validation gate.
lvgl_material:
  tile_surfaces:
    - id: !extend home_material_tiles
      number_controls: true
      choice_controls: true
      cover_controls: true
      fan_controls: true
      humidifier_controls: true
      robot_controls: true
      panel_controls: true
      light_detail_controls: true
      on_entity_detail_control_press:
        - lambda: |-
            const std::string_view card = card_id == nullptr ? std::string_view{} : std::string_view(card_id);
            id(selected_light_control).open_light_detail(slot, card, revision);
      on_entity_control_press:
        - lambda: |-
            // Captured typed identity; never infer a kind after an await.
            const std::string_view card = card_id == nullptr ? std::string_view{} : std::string_view(card_id);
            if (control_kind == 0)
              id(selected_light_control).open(slot, card, revision);
            else if (control_kind == 1)
              id(selected_light_control).open_number(slot, card, revision);
            else if (control_kind == 2)
              id(selected_light_control).open_choice(slot, card, revision);
            else if (control_kind == 3)
              id(selected_light_control).open_cover(slot, card, revision);
            else if (control_kind == 4)
              id(selected_light_control).open_fan(slot, card, revision);
            else if (control_kind == 5)
              id(selected_light_control).open_humidifier(slot, card, revision);
            else if (control_kind == 6)
              id(selected_light_control).open_robot(slot, card, revision);
            else if (control_kind == 7)
              id(selected_light_control).open_panel(slot, card, revision);
  entity_controls:
    - id: selected_light_control
      lvgl_id: ui_lvgl
      root: light_control_root
      hit: light_control_scalar_region
      title_label: light_control_title
      value_label: light_control_authoritative_value
      unknown_value_label: light_control_unknown_value
      on_button: light_control_on_button
      off_button: light_control_off_button
      state_label: light_control_state
      status_label: light_control_status
      enabled: ${light_control_product_admitted}
      number_stepper: true
      climate_range_profile:
        enabled: ${climate_range_control_product_admitted}
        button: climate_detail_range
        label: climate_detail_range_label
      light_color_profile:
        enabled: ${light_color_control_product_admitted}
