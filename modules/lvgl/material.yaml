# Shared Material interaction behavior.
# Keep reusable state styling here; application-specific runtime logic belongs
# in its own module.

lvgl_material:
  weather_presenters:
    - id: home_weather_presenter
      root: controls_root_1
      temperature_label: home_weather_temperature
      condition_label: home_weather_condition
      detail_label: home_weather_range
      interaction_widget: tile_weather_button
      interaction_state_layer: weather_tile_feedback
      animation_layer: home_weather_animation_layer
      snapshot_page: controls_root_1
      # Refresh weather text separately. The presenter also freezes the
      # compact visible artwork rectangle into this page before a swipe;
      # neither operation captures the fixed status chrome or page dots.
      snapshot_region: home_weather_chip
      snapshot_refresh_delay: 120ms
      resume_delay: 300ms
      animations:
        - { key: clear-day, widget: weather_clear_day }
        - { key: clear-night, widget: weather_clear_night }
        - { key: partly-cloudy-day, widget: weather_partly_cloudy_day }
        - { key: partly-cloudy-night, widget: weather_partly_cloudy_night }
        - { key: overcast, widget: weather_overcast }
        - { key: rain, widget: weather_rain }
        - { key: snow, widget: weather_snow }
        - { key: thunderstorms, widget: weather_thunderstorms }
        - { key: fog, widget: weather_fog }
  # Fixed object pool for HA-configurable cards. Only text, icon and colors are
  # updated at runtime; the LVGL tree is never rebuilt while the device runs.
  tile_surfaces:
    - id: home_material_tiles
      require_snapshot_ready: true
      action_availability: true
      control_press_enabled: true
      on_control_press:
        - lvgl_material.entity_control.open:
            id: selected_light_control
            slot: !lambda 'return slot;'
            card_id: !lambda 'return std::string(card_id);'
            revision: !lambda 'return revision;'
      tiles:
        - { slot: 0, widget: tile_light_button, icon_label: tile_light_icon, title_label: tile_light_title, subtitle_label: tile_light_subtitle, always_hidden: true }
        - { slot: 1, widget: tile_climate_button, icon_label: tile_climate_icon, title_label: tile_climate_title, subtitle_label: tile_climate_subtitle, always_hidden: true }
        - { slot: 2, widget: tile_cover_button, icon_label: tile_cover_icon, title_label: tile_cover_title, subtitle_label: tile_cover_subtitle }
        - { slot: 3, widget: tile_lock_button, icon_label: tile_lock_icon, title_label: tile_lock_title, subtitle_label: tile_lock_subtitle }
        - { slot: 4, widget: tile_alarm_button, icon_label: tile_alarm_icon, title_label: tile_alarm_title, subtitle_label: tile_alarm_subtitle }
        - { slot: 5, widget: tile_garage_button, icon_label: tile_garage_icon, title_label: tile_garage_title, subtitle_label: tile_garage_subtitle }
        - { slot: 6, widget: tile_fan_button, icon_label: tile_fan_icon, title_label: tile_fan_title, subtitle_label: tile_fan_subtitle }
        - { slot: 7, widget: tile_fan_speed_button, icon_label: tile_fan_speed_icon, title_label: tile_fan_speed_title, subtitle_label: tile_fan_speed_subtitle }
        - { slot: 8, widget: tile_switch_button, icon_label: tile_switch_icon, title_label: tile_switch_title, subtitle_label: tile_switch_subtitle }
        - { slot: 9, widget: tile_scene_button, icon_label: tile_scene_icon, title_label: tile_scene_title, subtitle_label: tile_scene_subtitle }
        - { slot: 10, widget: tile_trigger_button, icon_label: tile_trigger_icon, title_label: tile_action_title, subtitle_label: tile_trigger_subtitle }
        - { slot: 11, widget: tile_door_window_button, icon_label: tile_window_icon, title_label: home_windows_title, subtitle_label: tile_window_subtitle }
        - { slot: 12, widget: tile_presence_button, icon_label: tile_presence_icon, title_label: home_presence_title, subtitle_label: tile_presence_subtitle }
        - { slot: 13, widget: tile_sensor_button, icon_label: tile_sensor_icon, title_label: tile_sensor_title, subtitle_label: tile_sensor_value }
        - { slot: 14, widget: tile_clock_button, icon_label: tile_clock_icon, title_label: tile_clock_title, subtitle_label: tile_clock_value }
        - { slot: 15, widget: tile_webhook_button, icon_label: tile_webhook_icon, title_label: tile_trigger_title, subtitle_label: home_run_title }
        - { slot: 16, widget: tile_extra_16, icon_label: tile_extra_icon_16, title_label: tile_extra_title_16, subtitle_label: tile_extra_value_16 }
        - { slot: 17, widget: tile_extra_17, icon_label: tile_extra_icon_17, title_label: tile_extra_title_17, subtitle_label: tile_extra_value_17 }
        - { slot: 18, widget: tile_extra_18, icon_label: tile_extra_icon_18, title_label: tile_extra_title_18, subtitle_label: tile_extra_value_18 }
        - { slot: 19, widget: tile_extra_19, icon_label: tile_extra_icon_19, title_label: tile_extra_title_19, subtitle_label: tile_extra_value_19 }
        - { slot: 20, widget: tile_extra_20, icon_label: tile_extra_icon_20, title_label: tile_extra_title_20, subtitle_label: tile_extra_value_20 }
        - { slot: 21, widget: tile_extra_21, icon_label: tile_extra_icon_21, title_label: tile_extra_title_21, subtitle_label: tile_extra_value_21 }
        - { slot: 22, widget: tile_extra_22, icon_label: tile_extra_icon_22, title_label: tile_extra_title_22, subtitle_label: tile_extra_value_22 }
        - { slot: 23, widget: tile_extra_23, icon_label: tile_extra_icon_23, title_label: tile_extra_title_23, subtitle_label: tile_extra_value_23 }
        - { slot: 24, widget: tile_extra_24, icon_label: tile_extra_icon_24, title_label: tile_extra_title_24, subtitle_label: tile_extra_value_24 }
        - { slot: 25, widget: tile_extra_25, icon_label: tile_extra_icon_25, title_label: tile_extra_title_25, subtitle_label: tile_extra_value_25 }
        - { slot: 26, widget: tile_extra_26, icon_label: tile_extra_icon_26, title_label: tile_extra_title_26, subtitle_label: tile_extra_value_26 }
        - { slot: 27, widget: tile_extra_27, icon_label: tile_extra_icon_27, title_label: tile_extra_title_27, subtitle_label: tile_extra_value_27 }
        - { slot: 28, widget: tile_extra_28, icon_label: tile_extra_icon_28, title_label: tile_extra_title_28, subtitle_label: tile_extra_value_28 }
        - { slot: 29, widget: tile_extra_29, icon_label: tile_extra_icon_29, title_label: tile_extra_title_29, subtitle_label: tile_extra_value_29 }
        - { slot: 30, widget: tile_extra_30, icon_label: tile_extra_icon_30, title_label: tile_extra_title_30, subtitle_label: tile_extra_value_30 }
        - { slot: 31, widget: tile_extra_31, icon_label: tile_extra_icon_31, title_label: tile_extra_title_31, subtitle_label: tile_extra_value_31 }
      on_press:
        - homeassistant.action:
            action: atmosfera_echo_hub.report_tile_press
            variables:
              node_name: !lambda 'return App.get_name();'
              tile_slot: !lambda 'return std::to_string(slot);'
            data_template:
              node_name: "{{ node_name }}"
              slot: "{{ tile_slot }}"
      on_context_press:
        - homeassistant.action:
            action: atmosfera_echo_hub.report_tile_context_press
            variables:
              node_name: !lambda 'return App.get_name();'
              tile_slot: !lambda 'return std::to_string(slot);'
              tile_card_id: !lambda 'return std::string(card_id);'
              tile_revision: !lambda 'return std::to_string(revision);'
            data_template:
              node_name: "{{ node_name }}"
              slot: "{{ tile_slot }}"
              card_id: "{{ tile_card_id }}"
              revision: "{{ tile_revision }}"

  notification_overlays:
    - id: material_notification_overlay
      root: material_notification_root
      container: material_notification_panel
      icon_label: material_notification_icon
      title_label: material_notification_title
      subtitle_label: material_notification_message
      scrim_opacity: 68%
      duration: 6s
      from_top: true

  notification_centers:
    - id: notification_center
      navigation_id: ui_navigation
      banner_id: material_notification_overlay
      root: notification_center_root
      heading: notification_center_heading
      status: notification_center_status
      detail: notification_center_detail
      detail_view: notification_center_detail_view
      detail_action: notification_center_detail_action
      list_view: notification_center_list
      empty_view: notification_center_empty
      empty_heading: notification_center_empty_heading
      history_scroll: true
      isolate_native_layers: true
      cached_backdrop_dim: true
      direct_presentation: true
      backdrop_dim_shift: 2
      row_snapshot_cache: true
      row_cache_band_count: 2
      row_cache_min_free_bytes: 1048576
      row_pitch: 188
      close_edge_pixels: 50
      close_commit_pixels: 36
      transition_duration: 240ms
      now_provider: !lambda |-
        const auto now = id(ha_time).now();
        return now.is_valid() ? static_cast<uint32_t>(now.timestamp) : 0U;
      text_provider: !lambda |-
        static const char *const keys[] = {
          "notification_center.title", "notification_center.empty",
          "notification_center.loading", "notification_center.timeout",
          "notification_center.source", "notification_center.now",
          "notification_center.minute", "notification_center.hour", "notification_center.day",
          "notification_center.camera", "notification_center.camera_home"
        };
        return text_id < 11 ? id(ui_i18n).translate(keys[text_id]) : "";
      edge_pixels: 40
      commit_pixels: 60
      dismiss_commit_pixels: 36
      admitted: !lambda |-
        return id(boot_sequence_done) && !id(ui_snapshot_io_busy) &&
               !id(ui_light_preparation_owned) &&
               !id(selected_light_control).owner().has_selection() &&
               !id(selected_light_control).owner().is_open_pending() &&
               !id(ui_open_selected_light).is_running() &&
               !id(global_volume_renderer).is_active();
      scene_controllers:
        - home_weather_presenter
        - immich_slideshow
        - camera_stream_presenter
        - light_control_renderer
      rows:
        - {root: notification_row_0, title: notification_title_0, message: notification_message_0, source_label: notification_source_0, age_label: notification_age_0}
        - {root: notification_row_1, title: notification_title_1, message: notification_message_1, source_label: notification_source_1, age_label: notification_age_1}
        - {root: notification_row_2, title: notification_title_2, message: notification_message_2, source_label: notification_source_2, age_label: notification_age_2}
        - {root: notification_row_3, title: notification_title_3, message: notification_message_3, source_label: notification_source_3, age_label: notification_age_3}
        - {root: notification_row_4, title: notification_title_4, message: notification_message_4, source_label: notification_source_4, age_label: notification_age_4}
        - {root: notification_row_5, title: notification_title_5, message: notification_message_5, source_label: notification_source_5, age_label: notification_age_5}
        - {root: notification_row_6, title: notification_title_6, message: notification_message_6, source_label: notification_source_6, age_label: notification_age_6}
        - {root: notification_row_7, title: notification_title_7, message: notification_message_7, source_label: notification_source_7, age_label: notification_age_7}
      on_request:
        - homeassistant.action:
            action: atmosfera_echo_hub.report_notification
            variables:
              node_name: !lambda 'return App.get_name();'
              notification_payload: !lambda 'return payload;'
            data_template:
              node_name: "{{ node_name }}"
              payload: "{{ notification_payload }}"

  voice_assistants:
    - id: voice_assistant_presenter
      root: voice_assistant_overlay
      status_label: voice_assistant_status_label
      user_label: voice_assistant_you_label
      assistant_label: voice_assistant_response_label
      waveform: voice_assistant_waveform
      frame_rate: 30
      primary_color: ${home_accent_color}
      secondary_color: 0x4FC3F7
      tertiary_color: 0x26A69A
      gradient_bottom_color: 0x071018
      gradient_start: 62.5%

  wavy_progress:
    - id: media_wavy_progress
      widget: media_main_progress_arc

  direct_marquees:
    - id: media_title_marquee
      label: title_label
      viewport: title_marquee_viewport

  # The camera and gallery loaders are embedded Material 3 Lottie widgets.
  # They stay inside their bounded 96px object and do not invalidate the full
  # 800px display on every tick.

  direct_volume_overlays:
    - id: global_volume_renderer
      arc: global_volume_arc
      knob: global_volume_knob
      label: global_volume_pct_label
      activation_widget: global_volume_activation_surface
      scrim_opacity: 72%
      scene_controllers:
        - home_weather_presenter
        - immich_slideshow
        - camera_stream_presenter
        - light_control_renderer

  pressed_styles:
    - id: shared_pressed_feedback
      widgets:
        - settings_true_colour_button
        - settings_screen_tone_button
        - settings_perf_overlay_button
        - settings_system_logs_button
        - settings_perf_logs_button
        - settings_swipe_logs_button
        - settings_beta_firmware_button
        - settings_display_brightness_button
        - settings_display_timeout_button
        - settings_auto_home_button
        - settings_voice_mute_button
        - settings_wake_sound_button
        - settings_wake_sensitivity_button
        - tile_light_button
        - tile_switch_button
        - tile_scene_button
        - tile_trigger_button
        - tile_climate_button
        - tile_cover_button
        - tile_garage_button
        - tile_lock_button
        - tile_alarm_button
        - tile_door_window_button
        - tile_presence_button
        - tile_sensor_button
        - tile_clock_button
        - tile_camera_button
        - tile_media_button
        - tile_subpage_button
        - tile_fan_button
        - tile_fan_speed_button
        - tile_webhook_button
        - tile_internal_button
        - tile_settings_button
        - tile_voice_button
        - home_mic_button
      pressed_opacity: 70%

  # Transport controls use a direct state layer to avoid redrawing the
  # full-screen artwork while a button is held.
  direct_state_layers:
    - id: weather_tile_feedback
      widgets:
        - tile_weather_button
      pressed_opacity: 12%

    - id: media_transport_feedback
      widgets:
        - prev_button
        - next_button
      pressed_opacity: 12%
